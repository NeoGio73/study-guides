<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carbohydrates Study Guide</title>
<style>
/* Layout: one 920px column. Pill tabs on top (Roadmap + 9 numbered sections), each section a
   scrolling page of explorers, key facts and practice. Same look as the earlier study guides. */
:root{
  --bg:#ffffff; --ink:#1b2430; --muted:#566070; --line:#d6dbe3; --soft:#f3f5f8; --ctl:#8b95a3;
  /* color language: amber = anomeric (carbonyl) carbon and glycosidic bonds, teal = sugar residues, violet = protein or lipid partner */
  --a-bg:#fff1dc; --a-line:#dd962a; --a-ink:#7a4300;
  --b-bg:#ddf2ee; --b-line:#2c9383; --b-ink:#0a564c;
  --r-bg:#ebe7f8; --r-line:#7560c4; --r-ink:#3e2c85;
  --accent:#1f3a5f; --accent-d:#152b49; --on-accent:#ffffff;
  --ok:#17693f; --ok-bg:#e4f4ea; --ok-ink:#0f4a2c;
  --bad:#a3241d; --bad-bg:#fcebe9; --bad-ink:#6f1712;
  --warn:#6f4b00; --warn-bg:#fff5d9; --warn-line:#c98f12;
  --info:#274b7a; --info-bg:#e9f0fa; --info-line:#5a86c4;
  --focus:#4c7fd6;
  /* chart series (validated order) and sugar symbols */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#e3e7ec;
  --glc:#0072bc; --gal:#ffd400; --sia:#a54399; --man:#00a651; --cu:#3d8fd9; --cu2o:#b5492c; --fuc:#e0282e; --xyl:#f47920; --ido:#a17a4d; --symw:#ffffff;
  --water:#d9ecfb; --chl:#f6e7b8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131921; --ink:#e7ecf3; --muted:#9daabb; --line:#2f3a49; --soft:#1b2430; --ctl:#66748a;
    --a-bg:#3a2a10; --a-line:#d69a3a; --a-ink:#f5cf8e;
    --b-bg:#10332e; --b-line:#3fae9c; --b-ink:#9be0d3;
    --r-bg:#2a2447; --r-line:#9484df; --r-ink:#cdc4f7;
    --accent:#9dbcf0; --accent-d:#b9cff5; --on-accent:#10203a;
    --ok:#5fcf93; --ok-bg:#12301f; --ok-ink:#b4ecc9;
    --bad:#f08a80; --bad-bg:#3a1714; --bad-ink:#f8c4bd;
    --warn:#f0c45c; --warn-bg:#33290e; --warn-line:#c98f12;
    --info:#a9c6f0; --info-bg:#172840; --info-line:#5a86c4;
    --focus:#8fb4f5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a3442;
    --water:#1b3550; --chl:#4a3d14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131921; --ink:#e7ecf3; --muted:#9daabb; --line:#2f3a49; --soft:#1b2430; --ctl:#66748a;
  --a-bg:#3a2a10; --a-line:#d69a3a; --a-ink:#f5cf8e;
  --b-bg:#10332e; --b-line:#3fae9c; --b-ink:#9be0d3;
  --r-bg:#2a2447; --r-line:#9484df; --r-ink:#cdc4f7;
  --accent:#9dbcf0; --accent-d:#b9cff5; --on-accent:#10203a;
  --ok:#5fcf93; --ok-bg:#12301f; --ok-ink:#b4ecc9;
  --bad:#f08a80; --bad-bg:#3a1714; --bad-ink:#f8c4bd;
  --warn:#f0c45c; --warn-bg:#33290e; --warn-line:#c98f12;
  --info:#a9c6f0; --info-bg:#172840; --info-line:#5a86c4;
  --focus:#8fb4f5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a3442;
  --water:#1b3550; --chl:#4a3d14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.app{max-width:920px;margin:0 auto;padding-block:20px 56px;padding-inline:16px}
sub,sup{font-size:.72em;line-height:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--sans)}
a{color:var(--accent)}
[hidden]{display:none!important}

/* Header */
.top h1{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 .4rem;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:66ch}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px 6px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button:not([data-n]){padding-left:13px}
.tabs .tn{display:inline-grid;place-items:center;min-width:1.65em;height:1.65em;border-radius:999px;background:var(--soft);font-size:.8rem;padding:0 .25em}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .tn{background:var(--bg);color:var(--ink)}
.tabs button:not([aria-selected="true"]):hover{border-color:var(--accent)}

/* Headings and text */
h2{font-family:var(--serif);font-weight:600;font-size:1.55rem;line-height:1.2;margin:0 0 .35rem;text-wrap:balance}
h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.25;margin:0 0 .3rem;text-wrap:balance}
h4{font-size:.95rem;margin:0 0 .3rem}
p{margin:0 0 .7rem}
.lede{margin:0 0 6px;max-width:68ch}
.src{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 12px;max-width:68ch}
.small{font-size:.88rem;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 22px;font-size:.88rem}
.jump span{color:var(--muted);font-weight:600}
.jump a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 9px;background:var(--bg)}
.jump a:hover{border-color:var(--accent)}
.block{margin:0 0 30px;padding-top:22px;border-top:1px solid var(--line)}
.block:first-of-type{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ta{color:var(--a-ink);font-weight:600} .tb{color:var(--b-ink);font-weight:600} .tr{color:var(--r-ink);font-weight:600}

/* Buttons and small controls */
.btn{appearance:none;font:inherit;font-weight:600;font-size:.93rem;border-radius:8px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);padding:7px 13px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.sm{padding:3px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.row.gap{margin:10px 0}
.lab{font-size:.88rem;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;font:inherit;font-size:.88rem;border:0;background:var(--bg);color:var(--ink);padding:6px 11px;cursor:pointer;border-left:1.5px solid var(--line);margin-left:-1.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:focus-visible{outline-offset:-3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.86rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] .small,.btn[aria-pressed="true"] .small{color:inherit}
select.sel,input.num{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--ctl);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 5.5em;gap:6px 12px;align-items:center;margin:6px 0}
.slider output{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:.92rem}
.slider label{font-size:.92rem;font-weight:600}

/* Panels */
.panel{border:1.5px solid var(--line);border-radius:14px;padding:18px 18px 16px}
.stage{background:var(--soft);border-radius:10px;padding:12px}
.stage.plain{background:var(--bg);border:1px solid var(--line)}
.scroll{overflow-x:auto}
/* a drawing is centered when it fits and starts at the left edge when it has to scroll */
.stage.scroll>svg{flex:none}
.stage.scroll>svg:only-child{display:block;margin-left:auto;margin-right:auto}
.stage.scroll>svg:first-child{margin-left:auto}
.stage.scroll>svg:last-child{margin-right:auto}
.scroll.ov::after{content:"Swipe or scroll sideways to see the rest →";display:block;position:sticky;left:0;width:max-content;max-width:100%;margin-top:6px;font-size:.78rem;color:var(--muted)}
.detail{border-left:5px solid var(--accent);background:var(--soft);border-radius:10px;padding:13px 16px;margin-top:12px}
.detail p:last-child,.detail ul:last-child{margin-bottom:0}
.detail ul{margin:0 0 8px;padding-left:1.2em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 20px}
.grid2>*{min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.facts{margin:0;padding-left:1.15em;max-width:72ch}
.facts li{margin-bottom:7px}
.facts li::marker{color:var(--muted)}
.cols{columns:2 340px;column-gap:28px}
.cols .fgroup{break-inside:avoid;margin-bottom:14px}
figure{margin:0}
figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;max-width:72ch}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:6px 10px 6px 0;border-bottom:1.5px solid var(--line);vertical-align:bottom}
.tbl td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.on td{background:var(--info-bg)}
.tbl caption{caption-side:bottom;text-align:left;font-size:.82rem;color:var(--muted);padding-top:6px}
details.more{margin-top:12px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more[open]>summary{margin-bottom:8px}

/* Feedback */
.fb{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;border-left:5px solid;gap:10px;align-items:flex-start}
.fb.show{display:flex}
.fb .ic{font-weight:700;font-size:1.05rem;line-height:1.5}
.fb p{margin:0} .fb p+p{margin-top:6px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.fb.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.fb.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:10px 0 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}

/* Practice */
.problem{border:1.5px solid var(--line);border-radius:14px;padding:20px 20px 18px}
.qkind{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.q{font-size:1.08rem;margin:0 0 14px;max-width:64ch}
.qfig{margin:0 0 14px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--ctl);border-radius:9px;padding:8px 13px;background:var(--bg)}
.opt input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.opt.right span{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.wrong span{border:2px dashed var(--bad);background:var(--bad-bg);color:var(--bad-ink);box-shadow:none}
.opt input:disabled{cursor:default}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ansrow label{font-weight:600}
.pin{font:inherit;font-size:1.05rem;width:9em;max-width:100%;padding:7px 10px;border:1.5px solid var(--ctl);border-radius:8px;color:var(--ink);background:var(--bg)}
.pin.wide{width:14em}
.pin.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.pin.no{border:2px dashed var(--bad);background:var(--bad-bg)}
.unit{font-size:1.02rem}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:ord}
.order li{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ctl);border-radius:9px;padding:5px 8px 5px 12px;background:var(--bg);counter-increment:ord}
.order li::before{content:counter(ord);font-weight:700;color:var(--muted);min-width:1.2em}
.order li .t{flex:1;min-width:0}
.order li button{appearance:none;font:inherit;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;width:2em;height:2em;cursor:pointer}
.order li button:disabled{opacity:.35;cursor:default}
.order.right li{border-color:var(--ok);background:var(--ok-bg)}
.orderlab{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:0 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally{font-size:.9rem;color:var(--muted);margin:12px 2px 0}
.setup{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.setup ol{margin:0;padding-left:1.25em} .setup li{margin-bottom:4px}

/* Stepper */
.steps-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{appearance:none;width:1.75em;height:1.75em;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:0}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dots button.done{background:var(--soft)}
.steptext{border-left:5px solid var(--accent);background:var(--soft);border-radius:10px;padding:12px 16px;margin-top:12px;min-height:5.5em}
.steptext h4{font-size:1rem;margin:0 0 4px}
.steptext p{margin:0}
.track{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;list-style:none;margin:0;padding:0}
.track li{flex:1 1 120px;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:.86rem;color:var(--muted);position:relative}
.track li b{display:block;color:var(--ink);font-size:.9rem}
.track li.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.track li.on::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.track li.was{background:var(--soft)}
.form{display:inline-block;margin-top:4px;border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:600;background:var(--a-bg);color:var(--a-ink);border:1px solid var(--a-line)}

/* Flow (pathway) lists */
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0;padding:0;list-style:none}
.flow.center{align-items:center}
.met{border:1.5px solid var(--line);border-radius:9px;padding:5px 11px;background:var(--bg);font-weight:600;font-size:.93rem}
.met.a{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.met.b{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.met.r{background:var(--r-bg);border-color:var(--r-line);color:var(--r-ink)}
.met.dim{opacity:.38}
.met.hot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.met.pile{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--bad)}
.rx{display:flex;align-items:center;gap:8px;padding:3px 0 3px 16px;font-size:.84rem;color:var(--muted)}
.rx::before{content:"↓";font-size:1.15rem;color:var(--ink);line-height:1}
.rx.h::before{content:"→"}
.rx b{color:var(--ink);font-weight:600}
.rx.blocked{color:var(--bad)} .rx.blocked::before{content:"✕";color:var(--bad);font-weight:700}
.rx .cof{border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--soft);white-space:nowrap}
.lanes{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lane{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.lane h4{margin:0 0 8px}
.lane.off{opacity:.45}

/* Lipid assembler blocks */
.lipid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 0;align-items:stretch;margin:6px 0}
.lipid .bb{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;background:var(--r-bg);border:2px solid var(--r-line);color:var(--r-ink);font-weight:700;border-radius:10px;padding:10px 6px;font-size:.92rem}
.lipid .rows{display:grid;gap:8px;padding:4px 0}
.lipid .lr{display:flex;align-items:center;min-width:0}
.lipid .lk{font-size:.74rem;color:var(--muted);padding:0 6px;white-space:nowrap;position:relative}
.lipid .lk::after{content:"";position:absolute;left:0;right:0;bottom:-2px;border-bottom:2px solid var(--ctl)}
.blk{border:2px solid;border-radius:9px;padding:5px 10px;font-weight:600;font-size:.9rem;min-width:0}
.blk.tail{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink);flex:1 1 auto;max-width:330px}
.blk.tail.short{flex:0 0 auto}
.blk.bbt{background:var(--r-bg);border-color:var(--r-line);color:var(--r-ink);flex:1 1 auto;max-width:330px}
.blk.head{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.blk.oh{background:var(--bg);border-color:var(--ctl);border-style:dashed;color:var(--muted)}
.blk.p{background:var(--bg);border-color:var(--ink);color:var(--ink);border-radius:50%;width:2.1em;height:2.1em;padding:0;display:inline-grid;place-items:center;flex:0 0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin:8px 0 0;padding:0;list-style:none}
.legend li{display:inline-flex;align-items:center;gap:6px}
.sw{width:.95em;height:.95em;border-radius:3px;border:1.5px solid;display:inline-block}
.sw.a{background:var(--a-bg);border-color:var(--a-line)} .sw.b{background:var(--b-bg);border-color:var(--b-line)} .sw.r{background:var(--r-bg);border-color:var(--r-line)}
.sw.s1{background:var(--s1);border-color:var(--s1)} .sw.s2{background:var(--s2);border-color:var(--s2)} .sw.s3{background:var(--s3);border-color:var(--s3)}
.sw.s4{background:var(--s4);border-color:var(--s4)} .sw.s5{background:var(--s5);border-color:var(--s5)}

/* Meter */
.meter2{position:relative;height:14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:20px 0 4px}
.meter2 .zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--b-bg);border-inline:1.5px solid var(--b-line)}

<script>

  const at = []; for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) at.push(i + firstChiral(kind));

/* ---------- Fischer projection ---------- */
// o: {click, hi:[carbon numbers], ref:true, top:'label', bottom:'label', small:true, noNum:true}
function fischerSVG(kind, cfg, o){

/* ---------- Haworth perspective formulas ---------- */
const SUB2 = t => t.replace(/_(\d)/g, '<tspan baseline-shift="sub" font-size="8.5">$1</tspan>').replace(/\^([^ ]+)/g, '<tspan baseline-shift="super" font-size="8.5">$1</tspan>');
// A ring is drawn from a list of vertices; each carbon gets an "up" and a "down" label.
function haworthDraw(V, subs, o){

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Haworth perspective formula of ' + o.label + '">';
  const n = V.length;

  for(let i = 0; i < n; i++){ const a = V[i], b = V[(i + 1) % n], front = i === low, side = i === (low + n - 1) % n || i === (low + 1) % n;
    s += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="currentColor" stroke-width="' + (front ? 5 : side ? 3 : 1.6) + '" stroke-linecap="round"/>'; }

          '<text x="' + (x2 + 9) + '" y="' + (v.y + 4.5) + '" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--a-ink)">O</text>'; }

        '<text x="' + (wide ? v.x - 6 : v.x) + '" y="' + (up ? y2 - 4 : y2 + 12) + '" text-anchor="' + (wide ? 'start' : 'middle') + '" font-size="' + (big ? 12 : 10.5) + '"' + (big ? ' font-weight="700" ' : ' ') + (big ? col : 'style="fill:var(--muted)"') + '>' + SUB2(t) + '</text>'; };

function haworthFur(which, anomer, o){

    '<button role="tab" id="tab-' + t.id + '" data-tab="' + t.id + '"' + (t.n ? ' data-n="' + t.n + '"' : '') + ' aria-selected="' + (state.tab === t.id) + '">' +

/* ---------- Practice engine ---------- */
const quiz = {};
function drawQuestion(id){
  const S = quiz[id];
  if(!S.bag.length){ S.bag = shuffle(BANK[id].map((x, i) => i)); if(S.bag.length > 1 && S.bag[S.bag.length - 1] === S.last){ S.bag.unshift(S.bag.pop()); } }
  S.last = S.bag.pop();
  const item = BANK[id][S.last];
  const Q = typeof item === 'function' ? item() : Object.assign({}, item);
  if(Q.k === 'mc') Q.opts = shuffle([Q.c].concat(Q.w));
  if(Q.k === 'order'){ let o; let guard = 0; do { o = shuffle(Q.items); guard++; } while(guard < 20 && orderOK(o)); Q.cur = o; }
  S.Q = Q; S.misses = 0; S.done = false; S.hint = false; S.killed = [];
}
const orderOK = arr => arr.every((x, i) => i === 0 || arr[i - 1].r <= x.r);
const KIND = {mc: 'Choose one', num: 'Calculate', order: 'Put in order', fa: 'Write the shorthand'};
function mountQuiz(el, id){
  if(!quiz[id]) quiz[id] = {bag: [], Q: null, solved: 0, streak: 0, seen: 0};
  const S = quiz[id];
  if(!S.Q) drawQuestion(id);
  el.innerHTML = '<article class="problem" aria-label="Practice question"></article><p class="tally"></p>';
  const box = $('.problem', el), tally = $('.tally', el);
  function paint(focus){
    const Q = S.Q;
    let body = '';
    if(Q.k === 'mc'){
      body = '<ul class="opts" role="radiogroup" aria-label="Answer choices">' + Q.opts.map((o, i) => {
        const dead = S.killed.indexOf(o) >= 0, right = S.done && o === Q.c;
        return '<li><label class="opt' + (right ? ' right' : dead ? ' wrong' : '') + '"><input type="radio" name="q-' + id + '" value="' + i + '"' + (dead || S.done ? ' disabled' : '') + '><span>' + o + '</span></label></li>';
      }).join('') + '</ul>';
    } else if(Q.k === 'num' || Q.k === 'fa'){
      body = '<div class="ansrow"><label for="pin-' + id + '">Your answer</label>' +
        '<input id="pin-' + id + '" class="pin' + (Q.k === 'fa' ? ' wide' : '') + '" type="text" autocomplete="off" spellcheck="false"' + (Q.k === 'fa' ? ' placeholder="18:1(Δ9)"' : ' inputmode="decimal"') + (S.done ? ' disabled' : '') + '>' +
        (Q.unit ? '<span class="unit">' + Q.unit + '</span>' : '') + '</div>';
    } else if(Q.k === 'order'){
      body = '<div class="orderlab"><span>' + (Q.top || 'First') + ' (top)</span><span>' + (Q.bottom || 'Last') + ' (bottom)</span></div>' +
        '<ol class="order' + (S.done ? ' right' : '') + '">' + Q.cur.map((it, i) =>
        '<li><span class="t">' + it.t + '</span>' +
        '<button type="button" data-mv="-1" data-i="' + i + '" aria-label="Move up: ' + it.t.replace(/<[^>]+>/g, '') + '"' + (i === 0 || S.done ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" data-mv="1" data-i="' + i + '" aria-label="Move down: ' + it.t.replace(/<[^>]+>/g, '') + '"' + (i === Q.cur.length - 1 || S.done ? ' disabled' : '') + '>↓</button></li>').join('') + '</ol>';
    }
    box.innerHTML =
      '<p class="qkind">' + KIND[Q.k] + '</p>' +
      (Q.fig ? '<div class="qfig scroll">' + Q.fig + '</div>' : '') +
      '<p class="q" id="qt-' + id + '">' + Q.q + '</p>' +
      (S.hint && Q.setup ? '<div class="setup"><ol>' + Q.setup.map(x => '<li>' + x + '</li>').join('') + '</ol></div>' : '') +
      '<form novalidate autocomplete="off">' + body +
      '<div class="fb" role="status" aria-live="polite"></div>' +
      '<div class="actions">' +
        (S.done ? '<button type="button" class="btn primary" data-act="next">Next question</button>'
                : '<button type="submit" class="btn primary">Check answer</button>' +
                  ((Q.hint || Q.setup) && !S.hint ? '<button type="button" class="btn" data-act="hint">' + (Q.setup ? 'Show the setup' : 'Hint') + '</button>' : '') +
                  (S.misses > 0 ? '<button type="button" class="btn" data-act="show">Show answer</button>' : '')) +
      '</div></form>';
    if(S.fb) setFb(S.fb[0], S.fb[1]);
    tally.textContent = S.solved ? ('Answered correctly: ' + S.solved + ' of ' + S.seen + (S.streak > 1 ? ' · ' + S.streak + ' in a row' : '')) : 'Questions are drawn at random, and numbers change each time. Nothing here is graded.';
    if(focus){ const f = $('[data-act="next"]', box) || $('.pin', box) || $('.opt input:not(:disabled)', box) || $('.order button:not(:disabled)', box); if(f) f.focus({preventScroll: true}); }

    S.fb = [type, html];

      if(val === Q.c){ finish(true); return; }
      S.killed.push(val); S.misses++;
      if(S.misses >= 2 || Q.opts.length - S.killed.length <= 1){ finish(false); return; }
      S.fb = ['bad', '<p><b>Not that one.</b> ' + (Q.hint ? Q.hint : 'Try again.') + '</p>']; paint(true);
    } else if(Q.k === 'num'){
      const inp = $('.pin', box), raw = inp.value.trim().replace(/,/g, '').replace(/[−–]/g, '-').replace(/\s*[x×]\s*10\^?\s*/i, 'e');

      if(Math.abs(v - Q.a) <= tol + 1e-9){ finish(true); return; }

      if(S.misses >= 3){ finish(false); return; }
      const keep = inp.value; S.fb = ['bad', '<p><b>Not yet.</b> ' + msg + '</p>']; paint(false);
      const again = $('.pin', box); again.value = keep; again.classList.add('no'); again.focus({preventScroll: true}); again.select();
    } else if(Q.k === 'fa'){
      const inp = $('.pin', box), r = checkShort(inp.value, Q.c, Q.d);
      if(r.ok){ finish(true); return; }
      S.misses++;
      if(S.misses >= 3){ finish(false); return; }
      const keep = inp.value; S.fb = ['bad', '<p><b>Not yet.</b> ' + r.msg + '</p>']; paint(false);
      const again = $('.pin', box); again.value = keep; again.classList.add('no'); again.focus({preventScroll: true});
    } else if(Q.k === 'order'){
      if(orderOK(Q.cur)){ finish(true); return; }
      S.misses++;
      if(S.misses >= 3){ finish(false); return; }
      let ok = 0; while(ok < Q.cur.length && Q.cur[ok].r === Q.items[ok].r) ok++;
      S.fb = ['bad', '<p><b>Not yet.</b> ' + (ok ? 'The top ' + ok + (ok === 1 ? ' is' : ' are') + ' in the right place. ' : '') + (Q.hint || '') + '</p>']; paint(false);
    }
  }
  box.addEventListener('submit', e => { e.preventDefault(); check(); });
  box.addEventListener('click', e => {
    const mv = e.target.closest('button[data-mv]');
    if(mv){ const Q = S.Q, i = +mv.dataset.i, j = i + (+mv.dataset.mv); const t = Q.cur[i]; Q.cur[i] = Q.cur[j]; Q.cur[j] = t; S.fb = null; paint(false);

  });
  paint(false);
}

/* ---------- Stepper ---------- */
const stepAt = {};
function mountStepper(el, cfg){
  if(stepAt[cfg.id] == null) stepAt[cfg.id] = 0;
  el.innerHTML = '<div class="stage plain scroll" data-scene></div>' +
    '<div class="steps-h"><button type="button" class="btn sm" data-st="-1">← Back</button>' +
    '<div class="dots" role="group" aria-label="Steps"></div>' +
    '<button type="button" class="btn sm primary" data-st="1">Next step →</button></div>' +
    '<div class="steptext" role="status" aria-live="polite"></div>';
  function paint(){
    const i = stepAt[cfg.id], st = cfg.steps[i];
    $('[data-scene]', el).innerHTML = cfg.scene ? cfg.scene(i, st) : trackHTML(cfg.track, st.at, cfg.steps.slice(0, i).map(s => s.at), st.form);
    $('.dots', el).innerHTML = cfg.steps.map((s, k) => '<button type="button" data-k="' + k + '" aria-label="Step ' + (k + 1) + ': ' + s.t.replace(/<[^>]+>/g, '') + '"' + (k === i ? ' aria-current="step"' : '') + (k < i ? ' class="done"' : '') + '>' + (k + 1) + '</button>').join('');

/* ---------- Column chart with hover and focus ---------- */
// bars: [{label, value, text, group}]  opts: {w,h,min,max,ticks,unit,ref:{v,label},hi:index,title}
function columnChart(bars, o){
  const W = o.w || 640, H = o.h || 250, m = {l: 44, r: 12, t: 16, b: 48};
  const pw = W - m.l - m.r, ph = H - m.t - m.b, y = v => m.t + ph * (o.max - v) / (o.max - o.min);
  const band = pw / bars.length, bw = Math.min(24, band * 0.6);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + o.title + '">';
  o.ticks.forEach(t => { s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" style="stroke:' + (t === 0 ? 'var(--ctl)' : 'var(--grid)') + '" stroke-width="1"/>' +
    '<text x="' + (m.l - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end" font-size="10.5" style="fill:var(--muted)">' + minus(t) + '</text>'; });
  s += '<text x="12" y="' + (m.t + ph / 2) + '" font-size="10.5" text-anchor="middle" transform="rotate(-90 12 ' + (m.t + ph / 2) + ')" style="fill:var(--muted)">' + o.unit + '</text>';
  if(o.ref){ s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(o.ref.v) + '" y2="' + y(o.ref.v) + '" style="stroke:var(--ink)" stroke-width="1"/>' +
    '<text x="' + (W - m.r) + '" y="' + (y(o.ref.v) - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--ink)">' + o.ref.label + '</text>'; }
  bars.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5), y0 = y(0), y1 = y(b.value), top = Math.min(y0, y1), hgt = Math.max(2, Math.abs(y1 - y0)), up = b.value >= 0, r = Math.min(4, hgt);
    const x = cx - bw / 2, path = up
      ? 'M' + x + ',' + y0 + ' V' + (top + r) + ' Q' + x + ',' + top + ' ' + (x + r) + ',' + top + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + ' V' + y0 + ' Z'
      : 'M' + x + ',' + y0 + ' V' + (top + hgt - r) + ' Q' + x + ',' + (top + hgt) + ' ' + (x + r) + ',' + (top + hgt) + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + (top + hgt) + ' ' + (x + bw) + ',' + (top + hgt - r) + ' V' + y0 + ' Z';
    s += '<path d="' + path + '" style="fill:var(--s1)"' + (o.hi === i ? '' : ' opacity="' + (o.hi == null ? 1 : .45) + '"') + '/>';
    s += '<text x="' + cx + '" y="' + (up ? top - 5 : top + hgt + 12) + '" text-anchor="middle" font-size="10" style="fill:var(--ink)">' + b.text + '</text>';
    s += '<text x="' + cx + '" y="' + (H - m.b + 15) + '" text-anchor="middle" font-size="10.5" style="fill:var(--ink)"' + (o.hi === i ? ' font-weight="700"' : '') + '>' + b.label + '</text>';
    s += '<rect class="hot" tabindex="0" data-tip="' + b.tip + '" x="' + (cx - band / 2) + '" y="' + m.t + '" width="' + band + '" height="' + ph + '" fill="transparent"/>';
  });
  (o.groups || []).forEach(g => { const xa = m.l + band * g[0] + 4, xb = m.l + band * (g[1] + 1) - 4;
    s += '<line x1="' + xa + '" x2="' + xb + '" y1="' + (H - 20) + '" y2="' + (H - 20) + '" style="stroke:var(--ctl)" stroke-width="1"/>' +
      '<text x="' + ((xa + xb) / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">' + g[2] + '</text>'; });
  return s + '</svg>';

function wireTips(wrap){
  let tip = $('.tip', wrap); if(!tip){ tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; wrap.appendChild(tip); }
  const show = t => { const r = t.getBoundingClientRect(), w = wrap.getBoundingClientRect(); tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
    tip.style.left = Math.max(60, Math.min(wrap.scrollWidth - 60, r.left + r.width / 2 - w.left + wrap.scrollLeft)) + 'px'; tip.style.top = (r.top - w.top + 18) + 'px'; };
  wrap.addEventListener('pointermove', e => { const t = e.target.closest('[data-tip]'); if(t) show(t); else tip.hidden = true; });
  wrap.addEventListener('pointerleave', () => { tip.hidden = true; });
  wrap.addEventListener('focusin', e => { const t = e.target.closest('[data-tip]'); if(t) show(t); });
  wrap.addEventListener('focusout', () => { tip.hidden = true; });
}

// Specific rotations from Lehninger Problem 11; 1 g of sucrose (M 342) gives 0.526 g of each hexose (M 180).
const INV = {suc: 66.4, glc: 52.7, fru: -92, f: 180 / 342};
const invRot = pct => (1 - pct / 100) * INV.suc + (pct / 100) * INV.f * (INV.glc + INV.fru);
function invScale(pct){
  const W = 520, x0 = 30, pw = 460, X = v => x0 + pw * (v + 30) / 100, r = invRot(pct);
  let s = '<svg viewBox="0 0 ' + W + ' 74" width="' + W + '" role="img" aria-label="Optical rotation scale from minus 30 to plus 70 degrees; reading ' + r.toFixed(1) + ' degrees">';
  s += '<rect x="' + X(-30) + '" y="26" width="' + (X(0) - X(-30)) + '" height="14" style="fill:var(--r-bg);stroke:var(--line)"/><rect x="' + X(0) + '" y="26" width="' + (X(70) - X(0)) + '" height="14" style="fill:var(--b-bg);stroke:var(--line)"/>';
  [-30, -20, -10, 0, 10, 20, 30, 40, 50, 60, 70].forEach(v => { s += '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="40" y2="' + (v === 0 ? 50 : 45) + '" style="stroke:var(--ctl)"/><text x="' + X(v) + '" y="62" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '°</text>'; });
  s += '<text x="' + X(-15) + '" y="18" text-anchor="middle" font-size="10" style="fill:var(--r-ink)">rotates to the left</text><text x="' + X(35) + '" y="18" text-anchor="middle" font-size="10" style="fill:var(--b-ink)">rotates to the right</text>';
  s += '<line x1="' + X(r) + '" x2="' + X(r) + '" y1="20" y2="46" style="stroke:var(--ink)" stroke-width="4" stroke-linecap="round"/>';
  return s + '</svg>';
}

function shapeSVG(kind, iodine){

  if(kind === 'alpha'){
    // a coil seen slightly from above: the lower half of every turn is nearer the reader
    const n = 25, x0 = 62, dx = 19.5, cy = 80, A = 38, RX = 6;
    const at = t => { const a = 2 * Math.PI * t / 6; return {x: x0 + t * dx + RX * Math.cos(a), y: cy - A * Math.sin(a), back: Math.sin(a) > 0}; };
    let back = '', front = '';
    const STEP = 0.1; let run = [], cur = null;
    const flush = () => { if(run.length > 1){ const d = run.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join('');
      const seg = '<path d="' + d + '" fill="none" style="stroke:var(--a-line)" stroke-width="' + (cur ? 1.6 : 2.8) + '" stroke-linecap="round" opacity="' + (cur ? .45 : 1) + '"/>'; if(cur) back += seg; else front += seg; } };

}

const gagState = {g: 'hya', mode: 'a'};

const GAGCH = {hya: [1, 0], cs: [1, 1], ks: [0, 1], hep: [2, 3]};
function gagSVG(key){
  const G = GAGS[key], W = 600, H = 150, x0 = 64, dx = 84, y = 70, reps = 3;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Three repeating disaccharide units of ' + G.name + '">';
  const n = reps * 2;
  s += '<line x1="' + (x0 - 40) + '" y1="' + y + '" x2="' + (x0 + (n - 1) * dx + 40) + '" y2="' + y + '" style="stroke:var(--a-line)" stroke-width="2.4"/>';
  s += '<text x="' + (x0 - 46) + '" y="' + (y + 4) + '" text-anchor="end" font-size="12" style="fill:var(--muted)">…</text><text x="' + (x0 + (n - 1) * dx + 46) + '" y="' + (y + 4) + '" font-size="12" style="fill:var(--muted)">…</text>';
  for(let i = 0; i < n; i++){ const u = G.units[i % 2], x = x0 + i * dx, ch = GAGCH[key][i % 2];
    if(i % 2 === 0) s += '<rect x="' + (x - 30) + '" y="' + (y - 44) + '" width="' + (dx + 60) + '" height="104" rx="10" style="fill:' + (i === 2 ? 'var(--soft)' : 'none') + ';stroke:' + (i === 2 ? 'var(--line)' : 'none') + '"/>';
  }
  for(let i = 0; i < n; i++){ const u = G.units[i % 2], x = x0 + i * dx, ch = GAGCH[key][i % 2];
    s += sym(u[0], x, y, 11);
    s += '<text x="' + x + '" y="' + (y - 22) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="currentColor">' + u[0] + (u[2] ? '<tspan style="fill:var(--bad)"> ' + u[2] + '</tspan>' : '') + '</text>';
    if(i < n - 1) s += '<text x="' + (x + dx / 2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="9.5" style="fill:var(--a-ink)">' + u[1] + '</text>';
    for(let k = 0; k < ch; k++){ const cx = x - (ch - 1) * 7 + k * 14; s += '<circle cx="' + cx + '" cy="' + (y + 30) + '" r="6" style="fill:var(--bad-bg);stroke:var(--bad)" stroke-width="1.2"/><text x="' + cx + '" y="' + (y + 34) + '" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--bad)">−</text>'; }
  }
  s += '<text x="' + (x0 + 2 * dx + dx / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">one repeating disaccharide</text>';
  return s + '</svg>';
}

  if(o.core) s += '<rect x="' + o.core[0] + '" y="' + o.core[1] + '" width="' + o.core[2] + '" height="' + o.core[3] + '" rx="12" style="fill:var(--soft);stroke:var(--line)"/><text x="' + (o.core[0] + o.core[2] / 2) + '" y="' + (o.core[1] + o.core[3] + 13) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">core: 2 GlcNAc + 3 Man</text>';
  s += '<line x1="' + nodes[0][1] + '" y1="' + py + '" x2="' + (px - 26) + '" y2="' + py + '" style="stroke:var(--a-line)" stroke-width="2.4"/>';

  return s + '</svg>';
}

      '<text x="' + r[0] + '" y="' + (r[1] + 4) + '" text-anchor="middle" font-size="10" font-weight="700" style="fill:' + (r[2] === 'end' ? 'var(--on-accent)' : r[2] === 'branch' ? 'var(--a-ink)' : 'var(--b-ink)') + '">' + (r[2] === 'end' ? '4 Me' : r[2] === 'branch' ? '2 Me' : '3 Me') + '</text></g>'; });

function methylPositions(type){
