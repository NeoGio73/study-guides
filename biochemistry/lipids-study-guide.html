<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lipids Study Guide</title>
<style>
/* Layout: one 920px column. Pill tabs on top (Roadmap + 11 numbered sections), each section a
   scrolling page of explorers, key facts and practice. Same look as the earlier study guides. */
:root{
  --bg:#ffffff; --ink:#1b2430; --muted:#566070; --line:#d6dbe3; --soft:#f3f5f8; --ctl:#8b95a3;
  /* lipid color language: tails amber, polar heads teal, backbones violet */
  --a-bg:#fff1dc; --a-line:#dd962a; --a-ink:#7a4300;
  --b-bg:#ddf2ee; --b-line:#2c9383; --b-ink:#0a564c;
  --r-bg:#ebe7f8; --r-line:#7560c4; --r-ink:#3e2c85;
  --accent:#1f3a5f; --accent-d:#152b49; --on-accent:#ffffff;
  --ok:#17693f; --ok-bg:#e4f4ea; --ok-ink:#0f4a2c;
  --bad:#a3241d; --bad-bg:#fcebe9; --bad-ink:#6f1712;
  --warn:#6f4b00; --warn-bg:#fff5d9; --warn-line:#c98f12;
  --info:#274b7a; --info-bg:#e9f0fa; --info-line:#5a86c4;
  --focus:#4c7fd6;
  /* chart series (validated order) and sugar symbols */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#e3e7ec;
  --glc:#0072bc; --gal:#ffd400; --sia:#a54399;
  --water:#d9ecfb; --chl:#f6e7b8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131921; --ink:#e7ecf3; --muted:#9daabb; --line:#2f3a49; --soft:#1b2430; --ctl:#66748a;
    --a-bg:#3a2a10; --a-line:#d69a3a; --a-ink:#f5cf8e;
    --b-bg:#10332e; --b-line:#3fae9c; --b-ink:#9be0d3;
    --r-bg:#2a2447; --r-line:#9484df; --r-ink:#cdc4f7;
    --accent:#9dbcf0; --accent-d:#b9cff5; --on-accent:#10203a;
    --ok:#5fcf93; --ok-bg:#12301f; --ok-ink:#b4ecc9;
    --bad:#f08a80; --bad-bg:#3a1714; --bad-ink:#f8c4bd;
    --warn:#f0c45c; --warn-bg:#33290e; --warn-line:#c98f12;
    --info:#a9c6f0; --info-bg:#172840; --info-line:#5a86c4;
    --focus:#8fb4f5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a3442;
    --water:#1b3550; --chl:#4a3d14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131921; --ink:#e7ecf3; --muted:#9daabb; --line:#2f3a49; --soft:#1b2430; --ctl:#66748a;
  --a-bg:#3a2a10; --a-line:#d69a3a; --a-ink:#f5cf8e;
  --b-bg:#10332e; --b-line:#3fae9c; --b-ink:#9be0d3;
  --r-bg:#2a2447; --r-line:#9484df; --r-ink:#cdc4f7;
  --accent:#9dbcf0; --accent-d:#b9cff5; --on-accent:#10203a;
  --ok:#5fcf93; --ok-bg:#12301f; --ok-ink:#b4ecc9;
  --bad:#f08a80; --bad-bg:#3a1714; --bad-ink:#f8c4bd;
  --warn:#f0c45c; --warn-bg:#33290e; --warn-line:#c98f12;
  --info:#a9c6f0; --info-bg:#172840; --info-line:#5a86c4;
  --focus:#8fb4f5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2a3442;
  --water:#1b3550; --chl:#4a3d14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.app{max-width:920px;margin:0 auto;padding-block:20px 56px;padding-inline:16px}
sub,sup{font-size:.72em;line-height:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--sans)}
a{color:var(--accent)}
[hidden]{display:none!important}

/* Header */
.top h1{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 .4rem;text-wrap:balance}
.top p{margin:0;color:var(--muted);max-width:66ch}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 13px 6px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button:not([data-n]){padding-left:13px}
.tabs .tn{display:inline-grid;place-items:center;min-width:1.65em;height:1.65em;border-radius:999px;background:var(--soft);font-size:.8rem;padding:0 .25em}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .tn{background:var(--bg);color:var(--ink)}
.tabs button:not([aria-selected="true"]):hover{border-color:var(--accent)}

/* Headings and text */
h2{font-family:var(--serif);font-weight:600;font-size:1.55rem;line-height:1.2;margin:0 0 .35rem;text-wrap:balance}
h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.25;margin:0 0 .3rem;text-wrap:balance}
h4{font-size:.95rem;margin:0 0 .3rem}
p{margin:0 0 .7rem}
.lede{margin:0 0 6px;max-width:68ch}
.src{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 12px;max-width:68ch}
.small{font-size:.88rem;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 22px;font-size:.88rem}
.jump span{color:var(--muted);font-weight:600}
.jump a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 9px;background:var(--bg)}
.jump a:hover{border-color:var(--accent)}
.block{margin:0 0 30px;padding-top:22px;border-top:1px solid var(--line)}
.block:first-of-type{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ta{color:var(--a-ink);font-weight:600} .tb{color:var(--b-ink);font-weight:600} .tr{color:var(--r-ink);font-weight:600}

/* Buttons and small controls */
.btn{appearance:none;font:inherit;font-weight:600;font-size:.93rem;border-radius:8px;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);padding:7px 13px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.sm{padding:3px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.row.gap{margin:10px 0}
.lab{font-size:.88rem;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;font:inherit;font-size:.88rem;border:0;background:var(--bg);color:var(--ink);padding:6px 11px;cursor:pointer;border-left:1.5px solid var(--line);margin-left:-1.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:focus-visible{outline-offset:-3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.86rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] .small,.btn[aria-pressed="true"] .small{color:inherit}
select.sel,input.num{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--ctl);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 5.5em;gap:6px 12px;align-items:center;margin:6px 0}
.slider output{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:.92rem}
.slider label{font-size:.92rem;font-weight:600}

/* Panels */
.panel{border:1.5px solid var(--line);border-radius:14px;padding:18px 18px 16px}
.stage{background:var(--soft);border-radius:10px;padding:12px}
.stage.plain{background:var(--bg);border:1px solid var(--line)}
.scroll{overflow-x:auto}
.scroll.ov::after{content:"Swipe or scroll sideways to see the rest →";display:block;position:sticky;left:0;width:max-content;max-width:100%;margin-top:6px;font-size:.78rem;color:var(--muted)}
.detail{border-left:5px solid var(--accent);background:var(--soft);border-radius:10px;padding:13px 16px;margin-top:12px}
.detail p:last-child,.detail ul:last-child{margin-bottom:0}
.detail ul{margin:0 0 8px;padding-left:1.2em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 20px}
.grid2>*{min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.facts{margin:0;padding-left:1.15em;max-width:72ch}
.facts li{margin-bottom:7px}
.facts li::marker{color:var(--muted)}
.cols{columns:2 340px;column-gap:28px}
.cols .fgroup{break-inside:avoid;margin-bottom:14px}
figure{margin:0}
figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;max-width:72ch}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:6px 10px 6px 0;border-bottom:1.5px solid var(--line);vertical-align:bottom}
.tbl td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.on td{background:var(--info-bg)}
.tbl caption{caption-side:bottom;text-align:left;font-size:.82rem;color:var(--muted);padding-top:6px}
details.more{margin-top:12px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more[open]>summary{margin-bottom:8px}

/* Feedback */
.fb{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;border-left:5px solid;gap:10px;align-items:flex-start}
.fb.show{display:flex}
.fb .ic{font-weight:700;font-size:1.05rem;line-height:1.5}
.fb p{margin:0} .fb p+p{margin-top:6px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.fb.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.fb.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 12px;font-size:.9rem;margin:10px 0 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}

/* Practice */
.problem{border:1.5px solid var(--line);border-radius:14px;padding:20px 20px 18px}
.qkind{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.q{font-size:1.08rem;margin:0 0 14px;max-width:64ch}
.qfig{margin:0 0 14px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--ctl);border-radius:9px;padding:8px 13px;background:var(--bg)}
.opt input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.opt.right span{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.wrong span{border:2px dashed var(--bad);background:var(--bad-bg);color:var(--bad-ink);box-shadow:none}
.opt input:disabled{cursor:default}
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.ansrow label{font-weight:600}
.pin{font:inherit;font-size:1.05rem;width:9em;max-width:100%;padding:7px 10px;border:1.5px solid var(--ctl);border-radius:8px;color:var(--ink);background:var(--bg)}
.pin.wide{width:14em}
.pin.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.pin.no{border:2px dashed var(--bad);background:var(--bad-bg)}
.unit{font-size:1.02rem}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:ord}
.order li{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ctl);border-radius:9px;padding:5px 8px 5px 12px;background:var(--bg);counter-increment:ord}
.order li::before{content:counter(ord);font-weight:700;color:var(--muted);min-width:1.2em}
.order li .t{flex:1;min-width:0}
.order li button{appearance:none;font:inherit;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;width:2em;height:2em;cursor:pointer}
.order li button:disabled{opacity:.35;cursor:default}
.order.right li{border-color:var(--ok);background:var(--ok-bg)}
.orderlab{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:0 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally{font-size:.9rem;color:var(--muted);margin:12px 2px 0}
.setup{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.setup ol{margin:0;padding-left:1.25em} .setup li{margin-bottom:4px}

/* Stepper */
.steps-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{appearance:none;width:1.75em;height:1.75em;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:0}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dots button.done{background:var(--soft)}
.steptext{border-left:5px solid var(--accent);background:var(--soft);border-radius:10px;padding:12px 16px;margin-top:12px;min-height:5.5em}
.steptext h4{font-size:1rem;margin:0 0 4px}
.steptext p{margin:0}
.track{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;list-style:none;margin:0;padding:0}
.track li{flex:1 1 120px;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:.86rem;color:var(--muted);position:relative}
.track li b{display:block;color:var(--ink);font-size:.9rem}
.track li.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.track li.on::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.track li.was{background:var(--soft)}
.form{display:inline-block;margin-top:4px;border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:600;background:var(--a-bg);color:var(--a-ink);border:1px solid var(--a-line)}

/* Flow (pathway) lists */
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin:0;padding:0;list-style:none}
.flow.center{align-items:center}
.met{border:1.5px solid var(--line);border-radius:9px;padding:5px 11px;background:var(--bg);font-weight:600;font-size:.93rem}
.met.a{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.met.b{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.met.r{background:var(--r-bg);border-color:var(--r-line);color:var(--r-ink)}
.met.dim{opacity:.38}
.met.hot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.met.pile{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--bad)}
.rx{display:flex;align-items:center;gap:8px;padding:3px 0 3px 16px;font-size:.84rem;color:var(--muted)}
.rx::before{content:"↓";font-size:1.15rem;color:var(--ink);line-height:1}
.rx.h::before{content:"→"}
.rx b{color:var(--ink);font-weight:600}
.rx.blocked{color:var(--bad)} .rx.blocked::before{content:"✕";color:var(--bad);font-weight:700}
.rx .cof{border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--soft);white-space:nowrap}
.lanes{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lane{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.lane h4{margin:0 0 8px}
.lane.off{opacity:.45}

/* Lipid assembler blocks */
.lipid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 0;align-items:stretch;margin:6px 0}
.lipid .bb{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;background:var(--r-bg);border:2px solid var(--r-line);color:var(--r-ink);font-weight:700;border-radius:10px;padding:10px 6px;font-size:.92rem}
.lipid .rows{display:grid;gap:8px;padding:4px 0}
.lipid .lr{display:flex;align-items:center;min-width:0}
.lipid .lk{font-size:.74rem;color:var(--muted);padding:0 6px;white-space:nowrap;position:relative}
.lipid .lk::after{content:"";position:absolute;left:0;right:0;bottom:-2px;border-bottom:2px solid var(--ctl)}
.blk{border:2px solid;border-radius:9px;padding:5px 10px;font-weight:600;font-size:.9rem;min-width:0}
.blk.tail{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink);flex:1 1 auto;max-width:330px}
.blk.tail.short{flex:0 0 auto}
.blk.bbt{background:var(--r-bg);border-color:var(--r-line);color:var(--r-ink);flex:1 1 auto;max-width:330px}
.blk.head{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.blk.oh{background:var(--bg);border-color:var(--ctl);border-style:dashed;color:var(--muted)}
.blk.p{background:var(--bg);border-color:var(--ink);color:var(--ink);border-radius:50%;width:2.1em;height:2.1em;padding:0;display:inline-grid;place-items:center;flex:0 0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin:8px 0 0;padding:0;list-style:none}
.legend li{display:inline-flex;align-items:center;gap:6px}
.sw{width:.95em;height:.95em;border-radius:3px;border:1.5px solid;display:inline-block}
.sw.a{background:var(--a-bg);border-color:var(--a-line)} .sw.b{background:var(--b-bg);border-color:var(--b-line)} .sw.r{background:var(--r-bg);border-color:var(--r-line)}
.sw.s1{background:var(--s1);border-color:var(--s1)} .sw.s2{background:var(--s2);border-color:var(--s2)} .sw.s3{background:var(--s3);border-color:var(--s3)}
.sw.s4{background:var(--s4);border-color:var(--s4)} .sw.s5{background:var(--s5);border-color:var(--s5)}

/* Meter */
.meter2{position:relative;height:14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:20px 0 4px}
.meter2 .zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--b-bg);border-inline:1.5px solid var(--b-line)}
.meter2 i{position:absolute;top:-7px;width:4px;height:26px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--bg);transform:translateX(-2px);transition:left .25s}
.meter-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.big{font-family:var(--serif);font-size:1.25rem;font-weight:600}
.stat{display:flex;flex-wrap:wrap;gap:10px 22px;margin:8px 0}
.stat div{min-width:0}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

/* Level bars */
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.lvl i{width:14px;height:10px;border-radius:2px;background:var(--soft);border:1px solid var(--ctl)}
.lvl i.f{background:var(--accent);border-color:var(--accent)}

<body>
<div class="app">
  <header class="top">
    <h1>Lipids Study Guide</h1>
    <p>Structure, membranes and metabolism of lipids for undergraduate biochemistry. Start with the roadmap, then work through the sections in order. Every section has models to explore, the key facts, and practice with feedback. Nothing here is graded.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="view" role="tabpanel" tabindex="-1" style="outline:none"></main>
  <noscript><p>This study guide needs JavaScript turned on.</p></noscript>
</div>
<script>
(function(){
'use strict';
/* ============================================================
   Lipid data and logic (no page elements used here).
   Names and values follow Lehninger Principles of Biochemistry, 8th ed.
   (Chapters 10, 11, 17, 21). Extra details come from the Color Atlas of
   Biochemistry, 2nd ed., and are marked src:'atlas'.
   ============================================================ */

/* ---------- small helpers ---------- */
let RNG = Math.random;
const rint = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = arr => arr[Math.floor(RNG() * arr.length)];
function shuffle(arr){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (arr, n) => shuffle(arr).slice(0, n);
const fmt = (x, dp) => Number(x).toLocaleString('en-US', {minimumFractionDigits: dp || 0, maximumFractionDigits: dp == null ? 1 : dp});
const minus = s => String(s).replace(/-/g, '−');

/* ---------- fatty acids (Lehninger Table 10-1, plus acids named in the text) ---------- */
// mp in °C, sol = solubility in water at 30 °C in mg/g solvent, both from Table 10-1.
const FA = [
  {c:12, d:[], name:'Lauric acid', sys:'n-Dodecanoic acid', acyl:'lauroyl', tri:'trilaurin', mp:44.2, sol:'0.063', tab:1},
  {c:14, d:[], name:'Myristic acid', sys:'n-Tetradecanoic acid', acyl:'myristoyl', tri:'trimyristin', mp:53.9, sol:'0.024', tab:1},
  {c:16, d:[], name:'Palmitic acid', sys:'n-Hexadecanoic acid', acyl:'palmitoyl', tri:'tripalmitin', mp:63.1, sol:'0.0083', tab:1},
  {c:18, d:[], name:'Stearic acid', sys:'n-Octadecanoic acid', acyl:'stearoyl', tri:'tristearin', mp:69.6, sol:'0.0034', tab:1},
  {c:20, d:[], name:'Arachidic acid', sys:'n-Eicosanoic acid', acyl:'arachidoyl', mp:76.5, tab:1},
  {c:24, d:[], name:'Lignoceric acid', sys:'n-Tetracosanoic acid', acyl:'lignoceroyl', mp:86.0, tab:1},
  {c:16, d:[9], name:'Palmitoleic acid', sys:'cis-9-Hexadecenoic acid', acyl:'palmitoleoyl', tri:'tripalmitolein', mp:0.25, mpT:'1 to −0.5', tab:1},
  {c:18, d:[9], name:'Oleic acid', sys:'cis-9-Octadecenoic acid', acyl:'oleoyl', tri:'triolein', mp:13.4, tab:1},
  {c:18, d:[9,12], name:'Linoleic acid', sys:'cis-,cis-9,12-Octadecadienoic acid', acyl:'linoleoyl', tri:'trilinolein', mp:-5, tab:1},
  {c:18, d:[9,12,15], name:'α-Linolenic acid', sys:'cis-,cis-,cis-9,12,15-Octadecatrienoic acid', acyl:'α-linolenoyl', tri:'trilinolenin', mp:-11, tab:1, abbr:'ALA'},
  {c:20, d:[5,8,11,14], name:'Arachidonic acid', sys:'cis-,cis-,cis-,cis-5,8,11,14-Eicosatetraenoic acid', acyl:'arachidonoyl', mp:-49.5, tab:1},
  {c:20, d:[5,8,11,14,17], name:'Eicosapentaenoic acid', abbr:'EPA', acyl:'eicosapentaenoyl'},
  {c:22, d:[4,7,10,13,16,19], name:'Docosahexaenoic acid', abbr:'DHA', acyl:'docosahexaenoyl'},
  {c:4,  d:[], name:'Butyric acid', src:'atlas'},
  {c:6,  d:[], name:'Caproic acid', src:'atlas'},
  {c:8,  d:[], name:'Caprylic acid (octanoic acid)', src:'atlas'},
  {c:10, d:[], name:'Capric acid', src:'atlas'},
  {c:22, d:[], name:'Behenic acid', src:'atlas'},
  {c:22, d:[13], name:'Erucic acid', src:'atlas'},
  {c:24, d:[15], name:'Nervonic acid', src:'atlas'},
  {c:26, d:[], name:'Hexacosanoic acid'}
];
const FA_TABLE = FA.filter(f => f.tab);
const STEMS = {4:'but',5:'pent',6:'hex',7:'hept',8:'oct',9:'non',10:'dec',11:'undec',12:'dodec',13:'tridec',14:'tetradec',15:'pentadec',
  16:'hexadec',17:'heptadec',18:'octadec',19:'nonadec',20:'eicos',21:'heneicos',22:'docos',23:'tricos',24:'tetracos',25:'pentacos',26:'hexacos'};
const MULT = ['', '', 'di', 'tri', 'tetra', 'penta', 'hexa'];

const sameSet = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const faFind = (c, d) => FA.find(f => f.c === c && sameSet(f.d, d)) || null;
function faShort(c, d, html){
  if(!d.length) return c + ':0';
  return c + ':' + d.length + '(Δ' + (html ? '<sup>' + d.join(',') + '</sup>' : d.join(',')) + ')';
}
const faAtlas = (c, d) => c + ':' + d.length + (d.length ? ';' + d.join(',') : '');
// omega class: position of the double bond nearest the methyl end, counted from that end
const faOmega = (c, d) => d.length ? c - Math.max.apply(null, d) : null;
function faSysName(c, d, trans){
  const hit = faFind(c, d);
  const anyTrans = trans && trans.length;
  if(hit && hit.sys && !anyTrans) return hit.sys;
  const stem = STEMS[c] || ('C' + c);
  if(!d.length) return 'n-' + stem.charAt(0).toUpperCase() + stem.slice(1) + 'anoic acid';
  const geo = d.map(p => (trans && trans.indexOf(p) >= 0) ? 'trans-' : 'cis-').join(',');
  const body = stem + (d.length > 1 ? 'a' + MULT[d.length] : '') + 'enoic acid';
  return geo + d.join(',') + '-' + body.charAt(0).toUpperCase() + body.slice(1);
}
// Reads "18:2(Δ9,12)", "18:2 (9,12)", "18:2;9,12", "18:2 d9,12", "18:0".
function parseShort(s){
  // superscript digits (Δ⁹,¹²) are read as ordinary digits, and a leading C (C18:2) is allowed
  const sup = '⁰¹²³⁴⁵⁶⁷⁸⁹', t = String(s).replace(/[−–]/g, '-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, ch => String(sup.indexOf(ch)));
  const m = /^\s*[Cc]?\s*(\d{1,2})\s*:\s*(\d)\s*(.*)$/.exec(t);
  if(!m) return null;
  const c = +m[1], k = +m[2];
  const nums = (m[3].match(/\d+/g) || []).map(Number);
  return {c, k, d: nums.sort((a, b) => a - b)};
}
// Checks a shorthand answer. Returns {ok, msg}.
function checkShort(input, c, d){
  const p = parseShort(input);
  if(!p) return {ok:false, msg:'Write it as carbons:double bonds, then the positions. For example 18:1(Δ9).'};
  if(p.c !== c) return {ok:false, msg:'Count the carbons again. The carboxyl carbon is C-1, and every corner and the free end of the zigzag is one carbon.'};
  if(p.k !== d.length) return {ok:false, msg:'The chain length is right. Now count the double bonds again.'};
  if(d.length && !p.d.length) return {ok:false, msg:'The count is right. Add the position of each double bond: the lower-numbered carbon of the pair, counted from the carboxyl end.'};
  if(!sameSet(p.d, d)){
    const fromOmega = d.map(x => c - x).sort((a, b) => a - b);
    if(sameSet(p.d, fromOmega)) return {ok:false, msg:'Those positions are counted from the methyl end. Δ positions are counted from the carboxyl carbon, C-1.'};
    const upper = d.map(x => x + 1);
    if(sameSet(p.d, upper)) return {ok:false, msg:'Use the lower-numbered carbon of each double bond. A double bond between C-9 and C-10 is Δ9.'};
    return {ok:false, msg:'The counts are right but a position is off. Number from the carboxyl carbon and give the lower-numbered carbon of each double bond.'};
  }
  return {ok:true, msg:''};
}

/* ---------- drawing a fatty acid as a zigzag (returns SVG markup) ---------- */
// cis double bonds are drawn flat, with both neighbors on the same side; trans double bonds keep the zigzag.
function faGeom(c, d, trans, x0, yLo, dx, dy){
  const L = Math.sqrt(dx * dx + dy * dy), pts = [];
  let x = x0, level = 0;
  pts[1] = {x: x, y: yLo, lv: 0};
  for(let i = 1; i < c; i++){
    const cis = d.indexOf(i) >= 0 && trans.indexOf(i) < 0;
    if(cis){ x += L; } else { x += dx; level = 1 - level; }
    pts[i + 1] = {x: x, y: level ? yLo - dy : yLo, lv: level};
  }
  return pts;
}
function faBonds(pts, c, d, o){
  let s = '';
  const f = n => n.toFixed(1);
  for(let i = 1; i < c; i++){
    const a = pts[i], b = pts[i + 1], dbl = d.indexOf(i) >= 0;
    s += '<line x1="' + f(a.x) + '" y1="' + f(a.y) + '" x2="' + f(b.x) + '" y2="' + f(b.y) + '" stroke="' + (dbl ? 'var(--bad)' : 'currentColor') + '" stroke-width="' + (dbl ? 2 : 1.6) + '" stroke-linecap="round"/>';
    if(dbl){
      const vx = b.x - a.x, vy = b.y - a.y, len = Math.sqrt(vx * vx + vy * vy), nx = -vy / len, ny = vx / len;
      const sgn = (a.lv === b.lv) ? (a.lv ? 1 : -1) : 1, off = 3.4 * sgn, t = 2.6 / len;
      s += '<line x1="' + f(a.x + vx * t + nx * off) + '" y1="' + f(a.y + vy * t + ny * off) + '" x2="' + f(b.x - vx * t + nx * off) + '" y2="' + f(b.y - vy * t + ny * off) + '" stroke="var(--bad)" stroke-width="2" stroke-linecap="round"/>';
    }
  }
  if(o && o.click){
    for(let i = 2; i <= c - 2; i++){
      const a = pts[i], b = pts[i + 1], dbl = d.indexOf(i) >= 0;
      s += '<line class="hit" data-i="' + i + '" tabindex="0" role="button" aria-label="Bond between C-' + i + ' and C-' + (i + 1) + ', ' + (dbl ? 'double. Activate to make it single.' : 'single. Activate to make it double.') + '" x1="' + f(a.x) + '" y1="' + f(a.y) + '" x2="' + f(b.x) + '" y2="' + f(b.y) + '" stroke="transparent" stroke-width="15" stroke-linecap="round" style="cursor:pointer"/>';
    }
  }
  return s;
}
function faSVG(c, d, o){
  o = o || {};
  const trans = o.trans || [], dx = 17, dy = 10, x0 = 46, yLo = 40;
  const pts = faGeom(c, d, trans, x0, yLo, dx, dy);
  const W = Math.ceil(pts[c].x + 34), H = 76, f = n => n.toFixed(1);
  const tx = (x, y, t, a, extra) => '<text x="' + f(x) + '" y="' + f(y) + '" font-size="10.5" text-anchor="' + (a || 'middle') + '" fill="currentColor"' + (extra || '') + '>' + t + '</text>';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + (o.label || ('Zigzag structure of a fatty acid with ' + c + ' carbons and ' + d.length + ' double bond' + (d.length === 1 ? '' : 's'))) + '">';
  // carboxyl group: C-1 with =O below and OH up-left
  s += '<line x1="' + x0 + '" y1="' + yLo + '" x2="' + (x0 - dx) + '" y2="' + (yLo - dy) + '" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  s += '<line x1="' + (x0 - 1.8) + '" y1="' + (yLo + 2) + '" x2="' + (x0 - 1.8) + '" y2="' + (yLo + 15) + '" stroke="currentColor" stroke-width="1.6"/>';
  s += '<line x1="' + (x0 + 1.8) + '" y1="' + (yLo + 2) + '" x2="' + (x0 + 1.8) + '" y2="' + (yLo + 15) + '" stroke="currentColor" stroke-width="1.6"/>';
  s += tx(x0 - dx - 3, yLo - dy + 4, 'HO', 'end') + tx(x0, yLo + 27, 'O');
  s += faBonds(pts, c, d, o);
  if(!o.bare){
    const lab = (i, t, strong) => { const p = pts[i]; return tx(p.x + (i === 1 ? 8 : 0), p.lv ? p.y - 6 : p.y + 13, t, 'middle', strong ? ' font-weight="700" style="fill:var(--bad)"' : ' style="fill:var(--muted)"'); };
    if(!o.hideNumbers){
      s += lab(1, '1');
      d.forEach(p => { s += lab(p, String(p), true); });
      if(d.indexOf(c - 1) < 0){ const p = pts[c]; s += tx(p.x + 4, p.lv ? p.y - 6 : p.y + 13, String(c), 'start', ' style="fill:var(--muted)"'); }
    }
    const e = pts[c]; s += tx(e.x + 6, e.lv ? e.y + 9 : e.y - 5, 'ω', 'start', ' font-style="italic" style="fill:var(--muted)"');
  }
  return s + '</svg>';
}

/* ---------- triacylglycerols ---------- */
function tagName(fas){ // fas: three FA entries for C-1, C-2, C-3
  if(fas[0] === fas[1] && fas[1] === fas[2]) return fas[0].tri || ('tri' + fas[0].acyl + 'glycerol');
  const groups = [];
  fas.forEach((f, i) => { const g = groups.find(x => x.f === f); if(g) g.pos.push(i + 1); else groups.push({f: f, pos: [i + 1]}); });
  return groups.map(g => g.pos.join(',') + '-' + (g.pos.length === 2 ? 'di' : '') + g.f.acyl).join('-') + 'glycerol';
}
const tagChiral = fas => fas[0] !== fas[2];
// distinct triacylglycerols from a set of fatty acids, treating C-1 and C-3 as equivalent (as in Lehninger problem 10-3)
function tagCount(k){ return k * k * (k + 1) / 2; }

/* ---------- β oxidation (Lehninger 17.2) ---------- */
function acdIsozymes(n){ const out = []; if(n >= 12 && n <= 18) out.push('VLCAD'); if(n >= 4 && n <= 14) out.push('MCAD'); if(n >= 4 && n <= 8) out.push('SCAD'); return out; }
function betaOx(c, d){
  let n = c, dbs = d.slice().sort((a, b) => a - b);
  const passes = [];
  let fadh2 = 0, nadh = 0, acetyl = 0, nadph = 0, isomerase = 0, reductase = 0;
  while(n > 3){
    const p = {n: n, dbs: dbs.slice(), aux: null, fad: true, iso: acdIsozymes(n), tfp: n >= 12};
    if(dbs.indexOf(3) >= 0){            // cis-Δ3: isomerase makes trans-Δ2, so the first dehydrogenation is skipped
      p.aux = 'isomerase'; p.fad = false; isomerase++; dbs = dbs.filter(x => x !== 3);
    } else if(dbs.indexOf(4) >= 0){     // cis-Δ4: dehydrogenase, then 2,4-dienoyl-CoA reductase (NADPH), then isomerase
      p.aux = 'reductase'; reductase++; isomerase++; nadph++; dbs = dbs.filter(x => x !== 4);
    }
    if(p.fad) fadh2++;
    nadh++; acetyl++;
    n -= 2; dbs = dbs.map(x => x - 2);
    p.out = n;
    passes.push(p);
  }
  const propionyl = n === 3 ? 1 : 0;
  if(n === 2) acetyl++;
  return {c: c, d: d.slice(), passes: passes, fadh2: fadh2, nadh: nadh, acetyl: acetyl, propionyl: propionyl, nadph: nadph, isomerase: isomerase, reductase: reductase};
}
// ATP by Lehninger's accounting (Table 17-1): 1.5 per FADH2, 2.5 per NADH, 10 per acetyl-CoA through the citric acid cycle, 2 spent on activation.
function atpYield(r){
  const beta = 1.5 * r.fadh2 + 2.5 * r.nadh, cac = 10 * r.acetyl;
  return {beta: beta, cac: cac, gross: beta + cac, net: beta + cac - 2};
}

/* ---------- fatty acid synthesis (Lehninger 21.1) ---------- */
function faSynth(c){ const cycles = c / 2 - 1; return {acetyl: c / 2, cycles: cycles, malonyl: cycles, atp: cycles, nadph: 2 * cycles, co2: cycles, water: cycles - 1}; }

/* ---------- lipoproteins (Lehninger Tables 21-1 and 21-2) ---------- */
const LIPO = [
  {id:'chylo', name:'Chylomicrons', dens:'<1.006', size:'100 to 500 nm', comp:[2,9,1,3,85], apos:['apoB-48','apoA-IV','apoC-II','apoC-III','apoE'],
   made:'Enterocytes of the small intestine, from dietary fat', job:'Carry dietary triacylglycerols through the lymph and blood to muscle and adipose tissue.', route:'Exogenous pathway'},
  {id:'vldl', name:'VLDL', long:'Very-low-density lipoprotein', dens:'0.95–1.006', size:'28 to 70 nm', comp:[10,18,7,12,50], apos:['apoB-100','apoC-I','apoC-II','apoC-III','apoE'],
   made:'Liver', job:'Carries triacylglycerols and cholesteryl esters made or packaged in the liver to muscle and adipose tissue.', route:'Endogenous pathway'},
  {id:'ldl', name:'LDL', long:'Low-density lipoprotein', dens:'1.006–1.063', size:'20 to 25 nm', comp:[23,20,8,37,10], apos:['apoB-100'],
   made:'In the blood, from VLDL as it loses triacylglycerol (through VLDL remnants, also called IDL)', job:'Delivers cholesterol to extrahepatic tissues and back to the liver through LDL receptors that recognize apoB-100.', route:'Endogenous pathway'},
  {id:'hdl', name:'HDL', long:'High-density lipoprotein', dens:'1.063–1.210', size:'8 to 11 nm', comp:[55,24,2,15,4], apos:['apoA-I','apoA-II','apoA-IV','apoC-I','apoC-II','apoC-III','apoD','apoE'],
   made:'Liver and small intestine, as small protein-rich particles', job:'Picks up excess cholesterol from tissues and returns it to the liver (reverse cholesterol transport).', route:'Reverse cholesterol transport'}
];
const LIPO_PARTS = ['Protein', 'Phospholipids', 'Free cholesterol', 'Cholesteryl esters', 'Triacylglycerols'];
const APOS = [
  {n:'ApoA-I', mw:'28,100', where:'HDL', fn:'Activates LCAT; interacts with ABC transporter'},
  {n:'ApoA-II', mw:'17,400', where:'HDL', fn:'Inhibits LCAT'},
  {n:'ApoA-IV', mw:'44,500', where:'Chylomicrons, HDL', fn:'Activates LCAT; cholesterol transport/clearance'},
  {n:'ApoB-48', mw:'242,000', where:'Chylomicrons', fn:'Cholesterol transport/clearance'},
  {n:'ApoB-100', mw:'512,000', where:'VLDL, LDL', fn:'Binds to LDL receptor'},
  {n:'ApoC-I', mw:'7,000', where:'VLDL, HDL', fn:''},
  {n:'ApoC-II', mw:'9,000', where:'Chylomicrons, VLDL, HDL', fn:'Activates lipoprotein lipase'},
  {n:'ApoC-III', mw:'9,000', where:'Chylomicrons, VLDL, HDL', fn:'Inhibits lipoprotein lipase'},
  {n:'ApoD', mw:'32,500', where:'HDL', fn:''},
  {n:'ApoE', mw:'34,200', where:'Chylomicrons, VLDL, HDL', fn:'Triggers clearance of VLDL and chylomicron remnants'},
  {n:'ApoH', mw:'50,000', where:'Possibly VLDL; binds phospholipids such as cardiolipin', fn:'Roles in coagulation, lipid metabolism, apoptosis, inflammation'}
];

if(typeof module !== 'undefined' && module.exports){
  module.exports = {FA, FA_TABLE, faFind, faShort, faAtlas, faOmega, faSysName, parseShort, checkShort, faSVG, faGeom, faBonds, tagName, tagChiral, tagCount,
    acdIsozymes, betaOx, atpYield, faSynth, LIPO, LIPO_PARTS, APOS, rint, pick, shuffle, sample, fmt, minus, sameSet,
    setRNG: f => { RNG = f; }};
}

/* ============================================================
   Page: shared pieces (tabs, practice engine, steppers, charts)
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const view = $('#view'), nav = $('#tabs');
const SECTIONS = [];           // filled by each section file: {id, n, label, title, lede, src, render}
const BANK = {};               // practice questions per section id
const state = {tab: 'map'};
let cleanup = [];              // functions to run when leaving a tab (timers, animations)
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Tabs ---------- */
function renderTabs(){
  nav.innerHTML = SECTIONS.map(t =>
    '<button role="tab" id="tab-' + t.id + '" data-tab="' + t.id + '"' + (t.n ? ' data-n="' + t.n + '"' : '') + ' aria-selected="' + (state.tab === t.id) + '">' +
    (t.n ? '<span class="tn">' + t.n + '</span>' : '') + t.label + '</button>').join('');
  const cur = $('button[aria-selected="true"]', nav);

/* ---------- Practice engine ---------- */
const quiz = {};
function drawQuestion(id){
  const S = quiz[id];
  if(!S.bag.length){ S.bag = shuffle(BANK[id].map((x, i) => i)); if(S.bag.length > 1 && S.bag[S.bag.length - 1] === S.last){ S.bag.unshift(S.bag.pop()); } }
  S.last = S.bag.pop();
  const item = BANK[id][S.last];
  const Q = typeof item === 'function' ? item() : Object.assign({}, item);
  if(Q.k === 'mc') Q.opts = shuffle([Q.c].concat(Q.w));
  if(Q.k === 'order'){ let o; let guard = 0; do { o = shuffle(Q.items); guard++; } while(guard < 20 && orderOK(o)); Q.cur = o; }
  S.Q = Q; S.misses = 0; S.done = false; S.hint = false; S.killed = [];
}
const orderOK = arr => arr.every((x, i) => i === 0 || arr[i - 1].r <= x.r);
const KIND = {mc: 'Choose one', num: 'Calculate', order: 'Put in order', fa: 'Write the shorthand'};
function mountQuiz(el, id){
  if(!quiz[id]) quiz[id] = {bag: [], Q: null, solved: 0, streak: 0, seen: 0};
  const S = quiz[id];
  if(!S.Q) drawQuestion(id);
  el.innerHTML = '<article class="problem" aria-label="Practice question"></article><p class="tally"></p>';
  const box = $('.problem', el), tally = $('.tally', el);
  function paint(focus){
    const Q = S.Q;
    let body = '';
    if(Q.k === 'mc'){
      body = '<ul class="opts" role="radiogroup" aria-label="Answer choices">' + Q.opts.map((o, i) => {
        const dead = S.killed.indexOf(o) >= 0, right = S.done && o === Q.c;
        return '<li><label class="opt' + (right ? ' right' : dead ? ' wrong' : '') + '"><input type="radio" name="q-' + id + '" value="' + i + '"' + (dead || S.done ? ' disabled' : '') + '><span>' + o + '</span></label></li>';
      }).join('') + '</ul>';
    } else if(Q.k === 'num' || Q.k === 'fa'){
      body = '<div class="ansrow"><label for="pin-' + id + '">Your answer</label>' +
        '<input id="pin-' + id + '" class="pin' + (Q.k === 'fa' ? ' wide' : '') + '" type="text" autocomplete="off" spellcheck="false"' + (Q.k === 'fa' ? ' placeholder="18:1(Δ9)"' : ' inputmode="decimal"') + (S.done ? ' disabled' : '') + '>' +
        (Q.unit ? '<span class="unit">' + Q.unit + '</span>' : '') + '</div>';
    } else if(Q.k === 'order'){
      body = '<div class="orderlab"><span>' + (Q.top || 'First') + ' (top)</span><span>' + (Q.bottom || 'Last') + ' (bottom)</span></div>' +
        '<ol class="order' + (S.done ? ' right' : '') + '">' + Q.cur.map((it, i) =>
        '<li><span class="t">' + it.t + '</span>' +
        '<button type="button" data-mv="-1" data-i="' + i + '" aria-label="Move up: ' + it.t.replace(/<[^>]+>/g, '') + '"' + (i === 0 || S.done ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" data-mv="1" data-i="' + i + '" aria-label="Move down: ' + it.t.replace(/<[^>]+>/g, '') + '"' + (i === Q.cur.length - 1 || S.done ? ' disabled' : '') + '>↓</button></li>').join('') + '</ol>';
    }

      (Q.fig ? '<div class="qfig scroll">' + Q.fig + '</div>' : '') +
      '<p class="q" id="qt-' + id + '">' + Q.q + '</p>' +
      (S.hint && Q.setup ? '<div class="setup"><ol>' + Q.setup.map(x => '<li>' + x + '</li>').join('') + '</ol></div>' : '') +

    if(focus){ const f = $('[data-act="next"]', box) || $('.pin', box) || $('.opt input:not(:disabled)', box) || $('.order button:not(:disabled)', box); if(f) f.focus({preventScroll: true}); }

  function finish(good){

    }
  }
  box.addEventListener('submit', e => { e.preventDefault(); check(); });
  box.addEventListener('click', e => {

    if(mv){ const Q = S.Q, i = +mv.dataset.i, j = i + (+mv.dataset.mv); const t = Q.cur[i]; Q.cur[i] = Q.cur[j]; Q.cur[j] = t; S.fb = null; paint(false);

/* ---------- Column chart with hover and focus ---------- */
// bars: [{label, value, text, group}]  opts: {w,h,min,max,ticks,unit,ref:{v,label},hi:index,title}
function columnChart(bars, o){
  const W = o.w || 640, H = o.h || 250, m = {l: 44, r: 12, t: 16, b: 48};
  const pw = W - m.l - m.r, ph = H - m.t - m.b, y = v => m.t + ph * (o.max - v) / (o.max - o.min);
  const band = pw / bars.length, bw = Math.min(24, band * 0.6);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="' + o.title + '">';
  o.ticks.forEach(t => { s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '" style="stroke:' + (t === 0 ? 'var(--ctl)' : 'var(--grid)') + '" stroke-width="1"/>' +
    '<text x="' + (m.l - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end" font-size="10.5" style="fill:var(--muted)">' + minus(t) + '</text>'; });
  s += '<text x="12" y="' + (m.t + ph / 2) + '" font-size="10.5" text-anchor="middle" transform="rotate(-90 12 ' + (m.t + ph / 2) + ')" style="fill:var(--muted)">' + o.unit + '</text>';
  if(o.ref){ s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(o.ref.v) + '" y2="' + y(o.ref.v) + '" style="stroke:var(--ink)" stroke-width="1"/>' +
    '<text x="' + (W - m.r) + '" y="' + (y(o.ref.v) - 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--ink)">' + o.ref.label + '</text>'; }
  bars.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5), y0 = y(0), y1 = y(b.value), top = Math.min(y0, y1), hgt = Math.max(2, Math.abs(y1 - y0)), up = b.value >= 0, r = Math.min(4, hgt);
    const x = cx - bw / 2, path = up
      ? 'M' + x + ',' + y0 + ' V' + (top + r) + ' Q' + x + ',' + top + ' ' + (x + r) + ',' + top + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + ' V' + y0 + ' Z'
      : 'M' + x + ',' + y0 + ' V' + (top + hgt - r) + ' Q' + x + ',' + (top + hgt) + ' ' + (x + r) + ',' + (top + hgt) + ' H' + (x + bw - r) + ' Q' + (x + bw) + ',' + (top + hgt) + ' ' + (x + bw) + ',' + (top + hgt - r) + ' V' + y0 + ' Z';
    s += '<path d="' + path + '" style="fill:var(--s1)"' + (o.hi === i ? '' : ' opacity="' + (o.hi == null ? 1 : .45) + '"') + '/>';
    s += '<text x="' + cx + '" y="' + (up ? top - 5 : top + hgt + 12) + '" text-anchor="middle" font-size="10" style="fill:var(--ink)">' + b.text + '</text>';
    s += '<text x="' + cx + '" y="' + (H - m.b + 15) + '" text-anchor="middle" font-size="10.5" style="fill:var(--ink)"' + (o.hi === i ? ' font-weight="700"' : '') + '>' + b.label + '</text>';
    s += '<rect class="hot" tabindex="0" data-tip="' + b.tip + '" x="' + (cx - band / 2) + '" y="' + m.t + '" width="' + band + '" height="' + ph + '" fill="transparent"/>';
  });
  (o.groups || []).forEach(g => { const xa = m.l + band * g[0] + 4, xb = m.l + band * (g[1] + 1) - 4;
    s += '<line x1="' + xa + '" x2="' + xb + '" y1="' + (H - 20) + '" y2="' + (H - 20) + '" style="stroke:var(--ctl)" stroke-width="1"/>' +
      '<text x="' + ((xa + xb) / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">' + g[2] + '</text>'; });
  return s + '</svg>';
}
function wireTips(wrap){

function packSVG(loose){
  let s = '<svg viewBox="0 0 200 92" width="200" role="img" aria-label="' + (loose ? 'Bent chains packed loosely' : 'Straight chains packed tightly') + '">';
  for(let i = 0; i < (loose ? 5 : 8); i++){
    const x = loose ? 22 + i * 38 : 16 + i * 23;
    s += '<circle cx="' + x + '" cy="12" r="6" style="fill:var(--b-bg);stroke:var(--b-line)" stroke-width="1.5"/>';
    s += loose
      ? '<polyline points="' + x + ',18 ' + x + ',46 ' + (x + (i % 2 ? -13 : 13)) + ',82" fill="none" style="stroke:var(--a-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + x + '" cy="46" r="3" style="fill:var(--bad)"/>'
      : '<line x1="' + x + '" y1="18" x2="' + x + '" y2="82" style="stroke:var(--a-line)" stroke-width="4" stroke-linecap="round"/>';
  }
  return s + '</svg>';
}
function tagSVG(fas){
  const x0 = 104, rows = [34, 86, 138], f = n => n.toFixed(1);
  let s = '', maxX = 0;
  fas.forEach((fa, k) => {
    // the ester carbon is trigonal planar: chain at 30 degrees up-right, ester O at 150 degrees, C=O straight down
    const y = rows[k], pts = faGeom(fa.c, fa.d, [], x0, y, 15, 8.66);
    maxX = Math.max(maxX, pts[fa.c].x);
    const ox = x0 - 22.52, oy = y - 13;
    s += '<text x="4" y="' + (y + 4) + '" font-size="11" style="fill:var(--muted)">C-' + (k + 1) + '</text>';
    s += '<line x1="46" y1="' + y + '" x2="' + f(ox - 6.57) + '" y2="' + f(oy + 2.41) + '" stroke="currentColor" stroke-width="1.6"/><text x="' + f(ox) + '" y="' + f(oy + 4) + '" font-size="11" text-anchor="middle" fill="currentColor">O</text>' +
         '<line x1="' + f(ox + 6.06) + '" y1="' + f(oy + 3.5) + '" x2="' + x0 + '" y2="' + y + '" stroke="currentColor" stroke-width="1.6"/>';
    s += '<line x1="' + (x0 - 1.8) + '" y1="' + (y + 2) + '" x2="' + (x0 - 1.8) + '" y2="' + (y + 14) + '" stroke="currentColor" stroke-width="1.6"/><line x1="' + (x0 + 1.8) + '" y1="' + (y + 2) + '" x2="' + (x0 + 1.8) + '" y2="' + (y + 14) + '" stroke="currentColor" stroke-width="1.6"/><text x="' + x0 + '" y="' + (y + 26) + '" font-size="11" text-anchor="middle" fill="currentColor">O</text>';
    s += faBonds(pts, fa.c, fa.d);
  });
  const W = Math.ceil(maxX + 20);
  return '<svg viewBox="0 0 ' + W + ' 172" width="' + W + '" role="img" aria-label="Triacylglycerol: glycerol with three fatty acids in ester linkage">' +
    '<rect x="32" y="20" width="16" height="132" rx="6" style="fill:var(--r-bg);stroke:var(--r-line)" stroke-width="1.5"/>' +
    '<line x1="40" y1="34" x2="40" y2="138" style="stroke:var(--r-ink)" stroke-width="1.6"/>' +
    rows.map(y => '<circle cx="40" cy="' + y + '" r="2.4" style="fill:var(--r-ink)"/>').join('') + s + '</svg>';
}

function tubeSVG(stage){
  const two = stage >= 1;

  } else {

    for(let i = 0; i < 9; i++){ s += '<circle cx="' + (72 + (i * 23) % 60) + '" cy="' + (76 + (i * 31) % 100) + '" r="3.5" style="fill:var(--a-line)"/>'; } for(let i = 0; i < 6; i++){ s += '<rect x="' + (70 + (i * 29) % 58) + '" y="' + (70 + (i * 37) % 104) + '" width="6" height="6" style="fill:var(--b-line)"/>'; }

function tlcSVG(S){
  const y0 = 262, y1 = 40, plateX = 60, plateW = 200;
  const picks = TLC.filter(t => S.on.indexOf(t.id) >= 0);
  let s = '<svg viewBox="0 0 470 300" width="470" role="img" aria-label="Thin-layer chromatography plate' + (S.run ? ' after development' : ' before development') + '">';
  s += '<rect x="' + plateX + '" y="18" width="' + plateW + '" height="266" rx="4" style="fill:var(--soft);stroke:var(--ctl)" stroke-width="1.5"/>';
  s += '<line x1="' + plateX + '" x2="' + (plateX + plateW) + '" y1="' + y0 + '" y2="' + y0 + '" style="stroke:var(--ctl)" stroke-dasharray="4 3"/><text x="' + (plateX - 6) + '" y="' + (y0 + 4) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">Start</text>';
  if(S.run) s += '<line x1="' + plateX + '" x2="' + (plateX + plateW) + '" y1="' + y1 + '" y2="' + y1 + '" style="stroke:var(--ctl)" stroke-dasharray="4 3"/><text x="' + (plateX - 6) + '" y="' + (y1 + 4) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">Front</text>';
  // label positions, kept at least 14 px apart
  const ly = {}; let lastY = -99;
  picks.slice().sort((p, q) => q.rf - p.rf).forEach(t => { const y = Math.max(y0 - t.rf * (y0 - y1), lastY + 14); ly[t.id] = y; lastY = y; });
  picks.forEach(t => {
    const y = S.run ? y0 - t.rf * (y0 - y1) : y0, yl = ly[t.id];
    s += '<ellipse cx="' + (plateX + plateW / 2) + '" cy="' + y0 + '" rx="34" ry="5" style="fill:var(--a-line);transform:translateY(' + (y - y0) + 'px);transition:transform 1.1s ease-out" stroke="none"/>';
    if(S.run) s += '<polyline points="' + (plateX + plateW / 2 + 38) + ',' + y + ' ' + (plateX + plateW - 6) + ',' + y + ' ' + (plateX + plateW + 12) + ',' + yl + '" fill="none" style="stroke:var(--ctl)"/><text x="' + (plateX + plateW + 16) + '" y="' + (yl + 4) + '" font-size="11" fill="currentColor">' + t.n + ' <tspan style="fill:var(--muted)">R<tspan baseline-shift="sub" font-size="8">f</tspan> ≈ ' + t.rf.toFixed(2) + '</tspan></text>';
  });
  if(!S.run) s += '<text x="' + (plateX + plateW + 16) + '" y="' + (y0 + 4) + '" font-size="11" fill="currentColor">sample: ' + picks.length + ' lipid class' + (picks.length === 1 ? '' : 'es') + '</text>';
  return s + '</svg>';
}

function fluidity(S){
  const tref = 55 + 5 * (S.len - 18) - 60 * (S.unsat / 100);
  const f0 = Math.max(0, Math.min(100, 50 + 2 * (S.T - tref)));
  return f0 + (50 - f0) * Math.min(1, S.chol / 50) * 0.75;
}
function memWords(F){

  if(F > 60) return {state:'Liquid-disordered (L<sub>d</sub>)', gloss:'Fluid. The chains are in constant motion and lipids move sideways freely.', pack:'loose', motion:'constant', diff:'fast'};
  return {state:'Between the two extremes', gloss:'Biological membranes are kept here: ordered enough to be a barrier, fluid enough for proteins and lipids to move.', pack:'moderate', motion:'moderate', diff:'moderate'};

const boxState = {c: 16, d: [], k: 0};
const BOX_PRESETS = [[16, []], [18, []], [12, []], [18, [9]], [18, [9, 12]], [18, [9, 12, 15]], [20, [5, 8, 11, 14]], [15, []], [17, []]];
function beadsSVG(c, d, k){
  const sp = 23, x0 = 66, y = 44, W = x0 + (c - 1) * sp + 40, gone = Math.min(c, 2 * k), done = c - gone <= 3;
  const shown = (done && c - gone === 2) ? c : gone;   // carbons already drawn as acetyl units
  let s = '<svg viewBox="0 0 ' + W + ' 96" width="' + W + '" role="img" aria-label="Fatty acyl chain of ' + c + ' carbons after ' + k + ' pass' + (k === 1 ? '' : 'es') + ' of beta oxidation">';
  for(let i = 1; i < c; i++){
    const xa = x0 + (i - 1) * sp, dbl = d.indexOf(i) >= 0, inUnit = i < shown && i % 2 === 1;
    if(i <= shown && !inUnit) continue;               // bond already cut
    s += '<line x1="' + (xa + 7) + '" y1="' + y + '" x2="' + (xa + sp - 7) + '" y2="' + y + '" style="stroke:' + (dbl && !inUnit ? 'var(--bad)' : 'var(--ink)') + '" stroke-width="' + (dbl && !inUnit ? 2 : 1.5) + '" opacity="' + (inUnit ? .3 : 1) + '"/>';
    if(dbl && !inUnit) s += '<line x1="' + (xa + 7) + '" y1="' + (y - 4.5) + '" x2="' + (xa + sp - 7) + '" y2="' + (y - 4.5) + '" style="stroke:var(--bad)" stroke-width="2"/>';
  }
  for(let i = 1; i <= c; i++){
    const x = x0 + (i - 1) * sp, rem = i <= shown, last3 = done && c - gone === 3 && i > gone;
    s += '<circle cx="' + x + '" cy="' + y + '" r="7" style="fill:' + (rem ? 'var(--soft)' : last3 ? 'var(--b-bg)' : 'var(--a-bg)') + ';stroke:' + (rem ? 'var(--ctl)' : last3 ? 'var(--b-line)' : 'var(--a-line)') + '" stroke-width="1.6"/>';
    if(i % 2 === 0 && i <= shown) s += '<path d="M' + (x - sp - 8) + ',' + (y + 13) + ' v5 h' + (sp + 16) + ' v-5" fill="none" style="stroke:var(--ctl)" stroke-width="1.2"/><text x="' + (x - sp / 2) + '" y="' + (y + 32) + '" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">' + (i / 2) + '</text>';
  }
  if(!done){
    const xc = x0 + gone * sp;
    s += '<text x="' + (xc - 12) + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" font-weight="700" style="fill:var(--ink)">CoA-S—</text>';
    s += '<text x="' + xc + '" y="' + (y - 14) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">C-1</text><text x="' + (xc + sp) + '" y="' + (y - 14) + '" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">α</text><text x="' + (xc + 2 * sp) + '" y="' + (y - 14) + '" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">β</text>';
    s += '<line x1="' + (xc + 1.5 * sp) + '" y1="' + (y - 10) + '" x2="' + (xc + 1.5 * sp) + '" y2="' + (y + 12) + '" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>';
  } else if(c - gone === 3){
    s += '<text x="' + (x0 + (gone + 1) * sp) + '" y="' + (y + 28) + '" text-anchor="middle" font-size="9.5" style="fill:var(--b-ink)">propionyl-CoA</text>';
  }
  if(shown) s += '<text x="' + (x0 - 12) + '" y="' + (y + 32) + '" text-anchor="end" font-size="9.5" style="fill:var(--muted)">acetyl-CoA</text>';
  return s + '</svg>';
}
function passText(p, j){
  const sup = n => '<sup>' + n + '</sup>';
  let t = '<b>Pass ' + (j + 1) + ':</b> C<sub>' + p.n + '</sub> → C<sub>' + p.out + '</sub> + acetyl-CoA. ';
  if(p.aux === 'isomerase') t += 'A double bond has arrived at cis-Δ' + sup(3) + '. <b>Δ' + sup(3) + ',Δ' + sup(2) + '-enoyl-CoA isomerase</b> turns it into trans-Δ' + sup(2) + ', which the hydratase accepts. Acyl-CoA dehydrogenase is skipped, so this pass makes no FADH<sub>2</sub>. NADH +1.';
  else if(p.aux === 'reductase') t += 'A double bond has arrived at cis-Δ' + sup(4) + '. Acyl-CoA dehydrogenase adds trans-Δ' + sup(2) + ' (FADH<sub>2</sub> +1). <b>2,4-Dienoyl-CoA reductase</b> uses one NADPH to give trans-Δ' + sup(3) + ', and the <b>isomerase</b> moves it to trans-Δ' + sup(2) + '. NADH +1.';
  else t += 'FADH<sub>2</sub> +1, NADH +1.';
  t += ' <span class="small">First step: ' + (p.iso.length ? p.iso.join(' or ') : 'longer than the 12 to 18 carbons Lehninger gives for VLCAD') + '. Steps 2 to 4: ' + (p.tfp ? 'trifunctional protein' : 'soluble matrix enzymes') + '.</span>';
  return t;
}

const fasState = {p: 0, acc: 'fed', target: 'ole'};
// position p: 0 = loaded; then five steps in each of seven cycles
const fasAt = p => p === 0 ? {c: 0, st: 0} : {c: Math.ceil(p / 5), st: (p - 1) % 5 + 1};
const FAS_END = 35;
function fasCount(p){
  const a = fasAt(p);
  if(p === 0) return {cycles: 0, malonyl: 1, nadph: 0, co2: 0, len: 2, done: false};
  const full = a.st === 5 ? a.c : a.c - 1;
  return {cycles: full, malonyl: Math.min(7, a.c + (a.st === 5 ? 1 : 0)), nadph: 2 * (a.c - 1) + (a.st >= 2 ? 1 : 0) + (a.st >= 4 ? 1 : 0), co2: a.c, len: 2 * a.c + 2, done: p === FAS_END};
}
function fasSVG(p){
  const a = fasAt(p), sp = 25, x0 = 138, yA = 54, yK = 118, W = 640;
  // chains are drawn as zigzags with 120 degree angles: odd-numbered carbons (C-1, the beta carbon C-3, ...) sit h higher
  const h = 14.43, lv = i => i % 2 ? -h : 0, X = i => x0 + (i - 1) * sp;
  const seg = (x1, y1, x2, y2, style) => { const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L * 8, uy = (y2 - y1) / L * 8;
    return '<line x1="' + (x1 + ux).toFixed(2) + '" y1="' + (y1 + uy).toFixed(2) + '" x2="' + (x2 - ux).toFixed(2) + '" y2="' + (y2 - uy).toFixed(2) + '" ' + (style || 'stroke="currentColor"') + ' stroke-width="1.5"/>'; };
  const bead = (x, y, kind) => kind === 'co2'
    ? '<circle cx="' + x + '" cy="' + y + '" r="7.5" style="fill:var(--bg);stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="3 2.5"/>'
    : '<circle cx="' + x + '" cy="' + y + '" r="7.5" style="fill:' + (kind === 'primer' ? 'var(--accent)' : 'var(--a-bg)') + ';stroke:' + (kind === 'primer' ? 'var(--accent)' : 'var(--a-line)') + '" stroke-width="1.6"/>';
  const chain = (y, n, extra) => { let s = '';
    const tot = n + (extra ? 1 : 0);
    for(let i = 1; i < tot; i++) s += seg(X(i), y + lv(i), X(i + 1), y + lv(i + 1));
    for(let i = 1; i <= n; i++) s += bead(X(i), y + lv(i), i > n - 2 ? 'primer' : 'mal');
    return s; };
  const arm = (y, t, sub) => '<rect x="12" y="' + (y - 17) + '" width="96" height="34" rx="8" style="fill:var(--r-bg);stroke:var(--r-line)" stroke-width="1.5"/><text x="60" y="' + (y - 2) + '" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--r-ink)">' + t + '</text><text x="60" y="' + (y + 11) + '" text-anchor="middle" font-size="9.5" style="fill:var(--r-ink)">' + sub + '</text>' +
    '<text x="121" y="' + (y + 4) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">S</text>';
  const bond = y => '<line x1="108" y1="' + y + '" x2="115" y2="' + y + '" stroke="currentColor" stroke-width="1.5"/><line x1="127" y1="' + y + '" x2="' + (x0 - 4.85) + '" y2="' + (y - h + 6.36).toFixed(2) + '" stroke="currentColor" stroke-width="1.5"/>';
  const sh = y => '<line x1="108" y1="' + y + '" x2="115" y2="' + y + '" stroke="currentColor" stroke-width="1.5"/><text x="126" y="' + (y + 4) + '" font-size="11.5" font-weight="700" fill="currentColor">H</text>';
  let s = '<svg viewBox="0 0 ' + W + ' 150" width="' + W + '" role="img" aria-label="Fatty acid synthase with the growing chain, ' + fasCount(p).len + ' carbons">';
  s += arm(yA, 'ACP', 'Pan —SH') + arm(yK, 'KS', 'Cys —SH');
  const onKS = p === 0 || (a.st === 5 && a.c < 7), n = p === 0 ? 2 : 2 * a.c + 2;
  if(p === FAS_END){
    s += sh(yA) + sh(yK);
    s += '<text x="' + x0 + '" y="' + (yA - 22) + '" font-size="11" font-weight="700" style="fill:var(--a-ink)">Palmitate, 16:0, released</text>';
    let c = ''; for(let i = 1; i < 16; i++) c += '<line x1="' + (x0 + 70 + (i - 1) * sp + 8) + '" y1="' + yA + '" x2="' + (x0 + 70 + i * sp - 8) + '" y2="' + yA + '" stroke="currentColor" stroke-width="1.5"/>';
    for(let i = 1; i <= 16; i++) c += '<circle cx="' + (x0 + 70 + (i - 1) * sp) + '" cy="' + yA + '" r="7.5" style="fill:' + (i > 14 ? 'var(--accent)' : 'var(--a-bg)') + ';stroke:' + (i > 14 ? 'var(--accent)' : 'var(--a-line)') + '" stroke-width="1.6"/>';
    s += '<text x="' + (x0 + 52) + '" y="' + (yA + 4) + '" text-anchor="end" font-size="10.5" fill="currentColor">⁻OOC</text>' + c;
    s += '<text x="' + (x0 + 70) + '" y="' + (yA + 24) + '" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">C-1</text><text x="' + (x0 + 70 + 14.5 * sp) + '" y="' + (yA + 24) + '" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">C-15, C-16</text>';

    s += '<text x="' + xa + '" y="' + (yA + 24) + '" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">α</text><text x="' + xb + '" y="' + (yA + 24) + '" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">β</text>';

    if(a.st === 2) s += '<line x1="' + xb + '" y1="' + (yb - 9) + '" x2="' + xb + '" y2="' + (yb - 19) + '" style="stroke:var(--bad)" stroke-width="1.6"/><text x="' + xb + '" y="' + (yb - 22) + '" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--bad)">OH</text>';
    if(a.st === 3) s += seg(xa - 2.25, yA - 3.9, xb - 2.25, yb - 3.9, 'style="stroke:var(--bad)"').replace('stroke-width="1.5"', 'stroke-width="2"') + '<text x="' + (xa - 4) + '" y="' + (yA - 22) + '" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--bad)">trans</text>';
    if(a.st === 1) s += '<text x="' + (x0 + Math.max(4, n) * sp + 6) + '" y="' + (yA - 18) + '" font-size="10.5" font-weight="700" style="fill:var(--muted)">CO₂ released</text>';
  }
  return s + '</svg>';
}
function fasText(p){
  const a = fasAt(p), n = 2 * a.c + 2;
  const nm = k => k === 4 ? 'butyryl' : k === 16 ? 'palmitoyl' : k + '-carbon acyl';
  if(p === 0) return '<h4>Loaded and ready</h4><p>Malonyl/acetyl-CoA–ACP transferase (MAT) moves the acetyl group of acetyl-CoA onto ACP, and it is passed to the Cys —SH of β-ketoacyl-ACP synthase (KS). MAT then puts a malonyl group from malonyl-CoA on the phosphopantetheine —SH of ACP.</p><p>The two dark carbons are the primer. Watch where they end up.</p>';
  const head = '<h4>Cycle ' + a.c + ' of 7, ';
  if(a.st === 1) return head + 'step 1: condensation (KS)</h4><p>The ' + (a.c === 1 ? 'acetyl' : nm(n - 2)) + ' group on the Cys —SH is transferred to the malonyl group on ACP, and the malonyl group loses CO<sub>2</sub> at the same moment. The product is a β-ketoacyl group ' + n + ' carbons long.</p><p>The CO<sub>2</sub> that leaves is the same carbon that acetyl-CoA carboxylase put on. Losing it makes the condensation strongly favorable, which is the reason for making malonyl-CoA at all.</p>';
  if(a.st === 2) return head + 'step 2: reduction of the carbonyl group (KR)</h4><p>β-Ketoacyl-ACP reductase uses <b>NADPH</b> to reduce the β-keto group to a hydroxyl group. The product is the <b>D</b>-β-hydroxyacyl-ACP. β Oxidation uses the L isomer.</p>';
  if(a.st === 3) return head + 'step 3: dehydration (DH)</h4><p>β-Hydroxyacyl-ACP dehydratase removes water from C-2 and C-3, leaving a <i>trans</i>-Δ<sup>2</sup> double bond.</p>';
  if(a.st === 4) return head + 'step 4: reduction of the double bond (ER)</h4><p>Enoyl-ACP reductase uses a second <b>NADPH</b> to saturate the double bond. The chain is now a saturated ' + nm(n) + ' group on ACP, two carbons longer than at the start of the cycle.</p>';
  if(a.c < 7) return head + 'step 5: translocation and reloading</h4><p>The ' + nm(n) + ' group moves from ACP to the Cys —SH of KS. That frees the phosphopantetheine —SH, and MAT loads the next malonyl group. The next cycle can begin.</p>';
  return '<h4>Release by the thioesterase (TE)</h4><p>After seven cycles the chain is 16 carbons long. The thioesterase domain hydrolyzes the bond to ACP and free <b>palmitate</b> leaves the enzyme.</p><p>The primer carbons are now C-15 and C-16, the methyl end. Every other carbon came from malonyl-CoA, and the newest carbons are always at the carboxyl end.</p>';
}

function tagCycleSVG(mode){

  const mk = k => w[k] === base[k] ? 'tc' : 'tca';
  const pill = (x, y, wd, t, cls) => '<rect x="' + (x - wd / 2) + '" y="' + (y - 13) + '" width="' + wd + '" height="26" rx="8" style="fill:var(--' + cls + '-bg);stroke:var(--' + cls + '-line)" stroke-width="1.5"/><text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--' + cls + '-ink)">' + t + '</text>';
  const arrow = (d, k) => '<path d="' + d + '" fill="none" style="stroke:' + col(k) + '" stroke-width="' + w[k] + '" marker-end="url(#' + mk(k) + ')"/>';
  const lab = (x, y, t, anchor, bold) => '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || 'middle') + '" font-size="10.5"' + (bold ? ' font-weight="700"' : '') + ' style="fill:' + (bold ? 'var(--accent)' : 'var(--muted)') + '">' + t + '</text>';
  let s = '<svg viewBox="0 0 660 262" width="660" role="img" aria-label="The triacylglycerol cycle between adipose tissue and liver: ' + T.label + '">';
  s += '<defs><marker id="tc" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker><marker id="tca" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker></defs>';
  s += '<rect x="8" y="8" width="226" height="196" rx="12" style="fill:var(--soft);stroke:var(--line)"/><text x="20" y="27" font-size="11.5" font-weight="700" fill="currentColor">Adipose tissue</text>';
  s += '<rect x="426" y="8" width="226" height="196" rx="12" style="fill:var(--soft);stroke:var(--line)"/><text x="438" y="27" font-size="11.5" font-weight="700" fill="currentColor">Liver</text>';
  s += '<text x="330" y="27" text-anchor="middle" font-size="11.5" font-weight="700" fill="currentColor">Blood</text>';
  s += pill(121, 60, 130, 'Triacylglycerol', 'a') + pill(121, 150, 130, 'Fatty acids', 'a') + pill(539, 60, 130, 'Triacylglycerol', 'a') + pill(539, 150, 130, 'Fatty acids', 'a');
  // adipose: lipolysis down, reesterification up
  s += '<path d="M90,75 V132" fill="none" style="stroke:var(--ink)" stroke-width="3" marker-end="url(#tc)"/>' + lab(84, 107, 'lipolysis', 'end');
  s += arrow('M152,135 V78', 're') + lab(160, 103, 'reesterified', 'start') + lab(160, 116, 'in the cell', 'start');
  // release to blood, to liver
  s += arrow('M188,150 H470', 'rel') + lab(330, 141, 'free fatty acids on albumin');
  // muscle branch
  s += '<path d="M330,152 V214" fill="none" style="stroke:var(--ink)" stroke-width="2" marker-end="url(#tc)"/>' + pill(330, 234, 150, 'Muscle: burned as fuel', 'b');
  // liver resynthesis
  s += arrow('M539,135 V78', 'liv') + lab(547, 110, 'resynthesis', 'start');
  // VLDL back
  s += arrow('M472,60 H192', 'vldl') + lab(330, 50, 'triacylglycerol in VLDL') + lab(330, 80, 'released by lipoprotein lipase');
  // glyceroneogenesis notes
  s += lab(20, 183, 'glycerol 3-phosphate from', 'start') + lab(20, 196, 'glyceroneogenesis', 'start') + (T.pep[0] ? lab(222, 196, T.pep[0], 'end', true) : '');
  s += lab(438, 183, 'glyceroneogenesis and', 'start') + lab(438, 196, 'gluconeogenesis', 'start') + (T.pep[1] ? lab(640, 196, T.pep[1], 'end', true) : '');
  return s + '</svg>';
}
