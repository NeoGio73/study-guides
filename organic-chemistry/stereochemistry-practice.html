<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stereochemistry Practice</title>
<style>
  :root {
    --ink: #17212b;
    --ink-soft: #4a5866;
    --ink-faint: #6b7a89;
    --paper: #ffffff;
    --wash: #f4f6f8;
    --line: #d9dfe5;
    --accent: #0f5c7a;
    --accent-soft: #e3f0f5;
    --good: #1a6b3c;
    --good-soft: #e5f4ea;
    --bad: #a3271f;
    --bad-soft: #fbeae8;
    --halo: #e8a100;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }

  header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
  header.top h1 { font-size: 1.35rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--ink-faint); font-size: 0.9rem; }
  .score { margin-left: auto; font-size: 0.9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .score b { color: var(--ink); }

  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .dots button {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-soft);
    font: inherit; font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums;
    cursor: pointer; padding: 0;
  }
  .dots button:hover { border-color: var(--accent); }
  .dots button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .dots button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .dots button[aria-current="true"] { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 800px) { .card { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

  /* ---------- viewer ---------- */
  .stage { border: 1px solid var(--line); border-radius: var(--radius); background: var(--wash); overflow: hidden; }
  .viewers { display: grid; grid-template-columns: minmax(0, 1fr); }
  .stage.pair .viewers { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .viewer { display: flex; flex-direction: column; height: 380px; min-width: 0; }
  .stage.pair .viewer { height: 340px; }
  .frame { position: relative; flex: 1; min-height: 0; }
  .stage.pair .viewer + .viewer { border-left: 1px solid var(--line); }
  .stage:not(.pair) #viewB { display: none; }
  .stage:not(.pair) .cap { display: none; }
  @media (max-width: 800px) { .viewer { height: 320px; } .stage.pair .viewer { height: 280px; } }
  .viewer .host { position: absolute; inset: 0; }
  .cap {
    flex: none; padding: 6px 10px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.02em;
    color: var(--ink); background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 20px; color: var(--ink-faint); font-size: 0.9rem; pointer-events: none;
  }
  .viewer.ready .loading { display: none; }
  .loading.err { color: var(--bad); pointer-events: auto; }

  .tools {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 10px; border-top: 1px solid var(--line); background: var(--paper);
  }
  .tools button {
    font: inherit; font-size: 0.8rem; font-weight: 500; color: var(--ink-soft);
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  .tools button:hover { border-color: var(--accent); color: var(--accent); }
  .tools button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 10px 10px; background: var(--paper); font-size: 0.78rem; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35); display: inline-block; }
  .legend .ring i { background: transparent; border: 2.5px solid var(--halo); }
  .hint { margin: 8px 2px 0; font-size: 0.8rem; color: var(--ink-faint); }

  /* ---------- question ---------- */
  .topic { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
  .qnum { font-size: 0.85rem; color: var(--ink-faint); margin: 0 0 6px; font-variant-numeric: tabular-nums; }
  .prompt:focus { outline: none; }
  .prompt { font-size: 1.1rem; line-height: 1.4; font-weight: 600; margin: 0 0 14px; text-wrap: pretty; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; background: var(--paper);
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin: 4px 0 0; accent-color: var(--accent); flex: none; width: 16px; height: 16px; }
  .opt .letter { font-weight: 700; color: var(--ink-faint); flex: none; width: 1.1em; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .locked .opt { cursor: default; }
  .locked .opt:hover { border-color: var(--line); }
  .locked .opt.sel:hover { border-color: var(--bad); }
  .locked .opt.correct, .locked .opt.correct:hover { border-color: var(--good); background: var(--good-soft); }
  .locked .opt.sel:not(.correct) { border-color: var(--bad); background: var(--bad-soft); }
  .opt .mark { margin-left: auto; font-weight: 700; font-size: 0.85rem; flex: none; }
  .opt.correct .mark { color: var(--good); }
  .opt.sel:not(.correct) .mark { color: var(--bad); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem; border-radius: 8px; padding: 9px 18px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .btn.ghost { background: var(--paper); color: var(--accent); }
  .btn.ghost:hover { background: var(--accent-soft); filter: none; }
  :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .feedback { margin-top: 14px; border-radius: 8px; padding: 12px 14px; border-left: 4px solid; }
  .feedback.right { background: var(--good-soft); border-color: var(--good); }
  .feedback.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .feedback h3 { margin: 0 0 4px; font-size: 0.95rem; }
  .feedback.right h3 { color: var(--good); }
  .feedback.wrong h3 { color: var(--bad); }
  .feedback p { margin: 0; font-size: 0.92rem; }
  .feedback p + p { margin-top: 6px; }

  /* ---------- results ---------- */
  .results h2 { font-size: 1.3rem; margin: 0 0 4px; }
  .big { font-size: 2.6rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .big small { font-size: 1rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0; }
  .results table { border-collapse: collapse; width: 100%; max-width: 560px; margin: 18px 0; font-size: 0.92rem; }
  .results th, .results td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); }
  .results th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600; }
  .results td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 8px; width: 120px; max-width: 100%; border-radius: 4px; background: var(--wash); border: 1px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .missed { padding-left: 1.2em; margin: 6px 0 0; font-size: 0.92rem; }
  .missed button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; text-align: left; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Stereochemistry Practice</h1>
    <p>20 questions. Drag a model to rotate it.</p>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <nav aria-label="Questions"><ol class="dots" id="dots"></ol></nav>

  <main id="quiz" class="card">
    <section aria-label="3D model">
      <div class="stage" id="stage">
        <div class="viewers">
          <div class="viewer" id="viewA"><div class="cap">Molecule A</div><div class="frame"><div class="host" id="hostA"></div><div class="loading">Loading 3D viewer…</div></div></div>
          <div class="viewer" id="viewB"><div class="cap">Molecule B</div><div class="frame"><div class="host" id="hostB"></div><div class="loading">Loading 3D viewer…</div></div></div>
        </div>
        <div class="tools" role="group" aria-label="Viewer controls">
          <button type="button" id="tSpin" aria-pressed="false">Spin</button>
          <button type="button" id="tLabels" aria-pressed="true">Element labels</button>
          <button type="button" id="tFill" aria-pressed="false">Space-filling</button>
          <button type="button" id="tIn" aria-label="Zoom in">Zoom +</button>
          <button type="button" id="tOut" aria-label="Zoom out">Zoom −</button>
          <button type="button" id="tReset">Reset view</button>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <p class="hint">Drag to rotate. Shift + drag up or down to zoom. Hover over an atom to see its element.</p>
    </section>

    <section aria-label="Question">
      <p class="topic" id="topic"></p>
      <p class="qnum" id="qnum"></p>
      <h2 class="prompt" id="prompt" tabindex="-1"></h2>
      <form id="form" novalidate>
        <fieldset id="opts"><legend class="sr">Answer choices</legend></fieldset>
        <div class="actions">
          <button class="btn" type="submit" id="check" disabled>Check answer</button>
          <button class="btn ghost" type="button" id="prev">Previous</button>
          <button class="btn ghost" type="button" id="next">Next</button>
        </div>
      </form>
      <div id="feedback" aria-live="polite"></div>
    </section>
  </main>

  <section id="results" class="results" hidden aria-label="Results"></section>
</div>

  var ELEMENTS = {
    C: ["Carbon", "#909090"], H: ["Hydrogen", "#ffffff"], O: ["Oxygen", "#ff0d0d"], N: ["Nitrogen", "#3050f8"],
    S: ["Sulfur", "#ffff30"], F: ["Fluorine", "#90e050"], Cl: ["Chlorine", "#1ff01f"], Br: ["Bromine", "#a62929"]
  };
  var ELEMENT_ORDER = ["C", "H", "N", "O", "F", "S", "Cl", "Br"];

  var $ = function (id) { return document.getElementById(id); };
  var state = { i: 0, picks: [], orders: [], view: { spin: false, labels: true, fill: false } };

  function shuffle(a) {
    for (var k = a.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[j]; a[j] = t;
    }
    return a;
  }
  function newAttempt() {
    state.i = 0;
    state.picks = QUESTIONS.map(function () { return null; });
    state.orders = QUESTIONS.map(function (q) {
      var idx = q.options.map(function (_, n) { return n; });
      return q.fixed ? idx : shuffle(idx);
    });
  }

  /* ---------------- JSmol ---------------- */
  var applets = {}, ready = {}, pending = {};

  function viewerError(msg) {
    ["viewA", "viewB"].forEach(function (id) {
      var l = $(id).querySelector(".loading");
      l.className = "loading err";
      l.textContent = msg;
    });
  }

  function makeApplet(key) {
    var info = {
      width: "100%", height: "100%", use: "HTML5", color: "#F4F6F8",
      j2sPath: JSMOL + "/j2s",
      disableInitialConsole: true, disableJ2SLoadMonitor: true, addSelectionOptions: false, debug: false,
      script: "set antialiasDisplay true; set disablePopupMenu true; set frank off;",
      readyFunction: function () {
        ready[key] = true;
        $("view" + key).classList.add("ready");
        if (pending[key]) { Jmol.script(applets[key], pending[key]); pending[key] = null; }
      }
    };
    Jmol.setDocument(0);
    applets[key] = Jmol.getApplet("jsmol" + key, info);
    Jmol.$("#host" + key).html(Jmol.getAppletHtml(applets[key]));
    ["wheel", "mousewheel", "DOMMouseScroll"].forEach(function (type) {
      $("host" + key).addEventListener(type, function (ev) { ev.stopPropagation(); }, true);
    });
  }

  function run(key, script) {
    if (!applets[key]) return;
    if (ready[key]) Jmol.script(applets[key], script);
    else pending[key] = (pending[key] || "") + script;
  }
  function runAll(script) { run("A", script); run("B", script); }

  function atoms(list) { return list.map(function (n) { return "atomno=" + n; }).join(" or "); }

  function labelScript(map, color, offset) {
    var s = "";
    Object.keys(map).forEach(function (n) {
      s += "select atomno=" + n + "; label \"" + map[n] + "\"; color label " + color + "; font label 18 bold; set labelOffset " + (offset || "10 10") + "; background label [xFFFFFF]; set labelFront;";
    });
    return s;
  }
  function styleScript() {
    return state.view.fill
      ? "select *; wireframe off; spacefill 100%;"
      : "select *; wireframe 0.13; spacefill 22%;";
  }
  function elementLabelScript() {
    return state.view.labels
      ? "select not (carbon or hydrogen); label %e; color label [x17212B]; font label 15 bold; set labelOffset 0 0; background label [xFFFFFF];"
      : "select not (carbon or hydrogen); label off;";
  }
  function haloScript(list) {
    return list && list.length ? "select " + atoms(list) + "; halos 0.5; color halos [xE8A100];" : "";
  }
  function revealScript(m) {
    return haloScript(m.revealHalo) + (m.reveal ? labelScript(m.reveal, "[x0F5C7A]", m.label ? "0 0" : "") : "");
  }
  function modelScript(m, revealed) {
    return "load DATA \"m\"\n" + MOLS[m.mol] + "\nEND \"m\";"
      + "set hoverDelay 0.1; hover \"%e\"; unbind \"WHEEL\";"
      + styleScript() + elementLabelScript() + haloScript(m.halo)
      + (m.label ? labelScript(m.label, "[x17212B]", "0 0") : "")
      + (revealed ? revealScript(m) : "")
      + "select none; zoom 105; spin " + (state.view.spin ? "on" : "off") + ";";
  }

  function elementsIn(models) {
    var seen = {};
    models.forEach(function (m) {
      MOLS[m.mol].split("\n").forEach(function (line) {
        var hit = /^\s*-?\d+\.\d+\s+-?\d+\.\d+\s+-?\d+\.\d+\s+([A-Z][a-z]?)\s/.exec(line);
        if (hit) seen[hit[1]] = true;
      });
    });
    return ELEMENT_ORDER.filter(function (e) { return seen[e]; });
  }

  function showModels(q, revealed) {
    var pair = q.models.length === 2;
    $("stage").classList.toggle("pair", pair);
    run("A", modelScript(q.models[0], revealed));
    if (pair) run("B", modelScript(q.models[1], revealed));
    // the canvas has to be re-measured after the layout switches between one and two viewers
    if (window.Jmol) setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 0);

    var html = elementsIn(q.models).map(function (e) {
      return "<span><i style=\"background:" + ELEMENTS[e][1] + "\"></i>" + ELEMENTS[e][0] + "</span>";
    }).join("");
    if (q.models.some(function (m) { return m.halo && m.halo.length; })) {
      html += "<span class=\"ring\"><i></i>Highlighted atom</span>";
    }
    $("legend").innerHTML = html;
  }

  /* ---------------- quiz ---------------- */
  function scoreNow() {
    var done = 0, right = 0;
    state.picks.forEach(function (p, n) {
      if (p !== null) { done++; if (p === QUESTIONS[n].answer) right++; }
    });
    return { done: done, right: right };
  }

  function renderDots() {
    var ol = $("dots");
    ol.innerHTML = "";
    QUESTIONS.forEach(function (q, n) {
      var li = document.createElement("li"), b = document.createElement("button");
      var p = state.picks[n], status = p === null ? "not answered" : (p === q.answer ? "correct" : "incorrect");
      b.type = "button";
      b.textContent = n + 1;
      b.setAttribute("aria-label", "Question " + (n + 1) + ", " + status);
      if (p !== null) b.className = p === q.answer ? "right" : "wrong";
      if (n === state.i && !$("quiz").hidden) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { go(n); });
      li.appendChild(b);
      ol.appendChild(li);
    });
    var s = scoreNow();
    $("score").innerHTML = "Score <b>" + s.right + "</b> / " + s.done + " answered";
  }

  function renderQuestion(focus, keepModels) {
    var q = QUESTIONS[state.i], pick = state.picks[state.i], locked = pick !== null;
    $("quiz").hidden = false;
    $("results").hidden = true;
    $("topic").textContent = q.topic;
    $("qnum").textContent = "Question " + (state.i + 1) + " of " + QUESTIONS.length;
    $("prompt").innerHTML = q.prompt;

    var box = $("opts");
    box.className = locked ? "locked" : "";
    Array.prototype.slice.call(box.querySelectorAll(".opt")).forEach(function (el) { el.remove(); });
    state.orders[state.i].forEach(function (optIndex, pos) {
      var label = document.createElement("label"), input = document.createElement("input");
      label.className = "opt";
      input.type = "radio"; input.name = "answer"; input.value = optIndex;
      input.disabled = locked;
      if (pick === optIndex) { input.checked = true; label.classList.add("sel"); }
      if (locked && optIndex === q.answer) label.classList.add("correct");
      label.appendChild(input);
      label.insertAdjacentHTML("beforeend",
        "<span class=\"letter\">" + "ABCD".charAt(pos) + "</span><span>" + q.options[optIndex] + "</span>"
        + (locked && optIndex === q.answer ? "<span class=\"mark\">Correct</span>" : "")
        + (locked && pick === optIndex && optIndex !== q.answer ? "<span class=\"mark\">Your answer</span>" : ""));
      input.addEventListener("change", function () {
        Array.prototype.slice.call(box.querySelectorAll(".opt")).forEach(function (el) { el.classList.remove("sel"); });
        label.classList.add("sel");
        $("check").disabled = false;
      });
      box.appendChild(label);
    });

    $("check").hidden = locked;
    $("check").disabled = true;
    $("prev").disabled = state.i === 0;
    var last = state.i === QUESTIONS.length - 1;
    $("next").textContent = last ? "See results" : "Next";
    $("next").className = locked ? "btn" : "btn ghost";

    renderFeedback();
    renderDots();
    if (!keepModels) showModels(q, locked);
    if (focus) $("prompt").focus({ preventScroll: true });
  }

  function renderFeedback() {
    var q = QUESTIONS[state.i], pick = state.picks[state.i];
    if (pick === null) { $("feedback").innerHTML = ""; return; }
    var ok = pick === q.answer;
    $("feedback").innerHTML = "<div class=\"feedback " + (ok ? "right" : "wrong") + "\"><h3>"
      + (ok ? "Correct" : "Not quite") + "</h3><p>" + q.why + "</p>"
      + (q.models.some(function (m) { return m.reveal; }) ? "<p>The labels are now shown on the model.</p>" : "")
      + "</div>";
  }

  function go(n) { state.i = n; renderQuestion(true); }

  function showResults() {
    var s = scoreNow(), total = QUESTIONS.length, topics = {}, order = [];
    QUESTIONS.forEach(function (q, n) {
      if (!topics[q.topic]) { topics[q.topic] = { right: 0, total: 0 }; order.push(q.topic); }
      topics[q.topic].total++;
      if (state.picks[n] === q.answer) topics[q.topic].right++;
    });
    var rows = order.map(function (t) {
      var v = topics[t];
      return "<tr><td>" + t + "</td><td class=\"n\">" + v.right + " / " + v.total + "</td><td><div class=\"bar\"><i style=\"width:"
        + Math.round(100 * v.right / v.total) + "%\"></i></div></td></tr>";
    }).join("");
    var review = QUESTIONS.map(function (q, n) {
      var p = state.picks[n];
      if (p === q.answer) return "";
      return "<li><button type=\"button\" data-q=\"" + n + "\">Question " + (n + 1) + "</button> (" + q.topic
        + (p === null ? ", not answered" : "") + ")</li>";
    }).join("");

    $("quiz").hidden = true;
    var r = $("results");
    r.hidden = false;
    r.innerHTML = "<h2 tabindex=\"-1\" id=\"rh\">Your results</h2>"
      + "<p class=\"big\">" + s.right + " <small>of " + total + " correct"
      + (s.done < total ? " (" + (total - s.done) + " not answered)" : "") + "</small></p>"
      + "<table><thead><tr><th>Topic</th><th>Score</th><th><span class=\"sr\"></span></th></tr></thead><tbody>" + rows + "</tbody></table>"
      + (review ? "<h3>Questions to review</h3><ul class=\"missed\">" + review + "</ul>" : "<p>Every question correct. Well done.</p>")
      + "<div class=\"actions\"><button class=\"btn\" type=\"button\" id=\"again\">Start a new attempt</button></div>";
    Array.prototype.slice.call(r.querySelectorAll("[data-q]")).forEach(function (b) {
      b.addEventListener("click", function () { go(+b.getAttribute("data-q")); });
    });
    $("again").addEventListener("click", function () { newAttempt(); renderQuestion(true); });
    renderDots();
    $("rh").focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var chosen = $("opts").querySelector("input:checked");
    if (!chosen || state.picks[state.i] !== null) return;
    state.picks[state.i] = +chosen.value;
    renderQuestion(false, true);
    QUESTIONS[state.i].models.forEach(function (m, n) { run("AB".charAt(n), revealScript(m) + "select none;"); });
    $("next").focus({ preventScroll: true });
  });
  $("prev").addEventListener("click", function () { if (state.i > 0) go(state.i - 1); });
  $("next").addEventListener("click", function () {
    if (state.i < QUESTIONS.length - 1) go(state.i + 1); else showResults();
  });

  function toggle(id, prop, script) {
    $(id).addEventListener("click", function () {
      state.view[prop] = !state.view[prop];
      this.setAttribute("aria-pressed", String(state.view[prop]));
      runAll(script() + "select none;");
    });
  }
  toggle("tSpin", "spin", function () { return "spin " + (state.view.spin ? "on" : "off") + ";"; });
  toggle("tLabels", "labels", elementLabelScript);
  toggle("tFill", "fill", styleScript);
  $("tIn").addEventListener("click", function () { runAll("zoom *1.25;"); });
  $("tOut").addEventListener("click", function () { runAll("zoom /1.25;"); });
  $("tReset").addEventListener("click", function () { runAll("reset; zoom 105;"); });

  /* ---------------- start ---------------- */
  newAttempt();
  if (window.Jmol && !window.jsmolFailed) {
    try { makeApplet("A"); makeApplet("B"); }
    catch (err) { viewerError("The 3D viewer could not start in this browser."); }
  } else {
    viewerError("The 3D viewer could not be loaded. Check your internet connection, then reload this page.");
  }
  renderQuestion(false);
})();
</script>
</body>
</html>
