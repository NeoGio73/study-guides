<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Substitution and Elimination Study Guide</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f5f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      #unity-container { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #f3f5f8; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #1b2430; }
      #loading .bar { width: 260px; height: 10px; background: #e6ebf0; border-radius: 99px; overflow: hidden; margin: 12px auto 0; }
      #loading .bar div { height: 100%; width: 0; background: #0b6ea8; }
      #unity-warning { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #fff4e0; border: 1px solid #f3d9a4; padding: 8px 14px; border-radius: 8px; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div><b>Substitution &amp; Elimination</b> interactive study guide</div><div style="color:#5c6773;font-size:14px;margin-top:4px">Loading the Unity player… <span id="pct">0%</span></div><div class="bar"><div id="bar"></div></div></div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var w = document.querySelector("#unity-warning"); w.innerHTML = msg; w.style.display = "block";
        if (type !== "error") setTimeout(function () { w.style.display = "none"; }, 5000);
      }
      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Organic Chemistry",
        productName: "Substitution and Elimination Study Guide",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };
      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#pct").textContent = Math.round(p * 100) + "%";
          document.querySelector("#bar").style.width = (p * 100) + "%";
        }).then(function () { document.querySelector("#loading").style.display = "none"; })
          .catch(function (m) { unityShowBanner(m, "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
