    '<p class="lede">Every reaction problem is a trip through <b>moles</b>, and there are three doors into moles. A solid uses its molar mass. A solution uses its molarity. A gas uses PV = nRT. Select any conversion on the map to see how it works.</p>'+
    '<div class="paths" role="group" aria-label="Highlight a route"><span class="lab">Show the route for</span>'+
      Object.keys(PATHS).map(k=>'<button type="button" class="btn inline" style="margin-top:0" data-path="'+k+'" aria-pressed="false">'+PATHS[k].label+'</button>').join('')+
      '<button type="button" class="btn inline" style="margin-top:0" data-path="">Whole map</button>'+
    '</div>'+
    '<div class="map">'+
      '<div class="rowlab a"'+at('1/3',1)+'>Substance A: what you are given</div>'+
      node('GA','a','Gas A','P, V and T',3,1)+
      conn('gcA','PV = nRT',3,2,'vert')+
      node('mA','a','Mass of A','grams',1,3)+conn('MA','molar mass',2,3)+
      node('nA','a','Moles of A','mol',3,3)+conn('cA','molarity',4,3)+
      node('vA','a','Solution of A','volume in liters',5,3)+
      '<div class="rowlab b"'+at('1/3',4)+'>Substance B: what you want</div>'+
      conn('ratio','mole ratio',3,4,'ratio')+
      node('mB','b','Mass of B','grams',1,5)+conn('MB','molar mass',2,5)+
      node('nB','b','Moles of B','mol',3,5)+conn('cB','molarity',4,5)+
      node('vB','b','Solution of B','volume or molarity',5,5)+
      conn('gcB','PV = nRT',3,6,'vert')+
      node('GB','b','Gas B','volume or pressure',3,7)+
    '</div>'+
    '<div class="detail" id="detail" aria-live="polite"></div>'+
    '<div class="builds"><h3>Three things to keep in mind</h3><ul>'+
      '<li><b>Gas units.</b> With R = 0.08206 L·atm/(mol·K), pressure must be in atm, volume in liters and temperature in kelvins. Convert before you calculate.</li>'+
      '<li><b>Dilution.</b> Adding water changes the volume of a solution but not the moles of solute, so M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub>. No reaction happens, so no mole ratio is needed.</li>'+
      '<li><b>Limiting reactant.</b> When you have amounts of two reactants, take the trip from each one. The smaller amount of product is the real answer.</li>'+
    '</ul></div>'+
    '</section>';
  view.onclick=e=>{
    const c=e.target.closest('.conn'); if(c){ state.mapSel=c.dataset.id; paintMap(); return; }
    const p=e.target.closest('button[data-path]'); if(p){ state.mapPath=p.dataset.path||null; paintMap(); }
  };
  paintMap();
}
function paintMap(){
  const on = state.mapPath ? PATHS[state.mapPath].on : null;
  view.querySelectorAll('.map [data-id]').forEach(el=>{
    el.classList.toggle('dim', !!on && on.indexOf(el.dataset.id)<0);
    if(el.classList.contains('conn')) el.setAttribute('aria-pressed', String(state.mapSel===el.dataset.id));
  });
  view.querySelectorAll('button[data-path]').forEach(b=>{
    if(b.dataset.path) b.setAttribute('aria-pressed', String(state.mapPath===b.dataset.path));
    b.classList.toggle('primary', !!b.dataset.path && state.mapPath===b.dataset.path);
  });
  const d=$('#detail'), info=MAPINFO[state.mapSel];
  d.innerHTML = info ? '<h3>'+info.t+'</h3>'+info.h
    : '<h3>How to read the map</h3><p>The upper half is the substance you are given. The lower half is the substance you want. Start at the box that matches what the question gives you, travel through moles and the mole ratio, and finish at the box the question asks for.</p><p style="margin:0">Select molar mass, molarity, PV = nRT, or mole ratio on the map for details and an example.</p>';
}

/* ---------- Shared pieces for practice sections ---------- */
function eqBlock(rxn, hl){
  const side=arr=>arr.map(e=>
    '<span class="sp'+(hl[e[1]] ? ' '+hl[e[1]] : '')+'">'+(e[0]>1?'<span class="coef">'+e[0]+'</span>':'')+F(e[1])+'<span class="st">('+e[2]+')</span></span>'
  ).join('<span class="plus">+</span>');
  const text=arr=>arr.map(e=>(e[0]>1?e[0]+' ':'')+e[1]).join(' plus ');
  return '<div class="eqwrap"><div class="eq" role="img" aria-label="Balanced equation: '+text(rxn.r)+' yields '+text(rxn.p)+'">'+
    side(rxn.r)+'<span class="arrow">→</span>'+side(rxn.p)+'</div>'+
    '<div class="keys" aria-hidden="true"><span class="key a">given</span><span class="key b">wanted</span></div></div>';
}
function amLine(list){
  const seen=[]; list.forEach(f=>parseFormula(f).forEach(([e])=>{ if(seen.indexOf(e)<0) seen.push(e); }));
  return seen.map(e=>e+' '+AM[e]).join(', ');
}
function partHTML(part, i, multi){
  if(!multi){
    return '<div class="ansrow"><label for="pin0">Your answer</label>'+
      '<input id="pin0" class="pin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">'+
      '<span class="unit">'+part.unit+'</span><span class="pmark" id="pm0" aria-hidden="true"></span>'+
      '<button class="btn primary" type="submit">Check answer</button></div>';
  }
  const letter='('+LET[i]+') ';
  if(part.type==='choice'){
    return '<li class="part"><span class="plab" id="pl'+i+'">'+letter+part.label+'</span>'+
      '<span class="pctl"><span class="choice" id="pc'+i+'" role="radiogroup" aria-labelledby="pl'+i+'">'+
      part.options.map(o=>'<label class="opt"><input type="radio" name="p'+i+'" value="'+o+'"><span>'+F(o)+'</span></label>').join('')+
      '</span><span class="pmark" id="pm'+i+'" aria-hidden="true"></span></span></li>';
  }
  return '<li class="part"><label class="plab" for="pin'+i+'">'+letter+part.label+'</label>'+
    '<span class="pctl"><input id="pin'+i+'" class="pin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false">'+
    '<span class="unit">'+part.unit+'</span><span class="pmark" id="pm'+i+'" aria-hidden="true"></span></span></li>';
}
function setFb(type, html){
  const fb=$('#fb'), ic={ok:'✓',bad:'✗',warn:'!',info:'i'}[type];
  fb.className='fb show '+type;
  fb.innerHTML='<span class="ic" aria-hidden="true">'+ic+'</span><div>'+html+'</div>';
}
function lock(){
  document.querySelectorAll('#ans input, #ans button').forEach(el=>{ el.disabled=true; });
}
function readPart(parts, i){
  if(parts[i].type==='choice'){ const c=$('#ans input[name="p'+i+'"]:checked'); return c ? c.value : ''; }
  return $('#pin'+i).value;
}
function markPart(parts, i, good){
  const el = parts[i].type==='choice' ? $('#pc'+i) : $('#pin'+i), pm=$('#pm'+i);
  el.classList.remove('ok','no'); el.classList.add(good?'ok':'no');
  pm.className='pmark '+(good?'ok':'no'); pm.textContent=good?'✓':'✗';
  if(good){
    if(parts[i].type==='choice') el.querySelectorAll('input').forEach(x=>{ x.disabled=true; });
    else el.disabled=true;
  }
}
const sigMsg = (part, lead) => '<p>'+lead+'The value is right. Report it with '+part.sf+' significant figures, the fewest in the given data: <b>'+part.show+'</b>.</p>';

/* ---------- Practice sections ---------- */
function nextProblem(kind){
  const S=state[kind];
  S.P=makeProblem(kind, S.P); S.misses=0; S.hint=0; S.done=false; S.partDone=[];
}
function renderPractice(kind){
  const S=state[kind], m=META[kind], n=TABS.find(t=>t.id===kind).n;
  if(!S.P) nextProblem(kind);
  view.onclick=null;
  view.innerHTML=
    '<section>'+
    '<h2>'+n+'. '+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    '<div class="modebar"><span class="modebar-label" id="ml">How much help</span>'+
      '<div class="seg" role="group" aria-labelledby="ml">'+
      MODES.map(o=>'<button type="button" data-mode="'+o.id+'" aria-pressed="'+(S.mode===o.id)+'">'+o.label+'</button>').join('')+
      '</div></div>'+
    '<article class="problem" id="problem"></article>'+
    '<p class="tally" id="tally"></p>'+
    '</section>';
  $('.seg',view).addEventListener('click',e=>{
    const b=e.target.closest('button[data-mode]'); if(!b) return;
    setMode(kind, b.dataset.mode);
  });
  $('#problem').addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const act=b.dataset.act;
    if(act==='hint'){ S.hint++; drawHelp(kind); drawActions(kind); }
    else if(act==='solution'){ revealSolution(kind); }
    else if(act==='next'){ nextProblem(kind); drawProblem(kind,true); }
    else if(act==='levelup'){ setMode(kind, S.mode==='guided' ? 'hint' : 'solo'); const f=$('#problem .pin'); if(f) f.focus(); }
  });
  drawProblem(kind,false);
}
// Changing the help level keeps whatever the student has already typed.
function setMode(kind, mode){
  const S=state[kind];
  S.mode=mode; S.hint=0;
  view.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===mode)));
  if(S.done){ nextProblem(kind); drawProblem(kind,false); }
  else { drawHelp(kind); drawActions(kind); }
}
function drawProblem(kind, focus){
  const S=state[kind], P=S.P, multi=P.parts.length>1;
  $('#problem').innerHTML=
    '<p class="ctx">'+P.ctx+'</p>'+
    (P.rxn ? eqBlock(P.rxn, P.hl) : '')+
    (P.am ? '<p class="am">Atomic masses (g/mol): '+amLine(P.am)+'</p>' : '')+
    '<p class="q">'+P.question+'</p>'+
    '<form id="ans" novalidate autocomplete="off">'+
      '<div id="help"></div>'+
      (multi ? '<ol class="parts">'+P.parts.map((p,i)=>partHTML(p,i,true)).join('')+'</ol>'+
               '<div class="checkrow"><button class="btn primary" type="submit">Check answers</button></div>'
             : partHTML(P.parts[0],0,false))+
    '</form>'+
    '<div id="fb" class="fb" role="status" aria-live="polite"></div>'+
    '<div id="sol"></div>'+
    '<div class="actions" id="actions"></div>';
  $('#ans').addEventListener('submit',e=>{ e.preventDefault(); check(kind); });
  drawHelp(kind); drawActions(kind); drawTally(kind);
  if(focus){ const f=$('#help input')||$('#problem .pin')||$('#problem .opt input'); if(f) f.focus(); }
}
function drawHelp(kind){
  const S=state[kind], P=S.P; let out='';
  if(S.mode==='guided') out=P.guided;
  else if(S.mode==='hint') out=P.hints.slice(0,S.hint).join('');
  $('#help').innerHTML=out;
}
function drawActions(kind){
  const S=state[kind]; let out='';
  if(S.mode==='hint' && !S.done && S.hint<2)
    out+='<button type="button" class="btn" data-act="hint">'+(S.hint===0?'Show a hint':'Show another hint')+'</button>';
  if(!S.done && S.misses>=2)
    out+='<button type="button" class="btn" data-act="solution">Show worked solution</button>';
  out+='<button type="button" class="btn'+(S.done?' primary':'')+'" data-act="next">'+(S.done?'Next problem':'Skip to a new problem')+'</button>';
  $('#actions').innerHTML=out;
}
function drawTally(kind){
  const S=state[kind];
  $('#tally').textContent = S.solved===0 ? 'No problems solved yet this session.'
    : 'Solved this session: '+S.solved+(S.streak>1 ? ' ('+S.streak+' in a row)' : '');
}
// Marks each filled blank right or wrong and returns the most useful message.
function checkBlanks(P){
  const res={any:false, allOK:true, msg:''}, got={};
  Object.keys(P.blanks).forEach(k=>{
    const i=$('#help input[data-k="'+k+'"]'); if(!i) return;
    const raw=i.value.trim(), inp=parseInput(raw), v=inp ? inp.value : NaN;
    i.classList.remove('ok','no'); i.removeAttribute('aria-invalid');
    if(!raw){ res.allOK=false; got[k]={empty:true}; return; }
    res.any=true;
    const want=P.blanks[k].want;
    const good=isFinite(v) && Math.abs(v-want)<=P.blanks[k].tol*Math.abs(want)+1e-12;
    i.classList.add(good?'ok':'no'); if(!good){ i.setAttribute('aria-invalid','true'); res.allOK=false; }
    got[k]={v, good};
  });
  res.msg=P.blankMsg(got)||'';
  return res;
}
function check(kind){
  const S=state[kind], P=S.P; if(S.done) return;
  const multi=P.parts.length>1, tagOf=i=> multi ? '<b>('+LET[i]+')</b> ' : '';
  const bl = S.mode==='guided' ? checkBlanks(P) : {any:false, allOK:true, msg:''};
  const res=P.parts.map((part,i)=> S.partDone[i] ? {status:'done'} : gradePart(part, readPart(P.parts,i)));
  const open=res.filter(r=>r.status!=='done');

  if(open.every(r=>r.status==='empty')){
    if(bl.any && bl.msg) setFb('bad','<p>'+bl.msg+'</p>');
    else if(bl.any && bl.allOK) setFb('info','<p>The setup is right. Now run the numbers and enter your answer'+(multi?'s':'')+'.</p>');
    else if(bl.any) setFb('info','<p>Good so far. Fill in the remaining blanks, then calculate.</p>');
    else setFb('info','<p>Enter your answer'+(multi?'s':'')+', then select Check answer'+(multi?'s':'')+'.</p>');
    return;
  }
  const inv=res.findIndex(r=>r.status==='invalid');
  if(inv>=0){ setFb('info','<p>'+tagOf(inv)+res[inv].msg+'</p>'); return; }

  const wrong=[], sigs=[], newlyRight=[];
  res.forEach((r,i)=>{
    if(r.status==='correct' || r.status==='sig'){ S.partDone[i]=true; markPart(P.parts,i,true); newlyRight.push(i); if(r.status==='sig') sigs.push(i); }
    else if(r.status==='wrong' || r.status==='close'){ markPart(P.parts,i,false); wrong.push(i); }
  });
  const sigNote=sigs.map(i=>sigMsg(P.parts[i], tagOf(i))).join('');

  if(P.parts.every((p,i)=>S.partDone[i])){
    S.done=true; S.solved++; S.streak++;
    let html = multi
      ? '<p><b>All parts correct.</b> '+P.parts.map((p,i)=>'('+LET[i]+') '+p.show).join('; ')+'</p>'+sigNote
      : (sigs.length ? sigMsg(P.parts[0], '<b>Correct value.</b> ') : '<p><b>Correct.</b> '+P.parts[0].show+'</p>');
    if(S.streak>=2 && S.mode!=='solo'){
      html+='<p>That is '+S.streak+' in a row. Ready for less help?</p>'+
            '<button type="button" class="btn inline" data-act="levelup">Try one '+(S.mode==='guided'?'with hints only if you ask':'on your own')+'</button>';
    }
    setFb('ok', html); lock();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+P.solution+'</details>';
    drawActions(kind); drawTally(kind);
    const nx=$('#actions [data-act="next"]'); if(nx) nx.focus();
    return;
  }
  if(wrong.length){
    S.misses++; S.streak=0;
    let msg;
    if(!multi) msg='<p>'+(bl.msg || res[0].msg)+'</p>';
    else msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+wrong.map(i=>'<p>'+tagOf(i)+res[i].msg+'</p>').join('')+sigNote;
    if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
    const onlyClose = !bl.msg && wrong.every(i=>res[i].status==='close');
    setFb(onlyClose ? 'warn' : 'bad', msg);
  } else {
    const todo=P.parts.map((p,i)=>i).filter(i=>!S.partDone[i]);
    const rest='part'+(todo.length>1?'s ':' ')+todo.map(i=>'('+LET[i]+')').join(' and ');
    const msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+
      '<p>'+(newlyRight.length ? 'Right so far. ' : '')+'Now answer '+rest+'.</p>'+sigNote;
    setFb(bl.msg ? 'bad' : 'info', msg);
  }
  drawActions(kind); drawTally(kind);
}
function revealSolution(kind){
  const S=state[kind];
  S.done=true; S.streak=0; lock();
  $('#sol').innerHTML=S.P.solution;
  setFb('info','<p>Read through each step, then try a new problem with different numbers.</p>');
  drawActions(kind); drawTally(kind);
}

render();
}
</script>

</html>
