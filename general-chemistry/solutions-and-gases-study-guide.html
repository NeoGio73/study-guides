<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solutions and Gases Study Guide</title>
<style>
:root{
  --ink:#1b2430; --muted:#566070; --line:#d6dbe3; --soft:#f3f5f8;
  --a-bg:#fff1dc; --a-line:#dd962a; --a-ink:#7a4300;
  --b-bg:#ddf2ee; --b-line:#2c9383; --b-ink:#0a564c;
  --r-bg:#ebe7f8; --r-line:#7560c4; --r-ink:#3e2c85;
  --navy:#1f3a5f; --navy-d:#152b49;
  --ok:#17693f; --ok-bg:#e4f4ea;
  --bad:#a3241d; --bad-bg:#fcebe9;
  --warn:#6f4b00; --warn-bg:#fff5d9;
  --info:#274b7a; --info-bg:#e9f0fa;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.app{max-width:880px;margin:0 auto;padding:20px 16px 48px}
sub{font-size:.72em;line-height:0}
sup{font-size:.72em;line-height:0}
:focus-visible{outline:3px solid #4c7fd6;outline-offset:2px}

/* Header */
.top h1{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 .4rem}
.top p{margin:0;color:var(--muted);max-width:64ch}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;font:inherit;font-size:.92rem;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button:not([data-n]){padding-left:14px}
.tabs .tn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--soft);font-size:.82rem}
.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs button[aria-selected="true"] .tn{background:#fff;color:var(--navy)}
.tabs button:not([aria-selected="true"]):hover{border-color:var(--navy)}

/* Section heading */
h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0 0 .35rem}
.lede{margin:0 0 18px;max-width:66ch}
h3{font-size:1rem;margin:0 0 .4rem}

/* Substance colors: given (A) and wanted (B) */
.sa{color:var(--a-ink);font-weight:600}
.sb{color:var(--b-ink);font-weight:600}

/* Buttons */
.btn{appearance:none;font:inherit;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-d)}
.btn.inline{padding:4px 10px;font-size:.9rem;margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}

/* Help level */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.modebar-label{font-size:.9rem;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;font:inherit;font-size:.9rem;border:0;background:#fff;color:var(--ink);padding:7px 12px;cursor:pointer;border-left:1.5px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600}
.seg button:focus-visible{outline-offset:-3px}

/* Problem */
.problem{border:1.5px solid var(--line);border-radius:14px;padding:20px 20px 18px}
.ctx{margin:0 0 10px;color:var(--muted)}
.eqwrap{background:var(--soft);border-radius:10px;padding:14px 16px 10px;margin:0 0 12px}
.eq{font-family:var(--serif);font-size:1.4rem;line-height:1.35;display:flex;flex-wrap:wrap;align-items:baseline;gap:.15em .45em}
.eq .coef{margin-right:.2em}
.eq .plus,.eq .arrow{color:var(--muted)}
.eq .sp{font-weight:400;color:var(--ink);padding:0 .15em;border-radius:5px;white-space:nowrap}
.eq .sp.sa{background:var(--a-bg);color:var(--a-ink);box-shadow:0 2px 0 var(--a-line)}
.eq .sp.sb{background:var(--b-bg);color:var(--b-ink);box-shadow:0 2px 0 var(--b-line)}
.eq .st{font-size:.6em;font-family:var(--sans);margin-left:.1em;opacity:.8}
.keys{display:flex;gap:14px;margin-top:8px;font-size:.8rem}
.key{display:inline-flex;align-items:center;gap:6px}
.key::before{content:"";width:.9em;height:.9em;border-radius:3px;border:1.5px solid}
.key.a{color:var(--a-ink)} .key.a::before{background:var(--a-bg);border-color:var(--a-line)}
.key.b{color:var(--b-ink)} .key.b::before{background:var(--b-bg);border-color:var(--b-line)}
.am{margin:0 0 10px;font-size:.9rem;color:var(--muted)}
.q{font-size:1.1rem;margin:0 0 14px;max-width:62ch}

/* Route strip and per-reactant trails */
.helplab{font-size:.88rem;font-weight:600;margin:14px 0 6px}
.helptext{font-size:.95rem;margin:4px 0 6px;max-width:64ch}
.rn{border:1.5px solid;border-radius:8px;padding:3px 10px;font-weight:600;font-size:.95rem;white-space:nowrap}
.rn.a{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.rn.b{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.rn .sa,.rn .sb{color:inherit}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 4px;padding:0;list-style:none}
.route .rs{font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.route .rs::after{content:"\2192";font-size:1.1rem;color:var(--ink)}
.route .rs.ratio{color:var(--r-ink);font-weight:600}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.trail .arw{font-size:1.1rem;margin-right:2px}
.trail .tq{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}

/* Dimensional analysis chain */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:10px 10px;font-size:1.02rem;margin:4px 0 6px}
.chain .op{color:var(--muted);font-size:1.15rem}
.chain .qty{white-space:nowrap}
.chain .grp{display:inline-flex;align-items:center;gap:10px}
.chain.cells{gap:10px 22px}
.frac{display:inline-flex;flex-direction:column;text-align:center}
.frac>span{padding:3px 8px;white-space:nowrap}
.frac>.t{border-bottom:2px solid var(--ink)}
.cx{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--bad)}
.blank{font:inherit;width:2.8em;text-align:center;border:1.5px solid #8b95a3;border-radius:6px;padding:2px 4px;background:#fff;color:var(--ink)}
.blank.wide{width:5.2em}
.blank.ok,.pin.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.blank.no,.pin.no{border:2px dashed var(--bad);background:var(--bad-bg)}
.ph{display:inline-grid;place-items:center;min-width:2.2em;height:1.7em;border:1.5px dashed #8b95a3;border-radius:6px;color:var(--muted)}
.ans-final{font-weight:700}

/* Answers */
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.ansrow label{font-weight:600}
.pin{font:inherit;font-size:1.05rem;width:8.5em;padding:7px 10px;border:1.5px solid #8b95a3;border-radius:8px;color:var(--ink);background:#fff}
.pin:disabled,.blank:disabled{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.unit{font-size:1.05rem}
.parts{list-style:none;margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:14px}
.part{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.part .plab{font-weight:600;flex:1 1 15em}
.part .pctl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pmark{font-weight:700;min-width:1em}
.pmark.ok{color:var(--ok)} .pmark.no{color:var(--bad)}
.checkrow{margin-top:14px}
.choice{display:inline-flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.opt span{display:inline-block;border:1.5px solid #8b95a3;border-radius:8px;padding:6px 14px;font-size:1.05rem;background:#fff}
.opt input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.opt input:focus-visible+span{outline:3px solid #4c7fd6;outline-offset:2px}
.choice.ok .opt input:checked+span{background:var(--ok);border-color:var(--ok)}
.choice.no .opt input:checked+span{background:var(--bad-bg);color:var(--bad);border:2px dashed var(--bad)}

/* Feedback */
.fb{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;border-left:5px solid;gap:10px;align-items:flex-start}
.fb.show{display:flex}
.fb .ic{font-weight:700;font-size:1.05rem;line-height:1.5}
.fb p{margin:0}
.fb p+p{margin-top:6px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:#0f4a2c}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:#6f1712}
.fb.warn{background:var(--warn-bg);border-color:#c98f12;color:var(--warn)}
.fb.info{background:var(--info-bg);border-color:#5a86c4;color:var(--info)}
.fb .sa,.fb .sb{color:inherit}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally{font-size:.9rem;color:var(--muted);margin:12px 2px 0}

/* Worked solution */
.solution{margin-top:16px;padding:14px 16px 6px;border-radius:10px;background:var(--soft)}
.solution ol{margin:0;padding-left:1.3em}
.solution li{margin-bottom:10px}
.solution .note{font-size:.9rem;color:var(--muted);margin:0 0 10px}
details.soldet{margin-top:14px}
details.soldet summary{cursor:pointer;font-weight:600;color:var(--navy)}

/* Roadmap */
.paths{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}
.paths .lab{font-size:.9rem;font-weight:600;margin-right:2px}
.map{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px 6px;margin:14px 0 18px}
.rowlab{font-size:.9rem;font-weight:700}
.rowlab.a{grid-column:1/-1;color:var(--a-ink)}
.rowlab.b{grid-column:1/3;align-self:end;color:var(--b-ink)}
.map .fill{grid-column:4/6}
.node{border:2px solid;border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:68px;transition:opacity .15s}
.node b{font-size:.98rem;line-height:1.25}
.node small{font-size:.8rem}
.node.a{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.node.b{background:var(--b-bg);border-color:var(--b-line);color:var(--b-ink)}
.conn{appearance:none;font:inherit;font-size:.8rem;font-weight:600;line-height:1.2;color:var(--ink);background:#fff;border:1.5px solid #8b95a3;border-radius:10px;padding:6px 8px;cursor:pointer;align-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;transition:opacity .15s}
.conn .arr{font-size:1.15rem;line-height:1}
.conn:hover{border-color:var(--navy)}
.conn.ratio{grid-column:3;justify-self:center;flex-direction:row;gap:8px;padding:8px 14px;background:var(--r-bg);border-color:var(--r-line);color:var(--r-ink)}
.conn.vert{justify-self:center;flex-direction:row;gap:8px;padding:8px 10px;white-space:nowrap}
.conn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.map .dim{opacity:.28}
.detail{border-left:5px solid var(--navy);background:var(--soft);border-radius:10px;padding:14px 16px;min-height:120px}
.detail p{margin:0 0 8px}
.detail ul{margin:0 0 8px;padding-left:1.2em}
.detail .ex{font-family:var(--serif);font-size:1.08rem;margin-bottom:0}
.builds{margin-top:22px}
.builds ul{margin:0;padding-left:1.2em;max-width:66ch}
.builds li{margin-bottom:6px}

@media (max-width:560px){
  .top h1{font-size:1.6rem}
  .problem{padding:16px 14px}
  .eq{font-size:1.15rem}
  .node b{font-size:.82rem} .node small{font-size:.7rem}
  .conn{font-size:.7rem;padding:5px 4px}
  .map{gap:8px 3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Solutions and Gases Study Guide</h1>
    <p>Molarity, dilution, reactions in solution, the ideal gas law, and reactions that involve gases. Start with the roadmap, then work through the sections in order. The numbers change every time, so practice as much as you like. Nothing here is graded.</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="view" role="tabpanel"></main>
  <noscript><p>This study guide needs JavaScript turned on.</p></noscript>
</div>

<script>
'use strict';
/* ============================================================
   Chemistry data and problem logic (no page elements used here)
   ============================================================ */

// Atomic masses, kept as text so they display exactly as written.
const AM = {H:'1.008', He:'4.003', C:'12.011', N:'14.007', O:'15.999', Ne:'20.180', Na:'22.990', Mg:'24.305', Al:'26.982',
            P:'30.974', S:'32.06', Cl:'35.45', Ar:'39.948', K:'39.098', Ca:'40.078', Cr:'51.996', Fe:'55.845',
            Cu:'63.546', Zn:'65.38', Br:'79.904', Ag:'107.87', I:'126.90', Ba:'137.33', Hg:'200.59', Pb:'207.2'};

// Solutes for the molarity section.
const SOLUTES = {NaCl:'sodium chloride', KCl:'potassium chloride', NaOH:'sodium hydroxide', KNO3:'potassium nitrate',
                 CaCl2:'calcium chloride', Na2SO4:'sodium sulfate', C6H12O6:'glucose', AgNO3:'silver nitrate',
                 KBr:'potassium bromide', MgCl2:'magnesium chloride', NaHCO3:'sodium bicarbonate', CuSO4:'copper(II) sulfate',
                 KOH:'potassium hydroxide', NH4Cl:'ammonium chloride', Na2CO3:'sodium carbonate', KI:'potassium iodide'};
// Solutes for the dilution section.
const DILUTES = ['HCl','HNO3','H2SO4','NaOH','NH3','NaCl','CuSO4','KCl','KNO3'];
const FLASKS = ['100.0','250.0','500.0'];

// Reaction banks. r = reactants, p = products, each as [coefficient, formula, state].
const SRX = [
  {ctx:'Mixing lead(II) nitrate and potassium iodide solutions gives a bright yellow precipitate of lead(II) iodide.',
   r:[[1,'Pb(NO3)2','aq'],[2,'KI','aq']], p:[[1,'PbI2','s'],[2,'KNO3','aq']]},
  {ctx:'Silver nitrate and sodium chloride solutions react to form a white precipitate of silver chloride.',
   r:[[1,'AgNO3','aq'],[1,'NaCl','aq']], p:[[1,'AgCl','s'],[1,'NaNO3','aq']]},
  {ctx:'Silver nitrate and calcium chloride solutions react to form a white precipitate of silver chloride.',
   r:[[2,'AgNO3','aq'],[1,'CaCl2','aq']], p:[[2,'AgCl','s'],[1,'Ca(NO3)2','aq']]},
  {ctx:'Barium chloride and sodium sulfate solutions react to form a white precipitate of barium sulfate.',
   r:[[1,'BaCl2','aq'],[1,'Na2SO4','aq']], p:[[1,'BaSO4','s'],[2,'NaCl','aq']]},
  {ctx:'Calcium chloride and sodium phosphate solutions react to form a white precipitate of calcium phosphate.',
   r:[[3,'CaCl2','aq'],[2,'Na3PO4','aq']], p:[[1,'Ca3(PO4)2','s'],[6,'NaCl','aq']]},
  {ctx:'Silver nitrate and potassium chromate solutions react to form a red precipitate of silver chromate.',
   r:[[2,'AgNO3','aq'],[1,'K2CrO4','aq']], p:[[1,'Ag2CrO4','s'],[2,'KNO3','aq']]},
  {ctx:'Sodium carbonate and calcium chloride solutions react to form a white precipitate of calcium carbonate.',
   r:[[1,'Na2CO3','aq'],[1,'CaCl2','aq']], p:[[1,'CaCO3','s'],[2,'NaCl','aq']]},
  {ctx:'Iron(III) chloride and sodium hydroxide solutions react to form a rust-colored precipitate of iron(III) hydroxide.',
   r:[[1,'FeCl3','aq'],[3,'NaOH','aq']], p:[[1,'Fe(OH)3','s'],[3,'NaCl','aq']]},
  {ctx:'Copper(II) sulfate and sodium hydroxide solutions react to form a blue precipitate of copper(II) hydroxide.',
   r:[[1,'CuSO4','aq'],[2,'NaOH','aq']], p:[[1,'Cu(OH)2','s'],[1,'Na2SO4','aq']]},
  {ctx:'Lead(II) nitrate and sodium sulfate solutions react to form a white precipitate of lead(II) sulfate.',
   r:[[1,'Pb(NO3)2','aq'],[1,'Na2SO4','aq']], p:[[1,'PbSO4','s'],[2,'NaNO3','aq']]},
  {ctx:'Zinc metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[1,'Zn','s'],[2,'HCl','aq']], p:[[1,'ZnCl2','aq'],[1,'H2','g']]},
  {ctx:'Magnesium metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[1,'Mg','s'],[2,'HCl','aq']], p:[[1,'MgCl2','aq'],[1,'H2','g']]},
  {ctx:'Calcium carbonate (limestone) reacts with hydrochloric acid, releasing carbon dioxide gas.',
   r:[[1,'CaCO3','s'],[2,'HCl','aq']], p:[[1,'CaCl2','aq'],[1,'H2O','l'],[1,'CO2','g']]},
  {ctx:'Aluminum metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[2,'Al','s'],[6,'HCl','aq']], p:[[2,'AlCl3','aq'],[3,'H2','g']]},
  {ctx:'Magnesium hydroxide, the active ingredient in milk of magnesia, neutralizes hydrochloric acid (stomach acid).',
   r:[[1,'Mg(OH)2','s'],[2,'HCl','aq']], p:[[1,'MgCl2','aq'],[2,'H2O','l']]},
  {ctx:'Baking soda (sodium bicarbonate) reacts with hydrochloric acid, releasing carbon dioxide gas.',
   r:[[1,'NaHCO3','s'],[1,'HCl','aq']], p:[[1,'NaCl','aq'],[1,'H2O','l'],[1,'CO2','g']]}
];
// Precipitation reactions: two dissolved reactants and a solid product.
const PRX = SRX.filter(x => x.r.every(e=>e[2]==='aq') && x.p.some(e=>e[2]==='s'));
// Reactions that make or use up a gas, with no solutions involved.
const GRX = [
  {ctx:'Heating potassium chlorate decomposes it into potassium chloride and oxygen gas.',
   r:[[2,'KClO3','s']], p:[[2,'KCl','s'],[3,'O2','g']]},
  {ctx:'In a car airbag, sodium azide decomposes rapidly to produce nitrogen gas.',
   r:[[2,'NaN3','s']], p:[[2,'Na','s'],[3,'N2','g']]},
  {ctx:'Ammonia is made industrially from nitrogen and hydrogen gases (the Haber process).',
   r:[[1,'N2','g'],[3,'H2','g']], p:[[2,'NH3','g']]},
  {ctx:'Hydrogen burns in oxygen to form water.',
   r:[[2,'H2','g'],[1,'O2','g']], p:[[2,'H2O','l']]},
  {ctx:'Propane, the fuel in gas grills, burns in oxygen.',
   r:[[1,'C3H8','g'],[5,'O2','g']], p:[[3,'CO2','g'],[4,'H2O','l']]},
  {ctx:'Methane, the main component of natural gas, burns in oxygen.',
   r:[[1,'CH4','g'],[2,'O2','g']], p:[[1,'CO2','g'],[2,'H2O','l']]},
  {ctx:'Iron reacts with oxygen to form iron(III) oxide, the main component of rust.',
   r:[[4,'Fe','s'],[3,'O2','g']], p:[[2,'Fe2O3','s']]},
  {ctx:'Magnesium metal burns in oxygen with a bright white flame.',
   r:[[2,'Mg','s'],[1,'O2','g']], p:[[2,'MgO','s']]},
  {ctx:'Heating baking soda (sodium bicarbonate) releases carbon dioxide gas.',
   r:[[2,'NaHCO3','s']], p:[[1,'Na2CO3','s'],[1,'H2O','l'],[1,'CO2','g']]},
  {ctx:'Aluminum metal reacts with chlorine gas to form aluminum chloride.',
   r:[[2,'Al','s'],[3,'Cl2','g']], p:[[2,'AlCl3','s']]},
  {ctx:'Sulfur dioxide reacts with oxygen to form sulfur trioxide, a step in making sulfuric acid.',
   r:[[2,'SO2','g'],[1,'O2','g']], p:[[2,'SO3','g']]},
  {ctx:'Heating mercury(II) oxide decomposes it into liquid mercury and oxygen gas.',
   r:[[2,'HgO','s']], p:[[2,'Hg','l'],[1,'O2','g']]},
  {ctx:'Sodium metal reacts with chlorine gas to form sodium chloride.',
   r:[[2,'Na','s'],[1,'Cl2','g']], p:[[2,'NaCl','s']]}
];
// Reactions that connect a solution (molarity) with a gas (PV = nRT).
const QRX = [
  {ctx:'Zinc metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[1,'Zn','s'],[2,'HCl','aq']], p:[[1,'ZnCl2','aq'],[1,'H2','g']]},
  {ctx:'Magnesium metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[1,'Mg','s'],[2,'HCl','aq']], p:[[1,'MgCl2','aq'],[1,'H2','g']]},
  {ctx:'Aluminum metal dissolves in hydrochloric acid, releasing hydrogen gas.',
   r:[[2,'Al','s'],[6,'HCl','aq']], p:[[2,'AlCl3','aq'],[3,'H2','g']]},
  {ctx:'Calcium carbonate (limestone) reacts with hydrochloric acid, releasing carbon dioxide gas.',
   r:[[1,'CaCO3','s'],[2,'HCl','aq']], p:[[1,'CaCl2','aq'],[1,'H2O','l'],[1,'CO2','g']]},
  {ctx:'Baking soda (sodium bicarbonate) reacts with hydrochloric acid, releasing carbon dioxide gas.',
   r:[[1,'NaHCO3','s'],[1,'HCl','aq']], p:[[1,'NaCl','aq'],[1,'H2O','l'],[1,'CO2','g']]},
  {ctx:'Sodium carbonate solution reacts with hydrochloric acid, releasing carbon dioxide gas.',
   r:[[1,'Na2CO3','aq'],[2,'HCl','aq']], p:[[2,'NaCl','aq'],[1,'H2O','l'],[1,'CO2','g']]},
  {ctx:'Magnesium metal dissolves in sulfuric acid, releasing hydrogen gas.',

  {ctx:'Warming ammonium chloride solution with sodium hydroxide releases ammonia gas.',
   r:[[1,'NH4Cl','aq'],[1,'NaOH','aq']], p:[[1,'NaCl','aq'],[1,'H2O','l'],[1,'NH3','g']]},
