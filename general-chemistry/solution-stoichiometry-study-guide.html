}
function drawProblem(kind, focus){
  const S=state[kind], P=S.P, multi=P.parts.length>1;
  $('#problem').innerHTML=
    '<p class="ctx">'+P.ctx+'</p>'+
    (P.rxn ? eqBlock(P.rxn, P.hl) : '')+
    (P.am ? '<p class="am">Atomic masses (g/mol): '+amLine(P.am)+'</p>' : '')+
    '<p class="q">'+P.question+'</p>'+
    '<form id="ans" novalidate autocomplete="off">'+
      '<div id="help"></div>'+
      (multi ? '<ol class="parts">'+P.parts.map((p,i)=>partHTML(p,i,true)).join('')+'</ol>'+
               '<div class="checkrow"><button class="btn primary" type="submit">Check answers</button></div>'
             : partHTML(P.parts[0],0,false))+
    '</form>'+
    '<div id="fb" class="fb" role="status" aria-live="polite"></div>'+
    '<div id="sol"></div>'+
    '<div class="actions" id="actions"></div>';
  $('#ans').addEventListener('submit',e=>{ e.preventDefault(); check(kind); });
  drawHelp(kind); drawActions(kind); drawTally(kind);
  if(focus){ const f=$('#help input')||$('#problem .pin')||$('#problem .opt input'); if(f) f.focus(); }
}
function drawHelp(kind){
  const S=state[kind], P=S.P; let out='';
  if(S.mode==='guided') out=P.guided;
  else if(S.mode==='hint') out=P.hints.slice(0,S.hint).join('');
  $('#help').innerHTML=out;
}
function drawActions(kind){
  const S=state[kind]; let out='';
  if(S.mode==='hint' && !S.done && S.hint<2)
    out+='<button type="button" class="btn" data-act="hint">'+(S.hint===0?'Show a hint':'Show another hint')+'</button>';
  if(!S.done && S.misses>=2)
    out+='<button type="button" class="btn" data-act="solution">Show worked solution</button>';
  out+='<button type="button" class="btn'+(S.done?' primary':'')+'" data-act="next">'+(S.done?'Next problem':'Skip to a new problem')+'</button>';
  $('#actions').innerHTML=out;
}
function drawTally(kind){
  const S=state[kind];
  $('#tally').textContent = S.solved===0 ? 'No problems solved yet this session.'
    : 'Solved this session: '+S.solved+(S.streak>1 ? ' ('+S.streak+' in a row)' : '');
}
// Marks each filled blank right or wrong and returns the most useful message.
function checkBlanks(P){
  const res={any:false, allOK:true, msg:''}, got={};
  Object.keys(P.blanks).forEach(k=>{
    const i=$('#help input[data-k="'+k+'"]'); if(!i) return;
    const raw=i.value.trim(), inp=parseInput(raw), v=inp ? inp.value : NaN;
    i.classList.remove('ok','no'); i.removeAttribute('aria-invalid');
    if(!raw){ res.allOK=false; got[k]={empty:true}; return; }
    res.any=true;
    const want=P.blanks[k].want;
    const good=isFinite(v) && Math.abs(v-want)<=P.blanks[k].tol*Math.abs(want)+1e-12;
    i.classList.add(good?'ok':'no'); if(!good){ i.setAttribute('aria-invalid','true'); res.allOK=false; }
    got[k]={v, good};
  });
  res.msg=P.blankMsg(got)||'';
  return res;
}
function check(kind){
  const S=state[kind], P=S.P; if(S.done) return;
  const multi=P.parts.length>1, tagOf=i=> multi ? '<b>('+LET[i]+')</b> ' : '';
  const bl = S.mode==='guided' ? checkBlanks(P) : {any:false, allOK:true, msg:''};
  const res=P.parts.map((part,i)=> S.partDone[i] ? {status:'done'} : gradePart(part, readPart(P.parts,i)));
  const open=res.filter(r=>r.status!=='done');

  if(open.every(r=>r.status==='empty')){
    if(bl.any && bl.msg) setFb('bad','<p>'+bl.msg+'</p>');
    else if(bl.any && bl.allOK) setFb('info','<p>The setup is right. Now run the numbers and enter your answer'+(multi?'s':'')+'.</p>');
    else if(bl.any) setFb('info','<p>Good so far. Fill in the remaining blanks, then calculate.</p>');
    else setFb('info','<p>Enter your answer'+(multi?'s':'')+', then select Check answer'+(multi?'s':'')+'.</p>');
    return;
  }
  const inv=res.findIndex(r=>r.status==='invalid');
  if(inv>=0){ setFb('info','<p>'+tagOf(inv)+res[inv].msg+'</p>'); return; }

  const wrong=[], sigs=[], newlyRight=[];
  res.forEach((r,i)=>{
    if(r.status==='correct' || r.status==='sig'){ S.partDone[i]=true; markPart(P.parts,i,true); newlyRight.push(i); if(r.status==='sig') sigs.push(i); }
    else if(r.status==='wrong' || r.status==='close'){ markPart(P.parts,i,false); wrong.push(i); }
  });
  const sigNote=sigs.map(i=>sigMsg(P.parts[i], tagOf(i))).join('');

  if(P.parts.every((p,i)=>S.partDone[i])){
    S.done=true; S.solved++; S.streak++;
    let html = multi
      ? '<p><b>All parts correct.</b> '+P.parts.map((p,i)=>'('+LET[i]+') '+p.show).join('; ')+'</p>'+sigNote
      : (sigs.length ? sigMsg(P.parts[0], '<b>Correct value.</b> ') : '<p><b>Correct.</b> '+P.parts[0].show+'</p>');
    if(S.streak>=2 && S.mode!=='solo'){
      html+='<p>That is '+S.streak+' in a row. Ready for less help?</p>'+
            '<button type="button" class="btn inline" data-act="levelup">Try one '+(S.mode==='guided'?'with hints only if you ask':'on your own')+'</button>';
    }
    setFb('ok', html); lock();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+P.solution+'</details>';
    drawActions(kind); drawTally(kind);
    const nx=$('#actions [data-act="next"]'); if(nx) nx.focus();
    return;
  }
  if(wrong.length){
    S.misses++; S.streak=0;
    let msg;
    if(!multi) msg='<p>'+(bl.msg || res[0].msg)+'</p>';
    else msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+wrong.map(i=>'<p>'+tagOf(i)+res[i].msg+'</p>').join('')+sigNote;
    if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
    const onlyClose = !bl.msg && wrong.every(i=>res[i].status==='close');
    setFb(onlyClose ? 'warn' : 'bad', msg);
  } else {
    const todo=P.parts.map((p,i)=>i).filter(i=>!S.partDone[i]);
    const rest='part'+(todo.length>1?'s ':' ')+todo.map(i=>'('+LET[i]+')').join(' and ');
    const msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+
      '<p>'+(newlyRight.length ? 'Right so far. ' : '')+'Now answer '+rest+'.</p>'+sigNote;
    setFb(bl.msg ? 'bad' : 'info', msg);
  }
  drawActions(kind); drawTally(kind);
}
function revealSolution(kind){
  const S=state[kind];
  S.done=true; S.streak=0; lock();
  $('#sol').innerHTML=S.P.solution;
  setFb('info','<p>Read through each step, then try a new problem with different numbers.</p>');
  drawActions(kind); drawTally(kind);
}

/* ---------- 6. Virtual titration ---------- */
const ADDS=[[500,'5 mL'],[100,'1 mL'],[10,'0.1 mL'],[5,'1 drop']];
function newLab(){
  const S=state.lab;
  S.L=makeLab(S.L); S.d=0; S.misses=0; S.done=false; S.partDone=[];
}
function labSVG(L, d){
  const reading=(L.init+d)/100, look=labLook(L,d);
  const y=v=>24+v*4.6, lvl=y(Math.min(reading,50));
  let ticks='';
  for(let v=0;v<=50;v+=5){
    const major=v%10===0;
    ticks+='<line x1="'+(major?98:102)+'" y1="'+y(v)+'" x2="108" y2="'+y(v)+'" stroke="#566070" stroke-width="1"/>';
    if(major) ticks+='<text x="94" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#566070">'+v+'</text>';
  }
  return '<svg viewBox="0 0 240 400" role="img" aria-label="Buret reading '+reading.toFixed(2)+' milliliters. '+look.text+'">'+
    '<rect x="108" y="'+lvl+'" width="18" height="'+(262-lvl)+'" fill="#bcd6ee"/>'+
    '<rect x="108" y="12" width="18" height="250" fill="none" stroke="#1b2430" stroke-width="1.5"/>'+
    ticks+
    '<line x1="126" y1="'+lvl+'" x2="140" y2="'+lvl+'" stroke="#1f3a5f" stroke-width="1.5"/>'+
    '<text x="144" y="'+(lvl+4)+'" font-size="12" font-weight="700" fill="#1f3a5f">'+reading.toFixed(2)+'</text>'+
    '<text x="60" y="16" font-size="11" fill="#566070">mL</text>'+
    '<rect x="103" y="262" width="28" height="9" rx="2" fill="#1f3a5f"/>'+
    '<rect x="131" y="264" width="16" height="5" rx="2" fill="#1f3a5f"/>'+
    '<path d="M113 271 L121 271 L119 294 L115 294 Z" fill="#bcd6ee" stroke="#1b2430" stroke-width="1.2"/>'+
    '<path d="M82 350 L152 350 L184 380 Q187 387 180 387 L60 387 Q53 387 56 380 Z" fill="'+look.color+'"/>'+
    '<path d="M104 302 L104 324 L54 379 Q50 389 60 389 L180 389 Q190 389 186 379 L130 324 L130 302" fill="none" stroke="#1b2430" stroke-width="1.8" stroke-linejoin="round"/>'+
    '<line x1="100" y1="302" x2="134" y2="302" stroke="#1b2430" stroke-width="1.8"/>'+
    '</svg>';
}
function renderLab(){
  const S=state.lab, m=META.lab;
  if(!S.L) newLab();
  const L=S.L, fa=tag(L.acid.f,'sb'), fb=tag('NaOH','sa');
  const hl={}; hl[L.acid.f]='sb'; hl['NaOH']='sa';
  view.onclick=null;
  view.innerHTML=
    '<section>'+
    '<h2>6. '+m.title+'</h2>'+
    '<p class="lede">'+m.lede+'</p>'+
    '<article class="problem" id="problem">'+
      '<p class="ctx">'+L.rxn.ctx+'</p>'+eqBlock(L.rxn, hl)+
      '<p class="q">The flask holds '+L.Va+' mL of '+fa+' solution of unknown concentration, plus a few drops of phenolphthalein indicator. The buret holds '+L.Mt+' M '+fb+'. Phenolphthalein is colorless in acid and turns pink once all of the acid has reacted.</p>'+
      '<div class="bench"><div id="labsvg"></div>'+
        '<div class="panel">'+
          '<div class="readouts"><div><span>Initial buret reading</span><b>'+(L.init/100).toFixed(2)+' mL</b></div>'+
            '<div><span>Current buret reading</span><b id="rd"></b></div></div>'+
          '<p class="labstatus" id="labstatus" role="status" aria-live="polite"></p>'+
          '<div class="addbtns"><span class="lab">Add NaOH from the buret</span>'+
            ADDS.map(a=>'<button type="button" class="btn" data-add="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>'+
          '<button type="button" class="btn inline" data-act="restart" style="margin-top:0">Start over with a fresh sample</button>'+
        '</div></div>'+
      '<form id="ans" novalidate autocomplete="off">'+
        '<ol class="parts">'+labParts(L,0).map((p,i)=>partHTML(p,i,true)).join('')+'</ol>'+
        '<div class="checkrow"><button class="btn primary" type="submit">Check answers</button></div>'+
      '</form>'+
      '<details class="how"><summary>How to calculate the molarity</summary><ol>'+
        '<li>Volume of NaOH delivered = final buret reading − initial buret reading. Convert it to liters.</li>'+
        '<li>Moles of NaOH = liters delivered × molarity of NaOH.</li>'+
        '<li>Use the mole ratio from the balanced equation to get moles of acid.</li>'+
        '<li>Molarity of the acid = moles of acid ÷ liters of the acid sample.</li></ol></details>'+
      '<div id="fb" class="fb" role="status" aria-live="polite"></div>'+
      '<div id="sol"></div>'+
      '<div class="actions" id="actions"></div>'+
    '</article>'+
    '<p class="tally" id="tally"></p>'+
    '</section>';
  $('#problem').addEventListener('click',e=>{
    const a=e.target.closest('button[data-add]');
    if(a){ addTitrant(Number(a.dataset.add)); return; }
    const b=e.target.closest('button[data-act]'); if(!b) return;
    if(b.dataset.act==='restart'){ S.d=0; S.done=false; S.partDone=[]; renderLab(); }
    else if(b.dataset.act==='next'){ newLab(); renderLab(); }
    else if(b.dataset.act==='solution'){
      S.done=true; lock(); paintLab();
      $('#sol').innerHTML=labSolution(L,S.d);
      setFb('info','<p>These steps use the volume you delivered. Read through them, then try a new titration.</p>');
      labActions();
    }
  });
  $('#ans').addEventListener('submit',e=>{ e.preventDefault(); checkLab(); });
  paintLab(); labActions();
  $('#tally').textContent = S.solved===0 ? 'No titrations completed yet this session.' : 'Titrations completed this session: '+S.solved;
}
function paintLab(){
  const S=state.lab, L=S.L, look=labLook(L,S.d), reading=L.init+S.d;
  $('#labsvg').innerHTML=labSVG(L,S.d);
  $('#rd').textContent=(reading/100).toFixed(2)+' mL';
  $('#labstatus').textContent=look.text;
  view.querySelectorAll('button[data-add]').forEach(b=>{ b.disabled = S.done || reading+Number(b.dataset.add)>5000; });
}
function labActions(){
  const S=state.lab; let out='';
  if(!S.done && S.misses>=2) out+='<button type="button" class="btn" data-act="solution">Show worked solution</button>';
  out+='<button type="button" class="btn'+(S.done?' primary':'')+'" data-act="next">New titration</button>';
  $('#actions').innerHTML=out;
}
function addTitrant(h){
  const S=state.lab; if(S.done) return;
  S.d+=h;
  // The volume changed, so earlier answers are no longer locked in.
  S.partDone=[];
  view.querySelectorAll('#ans .pin').forEach(i=>{ i.disabled=false; i.classList.remove('ok','no'); });
  view.querySelectorAll('#ans .pmark').forEach(p=>{ p.textContent=''; p.className='pmark'; });
  $('#fb').className='fb';
  paintLab();
}
function checkLab(){
  const S=state.lab, L=S.L; if(S.done) return;
  if(S.d/100<L.Veq){
    setFb('info','<p>The solution in the flask is still colorless, so not all of the acid has reacted yet. Keep adding NaOH until a faint pink color stays.</p>');
    return;
  }
  const parts=labParts(L,S.d), tagOf=i=>'<b>('+LET[i]+')</b> ';
  const res=parts.map((part,i)=> S.partDone[i] ? {status:'done'} : gradePart(part, readPart(parts,i)));
  if(res.filter(r=>r.status!=='done').every(r=>r.status==='empty')){
    setFb('info','<p>Read the buret, then enter the volume delivered and the molarity you calculate.</p>'); return;
  }
  const inv=res.findIndex(r=>r.status==='invalid');
  if(inv>=0){ setFb('info','<p>'+tagOf(inv)+res[inv].msg+'</p>'); return; }
  const wrong=[], sigs=[];
  res.forEach((r,i)=>{
    if(r.status==='correct' || r.status==='sig'){ S.partDone[i]=true; markPart(parts,i,true); if(r.status==='sig') sigs.push(i); }
    else if(r.status==='wrong' || r.status==='close'){ markPart(parts,i,false); wrong.push(i); }
  });
  const sigNote=sigs.map(i=>sigMsg(parts[i], tagOf(i))).join('');
  if(parts.every((p,i)=>S.partDone[i])){
    S.done=true; S.solved++;
    const over=S.d/100-L.Veq, mine=parts[1].answer, pct=Math.abs(mine-L.Mtrue)/L.Mtrue*100;
    let verdict;
    if(over<0.10) verdict='You stopped right at the endpoint, within one drop. That is an excellent titration.';
    else if(over<0.50) verdict='You went about '+over.toFixed(2)+' mL past the endpoint, so your result is '+pct.toFixed(1)+'% high. Adding single drops near the end gets closer.';
    else verdict='You overshot the endpoint by about '+over.toFixed(1)+' mL, so your result is '+pct.toFixed(1)+'% high. Next time, switch to single drops as soon as the pink flashes start to linger.';
    setFb('ok','<p><b>Your calculation is correct.</b> (a) '+parts[0].show+'; (b) '+parts[1].show+'</p>'+sigNote+
      '<p>The acid in the flask was actually '+sig(L.Mtrue,4)+' M. '+verdict+'</p>');
    lock(); paintLab();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+labSolution(L,S.d)+'</details>';
    labActions();
    $('#tally').textContent='Titrations completed this session: '+S.solved;
    const nx=$('#actions [data-act="next"]'); if(nx) nx.focus();
    return;
  }
  if(wrong.length){
    S.misses++;
    let msg=wrong.map(i=>'<p>'+tagOf(i)+res[i].msg+'</p>').join('')+sigNote;
    if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
    setFb(wrong.every(i=>res[i].status==='close') ? 'warn' : 'bad', msg);
  } else {
    const todo=parts.map((p,i)=>i).filter(i=>!S.partDone[i]);
    setFb('info','<p>Right so far. Now answer part '+todo.map(i=>'('+LET[i]+')').join(' and ')+'.</p>'+sigNote);
  }
  labActions();
}

render();
}
</script>
