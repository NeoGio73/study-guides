function labSolution(L, d){
  const Ti=Number(d.Ti), Tf=Number(d.Tf), dT=Number((Tf-Ti).toFixed(2)), sf=Math.min(3,sfOfDelta(dT));
  if(L.exp==='metal'){
    const mw=Number(d.mw), mm=Number(L.mMetal), qw=mw*CW*dT, dTm=Number((Tf-Number(L.Tbath)).toFixed(2)), c=qw/(mm*-dTm);
    return solWrap([
      '<b>Water: temperature change.</b> '+DT+' = '+d.Tf+' °C − '+d.Ti+' °C = '+fx(dT,2)+' °C',
      '<b>Water: heat gained.</b> q = '+d.mw+' g × 4.184 '+CU+' × '+fx(dT,2)+' °C = <b>'+sig(qw,sf)+' J</b>',
      '<b>Metal: heat lost.</b> q(metal) = −q(water) = '+sig(-qw,sf+1)+' J',
      '<b>Metal: temperature change.</b> '+DT+' = '+d.Tf+' °C − '+L.Tbath+' °C = '+fx(dTm,2)+' °C',
      '<b>Specific heat.</b> c = '+sig(-qw,sf+1)+' J ÷ ('+L.mMetal+' g × '+fx(dTm,2)+' °C) = <b>'+sig(c,sf)+' '+CU+'</b>'
    ], roundNote(sf));
  }
  const neut=L.exp==='neut', mass = neut ? Number(d.Va)+Number(d.Vb) : Number(d.mw)+Number(d.ms);
  const qs=mass*CW*dT, n = neut ? Math.min(Number(d.Va),Number(d.Vb))/1000*Number(L.M) : Number(d.ms)/L.MM, dH=-qs/n/1000;
  return solWrap([
    '<b>Mass of solution.</b> '+(neut ? d.Va+' mL + '+d.Vb+' mL = '+fx(mass,1)+' mL, which is '+fx(mass,1)+' g at 1.00 g/mL' : d.mw+' g + '+d.ms+' g = '+fx(mass,2)+' g'),
    '<b>Temperature change.</b> '+DT+' = '+d.Tf+' °C − '+d.Ti+' °C = '+fx(dT,2)+' °C',
    '<b>q for the solution.</b> '+fx(mass,neut?1:2)+' g × 4.184 '+CU+' × ('+fx(dT,2)+' °C) = <b>'+sig(qs,sf)+' J</b>',
    '<b>Moles.</b> '+(neut ? toL(fx(Math.min(Number(d.Va),Number(d.Vb)),1))+' L × '+L.M+' mol/L' : d.ms+' g ÷ '+L.MM.toFixed(2)+' g/mol')+' = <b>'+sig(n,3)+' mol</b>',
    '<b>q for the '+(neut?'reaction':'dissolving')+'.</b> −q(solution) = '+sig(-qs,sf+1)+' J = '+sig(-qs/1000,sf+1)+' kJ',
    '<b>Per mole.</b> '+DH+' = '+sig(-qs/1000,sf+1)+' kJ ÷ '+sig(n,4)+' mol = <b>'+plus(sig(dH,sf))+' kJ/mol</b>'
  ], roundNote(sf));
}

/* ---------- Reading and grading answers ---------- */
// Reads what a student typed: 2.50, -25.7, +14.8, .25, 1.2e3, 1.2 x 10^3, with or without units after it.
function parseInput(raw){
  const s=String(raw).trim().replace(/,/g,'').replace(/[−–]/g,'-');
  const m=s.match(/^([+-]?\s*(?:\d+\.?\d*|\.\d+))(?:\s*(?:[eE]|[x×*]\s*10\s*\^?\s*)([+-]?\d+))?/);
  if(!m) return null;
  const mant=m[1].replace(/\s+/g,'');
  const value=Number(mant)*Math.pow(10, m[2] ? Number(m[2]) : 0);
  if(!isFinite(value)) return null;
  let d=mant.replace(/^[+-]/,''), sfMin, sfMax;
  if(d.indexOf('.')>=0){
    d=d.replace('.','').replace(/^0+/,'');
    sfMin=sfMax=Math.max(d.length,1);
  } else {
    d=d.replace(/^0+/,'');
    sfMax=Math.max(d.length,1);
    sfMin=Math.max(d.replace(/0+$/,'').length,1);   // trailing zeros without a decimal point are ambiguous
  }
  return {value, sfMin, sfMax};
}

// status: 'empty', 'invalid', 'correct', 'sig' (right value, wrong sig figs), 'close' or 'wrong'.
function gradePart(part, raw){
  if(part.type==='choice'){
    if(raw==null || raw==='') return {status:'empty'};
    return raw===part.answer ? {status:'correct'} : {status:'wrong', msg:part.wrongMsg(raw)};
  }
  if(String(raw).trim()==='') return {status:'empty'};
  const inp=parseInput(raw);
  if(!inp) return {status:'invalid', msg:'Enter your answer as a number, such as 2.50 or −25.7.'};
  const v=inp.value, ans=part.answer, diff=Math.abs(v-ans);
  let tol=Math.max((part.tolRel===undefined ? 0.01 : part.tolRel)*Math.abs(ans), part.tolAbs||0);
  // An answer correctly rounded to the required significant figures always counts.
  if(part.sf) tol=Math.max(tol, 0.5001*Math.pow(10, Math.floor(Math.log10(Math.abs(ans)))-part.sf+1));
  if(diff<=tol){
    if(!part.sf) return {status:'correct'};
    return {status: (inp.sfMin<=part.sf && part.sf<=inp.sfMax) ? 'correct' : 'sig'};
  }
  for(const e of part.errors){
    if(Math.abs(v-e.value)<=Math.max(0.01*Math.abs(e.value), part.errAbs||0)) return {status:'wrong', msg:e.msg};
  }
  if(diff<=3*tol){
    return {status:'close', msg:'Close. This is usually a rounding issue: keep extra digits through the middle steps and round only at the end.'};
  }
  if(v*ans>0){
    const lg=Math.log10(v/ans);
    if(Math.round(lg)!==0 && Math.abs(lg-Math.round(lg))<0.005){
      return {status:'wrong', msg:'The digits are right but the decimal point is in the wrong place. Check the joule and kilojoule conversions.'};
    }
  }
  return {status:'wrong', msg:part.generic};
}

// Marks each filled blank right or wrong and returns the most useful message.
function checkBlanks(P){
  const res={any:false, allOK:true, msg:''}, got={};
  Object.keys(P.blanks).forEach(k=>{
    const i=$('#help input[data-k="'+k+'"]'); if(!i) return;
    const raw=i.value.trim(), inp=parseInput(raw), v=inp ? inp.value : NaN;
    i.classList.remove('ok','no'); i.removeAttribute('aria-invalid');
    if(!raw){ res.allOK=false; got[k]={empty:true}; return; }
    res.any=true;
    const want=P.blanks[k].want;
    const good=isFinite(v) && Math.abs(v-want)<=P.blanks[k].tol*Math.abs(want)+1e-12;
    i.classList.add(good?'ok':'no'); if(!good){ i.setAttribute('aria-invalid','true'); res.allOK=false; }
    got[k]={v, good};
  });
  res.msg=P.blankMsg(got)||'';
  return res;
}
function check(kind){
  const S=state[kind], P=S.P; if(S.done) return;
  const multi=P.parts.length>1, tagOf=i=> multi ? '<b>('+LET[i]+')</b> ' : '';
  const bl = S.mode==='guided' ? checkBlanks(P) : {any:false, allOK:true, msg:''};
  const res=P.parts.map((part,i)=> S.partDone[i] ? {status:'done'} : gradePart(part, readPart(P.parts,i)));
  const open=res.filter(r=>r.status!=='done');

  if(open.every(r=>r.status==='empty')){
    if(bl.any && bl.msg) setFb('bad','<p>'+bl.msg+'</p>');
    else if(bl.any && bl.allOK) setFb('info','<p>The setup is right. Now run the numbers and enter your answer'+(multi?'s':'')+'.</p>');
    else if(bl.any) setFb('info','<p>Good so far. Fill in the remaining blanks, then calculate.</p>');
    else setFb('info','<p>Enter your answer'+(multi?'s':'')+', then select Check answer'+(multi?'s':'')+'.</p>');
    return;
  }
  const inv=res.findIndex(r=>r.status==='invalid');
  if(inv>=0){ setFb('info','<p>'+tagOf(inv)+res[inv].msg+'</p>'); return; }

  const wrong=[], sigs=[], newlyRight=[];
  res.forEach((r,i)=>{
    if(r.status==='correct' || r.status==='sig'){ S.partDone[i]=true; markPart(P.parts,i,true); newlyRight.push(i); if(r.status==='sig') sigs.push(i); }
    else if(r.status==='wrong' || r.status==='close'){ markPart(P.parts,i,false); wrong.push(i); }
  });
  const sigNote=sigs.map(i=>sigMsg(P.parts[i], tagOf(i))).join('');

  if(P.parts.every((p,i)=>S.partDone[i])){
    S.done=true; S.solved++; S.streak++;
    let html = multi
      ? '<p><b>All parts correct.</b> '+P.parts.map((p,i)=>'('+LET[i]+') '+p.show).join('; ')+'</p>'+sigNote
      : (sigs.length ? sigMsg(P.parts[0], '<b>Correct value.</b> ') : '<p><b>Correct.</b> '+P.parts[0].show+'</p>');
    if(S.streak>=2 && S.mode!=='solo'){
      html+='<p>That is '+S.streak+' in a row. Ready for less help?</p>'+
            '<button type="button" class="btn inline" data-act="levelup">Try one '+(S.mode==='guided'?'with hints only if you ask':'on your own')+'</button>';
    }
    setFb('ok', html); lock();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+P.solution+'</details>';
    drawActions(kind); drawTally(kind);
    const nx=$('#actions [data-act="next"]'); if(nx) nx.focus();
    return;
  }
  if(wrong.length){
    S.misses++; S.streak=0;
    let msg;
    if(!multi) msg='<p>'+(bl.msg || res[0].msg)+'</p>';
    else msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+wrong.map(i=>'<p>'+tagOf(i)+res[i].msg+'</p>').join('')+sigNote;
    if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
    const onlyClose = !bl.msg && wrong.every(i=>res[i].status==='close');
    setFb(onlyClose ? 'warn' : 'bad', msg);
  } else {
    const todo=P.parts.map((p,i)=>i).filter(i=>!S.partDone[i]);
    const rest='part'+(todo.length>1?'s ':' ')+todo.map(i=>'('+LET[i]+')').join(' and ');
    const msg=(bl.msg ? '<p><b>Setup.</b> '+bl.msg+'</p>' : '')+
      '<p>'+(newlyRight.length ? 'Right so far. ' : '')+'Now answer '+rest+'.</p>'+sigNote;
    setFb(bl.msg ? 'bad' : 'info', msg);
  }
  drawActions(kind); drawTally(kind);
}
function revealSolution(kind){
  const S=state[kind];
  S.done=true; S.streak=0; lock();
  $('#sol').innerHTML=S.P.solution;
  setFb('info','<p>Read through each step, then try a new problem with different numbers.</p>');
  drawActions(kind); drawTally(kind);
}

function checkHess(){
  const S=state.hess, P=S.P; if(S.done) return;
  const eff=hessEff(S.ch), N=hessNet(P,S.ch);
  // The ΔH blanks follow whatever the student has done to each equation.
  let any=false, allOK=true, bmsg='';
  P.eqs.forEach((e,i)=>{
    const inp=$('#hb'+i); if(!inp) return;
    const raw=inp.value.trim(); inp.classList.remove('ok','no'); inp.removeAttribute('aria-invalid');
    if(!raw){ allOK=false; return; }
    any=true;
    const pv=parseInput(raw), v=pv ? pv.value : NaN, want=eff[i]*e.dH, good=Math.abs(v-want)<=0.06;
    inp.classList.add(good?'ok':'no');
    if(!good){
      inp.setAttribute('aria-invalid','true'); allOK=false;
      if(!bmsg){
        if(Math.abs(v+want)<=0.06) bmsg='Check the sign of '+DH+' for your version of equation '+(i+1)+'. Reversing an equation changes the sign of its '+DH+'.';
        else if(Math.abs(Math.abs(v)-Math.abs(e.dH))<=0.06 && S.ch[i].mult!==1) bmsg='You multiplied equation '+(i+1)+' by '+coefTxt(S.ch[i].mult)+', so its '+DH+' has to be multiplied by '+coefTxt(S.ch[i].mult)+' as well.';
        else bmsg='Check '+DH+' for your version of equation '+(i+1)+'. Start from '+plus(fx(e.dH,1))+' kJ and apply the same changes you made to the equation.';
      }
    }
  });
  const part=hessPart(P,S.ch), res=gradePart(part, $('#pin0').value);
  if(res.status==='empty'){
    if(bmsg) setFb('bad','<p>'+bmsg+'</p>');
    else if(N.match && any && allOK) setFb('info','<p>Your equations add up to the target and each '+DH+' is right. Now add the '+DH+' values.</p>');
    else if(N.match) setFb('info','<p>Your equations add up to the target. Change each '+DH+' the same way as its equation, then add them.</p>');
    else setFb('info','<p>Arrange the equations so they add up to the target, then enter '+DH+' for the target.</p>');
    return;
  }
  if(res.status==='invalid'){ setFb('info','<p>'+res.msg+'</p>'); return; }
  const pin=$('#pin0'), pm=$('#pm0');
  if(res.status==='correct'){
    S.done=true; S.solved++; S.streak++;
    pin.classList.remove('no'); pin.classList.add('ok'); pm.className='pmark ok'; pm.textContent='✓';
    let html='<p><b>Correct.</b> '+DH+' = '+part.show+'</p>';
    if(S.streak>=2 && S.mode!=='solo'){
      html+='<p>That is '+S.streak+' in a row. Ready for less help?</p>'+
            '<button type="button" class="btn inline" data-act="levelup">Try one '+(S.mode==='guided'?'with hints only if you ask':'on your own')+'</button>';
    }
    setFb('ok',html); lock();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+hessSolution(P)+'</details>';
    hessActions(); hessTally();
    const nx=$('#actions [data-act="next"]'); if(nx) nx.focus();
    return;
  }
  S.misses++; S.streak=0;
  pin.classList.remove('ok'); pin.classList.add('no'); pm.className='pmark no'; pm.textContent='✗';
  let msg='<p>'+(bmsg || res.msg)+'</p>';
  if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
  setFb(res.status==='close' && !bmsg ? 'warn' : 'bad', msg);
  hessActions(); hessTally();
}

function labDo(what, arg){
  const S=state.lab, L=S.L, d=S.d; if(S.busy || S.done) return;
  if(what==='weigh'){ d.mm=L.mMetal; S.stage++; }
  else if(what==='water'){ d.vw=arg; d.mw=labWater(arg); S.stage++; }
  else if(what==='acid'){ d.Va=arg; S.stage++; }
  else if(what==='base'){ d.Vb=arg; S.stage++; }
  else if(what==='scoop'){ S.scoops=(S.scoops||0)+0.9+Math.random()*1.3; d.msLive=S.scoops.toFixed(2); }
  else if(what==='useSalt'){ d.ms=d.msLive; S.stage++; }
  else if(what==='heat'){
    S.busy=true; paintLab();
    setTimeout(()=>{ if(state.lab.L!==L) return; S.busy=false; d.Tm=L.Tbath; S.stage++; if(state.tab==='lab') paintLab(); }, 2200);
    return;
  }
  else if(what==='start'){
    S.stage++; S.log=[]; S.t=0;
    S.yr=[Math.floor(L.Troom)-2, Math.ceil(L.Troom)+2];
    S.log.push({t:0, T:labRead(L.Troom)});
    S.timer=setInterval(labTick, 100);     // one simulated second every tenth of a second
  }
  else if(what==='mix'){
    d.Ti=S.log[S.log.length-1].T.toFixed(2);
    S.sim=labMix(L,d); S.mixedAt=S.t; S.stage++;
    // Set the graph range from where the temperature is heading.
    const probe=labMix(L,d); let lo=L.Troom, hi=L.Troom;
    for(let i=0;i<LAB_END;i++){ const T=labStep(probe,1); lo=Math.min(lo,T); hi=Math.max(hi,T); }
    S.yr=[Math.floor(lo-0.6), Math.ceil(hi+0.6)];
  }
  else if(what==='record'){
    const last=S.log[S.log.length-1];
    d.Tf=last.T.toFixed(2); S.rec={t:last.t, T:last.T};
    S.partDone=[]; $('#fb').className='fb';
    drawLabParts();
  }
  paintLab();
}
function labTick(){
  const S=state.lab, L=S.L;
  if(state.tab!=='lab'){ stopLabTimer(); return; }
  // Hold the clock once a baseline is on the graph, until the contents are mixed.
  if(S.mixedAt===null && S.t>=30){ return; }
  S.t+=1;
  const T = S.sim ? labStep(S.sim,1) : L.Troom;
  S.log.push({t:S.t, T:labRead(T)});
  if(S.t>=LAB_END) stopLabTimer();
  paintGraph(); paintBench(); paintStatus();
  if(!S.timer){ paintSteps(); }
}
const labNow = () => { const S=state.lab; return S.log.length ? S.log[S.log.length-1].T : S.L.Troom; };
function paintLab(){ paintSteps(); paintBench(); paintGraph(); paintNotebook(); paintStatus(); }
function paintSteps(){
  const S=state.lab, L=S.L, steps=labSteps(L), cur=steps[S.stage] ? steps[S.stage][0] : null;
  $('#steps').innerHTML=steps.map((s,i)=>{
    const done = i<S.stage || (s[0]==='record' && S.d.Tf);
    return '<li class="'+(done ? 'done' : i===S.stage ? 'now' : '')+'">'+(done ? '<span aria-hidden="true">✓ </span>' : '')+s[1]+'</li>';
  }).join('');
  const B=(what,label,arg,primary)=>'<button type="button" class="btn'+(primary?' primary':'')+'" data-do="'+what+'"'+(arg?' data-arg="'+arg+'"':'')+(S.busy||S.done?' disabled':'')+'>'+label+'</button>';
  let out='';
  if(cur==='weigh') out=B('weigh','Weigh the metal',null,true);
  else if(cur==='water') out=['50.0','75.0','100.0'].map(v=>B('water','Add '+v+' mL',v)).join('');
  else if(cur==='heat') out=B('heat', S.busy ? 'Heating…' : 'Heat the metal',null,true);
  else if(cur==='acid') out=['25.0','50.0'].map(v=>B('acid','Measure '+v+' mL',v)).join('');
  else if(cur==='base') out=['25.0','50.0'].map(v=>B('base','Measure '+v+' mL',v)).join('');
  else if(cur==='scoop'){
    const ms=S.scoops||0;
    out=(ms<10 ? B('scoop','Add a scoop') : '')+(ms>=2 ? B('useSalt','Use '+S.d.msLive+' g',null,true) : '');
  }
  else if(cur==='start') out=B('start','Start recording',null,true);
  else if(cur==='mix') out=B('mix', L.exp==='metal' ? 'Transfer the metal' : L.exp==='neut' ? 'Pour in the base' : 'Add the solid', null, true);
  else if(cur==='record') out=B('record', S.d.Tf ? 'Record again at this temperature' : 'Record this temperature', null, !S.d.Tf);
  $('#stepbtns').innerHTML=out;
}
function paintStatus(){
  const S=state.lab, L=S.L, steps=labSteps(L), cur=steps[S.stage] ? steps[S.stage][0] : null;
  let s;
  if(S.done) s='Experiment complete.';
  else if(S.busy) s='The metal is heating in the boiling water. Give it time to reach the bath temperature.';
  else if(cur==='scoop') s = S.scoops ? 'The balance reads '+S.d.msLive+' g.'+(S.scoops<2 ? ' Add more: you need at least 2 g.' : '') : 'The weighing boat is empty and tared.';
  else if(cur==='mix') s='Recording. The temperature is steady at '+labNow().toFixed(2)+' °C. This is your starting temperature.';
  else if(cur==='record'){
    const run=!!S.timer;
    s = (run ? 'The probe reads '+labNow().toFixed(2)+' °C.' : 'Data collection has stopped at '+labNow().toFixed(2)+' °C.')+
        (S.d.Tf ? ' You recorded '+S.d.Tf+' °C. You can record again if you think a different moment is better.' : run ? ' Watch the graph and record when the temperature stops changing.' : ' Record the temperature, or run the sample again to catch the peak.');
  }

// Temperature against time. One series, so the title names it and there is no legend.
const G={w:360,h:230,l:46,r:14,t:16,b:40};
function gScale(){
  const S=state.lab, yr=S.yr || [Math.floor(S.L.Troom)-2, Math.ceil(S.L.Troom)+2];
  const X=t=>G.l+t/LAB_END*(G.w-G.l-G.r), Y=T=>G.t+(yr[1]-T)/(yr[1]-yr[0])*(G.h-G.t-G.b);
  return {X,Y,yr};
}
function paintGraph(){

  g+='<line x1="'+G.l+'" y1="'+(G.h-G.b)+'" x2="'+(G.w-G.r)+'" y2="'+(G.h-G.b)+'" stroke="#b9c0cb" stroke-width="1"/>';
  g+='<text x="'+((G.l+G.w-G.r)/2)+'" y="'+(G.h-6)+'" font-size="11" text-anchor="middle" fill="'+mute+'">Time (s)</text>';

  if(S.mixedAt!==null){
    g+='<line x1="'+X(S.mixedAt)+'" y1="'+G.t+'" x2="'+X(S.mixedAt)+'" y2="'+(G.h-G.b)+'" stroke="#b9c0cb" stroke-width="1"/>'+
       '<text x="'+(X(S.mixedAt)+4)+'" y="'+(G.t+9)+'" font-size="10" fill="'+mute+'">mixed</text>';

function labHover(e){
  const S=state.lab; if(!S.log.length) return;

// How well the final temperature was chosen, judged against the whole run.
function labTechnique(){
  const S=state.lab, after=S.log.filter(p=>p.t>S.mixedAt), start=Number(S.d.Ti);
  const sim=labMix(S.L,S.d); let ext=start, tExt=S.mixedAt;
  for(let i=1;i<=LAB_END;i++){ const T=labStep(sim,1); if(Math.abs(T-start)>Math.abs(ext-start)){ ext=T; tExt=S.mixedAt+i; } }
  const short=Math.abs(ext-S.rec.T), up=ext>start;
  if(short<=0.10) return 'You recorded the temperature right at its '+(up?'highest':'lowest')+' point.';
  if(S.rec.t<tExt) return 'You recorded while the temperature was still '+(up?'rising':'falling')+', about '+short.toFixed(2)+' °C short of where it ended up. Waiting until the reading levels off gives a better result.';
  return 'You recorded after the temperature had started drifting back toward room temperature, about '+short.toFixed(2)+' °C past its '+(up?'highest':'lowest')+' point. Recording at the peak gives a better result.';
}
function checkLab(){
  const S=state.lab, L=S.L, d=S.d; if(S.done || !d.Tf) return;
  if(Math.abs(Number(d.Tf)-Number(d.Ti))<0.05){
    setFb('info','<p>The temperature you recorded is the same as the starting temperature, so there is nothing to calculate yet. Record again once the temperature has changed.</p>'); return;
  }
  const parts=labParts(L,d), tagOf=i=>'<b>('+LET[i]+')</b> ';
  const res=parts.map((part,i)=> S.partDone[i] ? {status:'done'} : gradePart(part, readPart(parts,i)));
  if(res.filter(r=>r.status!=='done').every(r=>r.status==='empty')){
    setFb('info','<p>Use the values in your lab notebook to work out each part, then enter your answers.</p>'); return;
  }
  const inv=res.findIndex(r=>r.status==='invalid');
  if(inv>=0){ setFb('info','<p>'+tagOf(inv)+res[inv].msg+'</p>'); return; }
  const wrong=[], sigs=[];
  res.forEach((r,i)=>{
    if(r.status==='correct' || r.status==='sig'){ S.partDone[i]=true; markPart(parts,i,true); if(r.status==='sig') sigs.push(i); }
    else if(r.status==='wrong' || r.status==='close'){ markPart(parts,i,false); wrong.push(i); }
  });
  const sigNote=sigs.map(i=>'<p>'+tagOf(i)+'The value is right. Your temperature change limits this to '+parts[i].sf+' significant figures: <b>'+parts[i].show+'</b>.</p>').join('');
  if(parts.every((p,i)=>S.partDone[i])){
    S.done=true; S.solved++; stopLabTimer();
    let got, acc, what, extra='';
    if(L.exp==='metal'){
      got=parts[1].answer; acc=L.c; what='The sample was '+L.metal[0]+', with an accepted specific heat of '+L.metal[1]+' '+CU+'.';
      if(parts[2].answer!==L.metal[0]) extra=' Your data point to '+parts[2].answer+', which is a reasonable conclusion from your numbers, but the measurement was off far enough to change the identification.';
    } else if(L.exp==='neut'){ got=parts[2].answer; acc=H_NEUT; what='The accepted value for a strong acid and a strong base is '+fx(H_NEUT,1)+' kJ/mol.'; }
    else { got=parts[2].answer; acc=L.H; what='The accepted enthalpy of solution of '+L.name+' is '+plus(fx(L.H,1))+' kJ/mol.'; }
    const pe=Math.abs(got-acc)/Math.abs(acc)*100;
    setFb('ok','<p><b>Your calculations are correct.</b> '+parts.map((p,i)=>'('+LET[i]+') '+p.show).join('; ')+'</p>'+sigNote+
      '<p>'+what+' Your result is off by '+pe.toFixed(1)+'%.'+extra+'</p>'+
      '<p>'+labTechnique()+' Even with perfect technique, a coffee cup lets a little heat escape, so results come out slightly small.</p>');
    lock(); paintSteps(); paintStatus();
    $('#sol').innerHTML='<details class="soldet"><summary>See the worked solution</summary>'+labSolution(L,d)+'</details>';
    labActions();
    $('#tally').textContent='Experiments completed this session: '+S.solved;
    return;
  }
  if(wrong.length){
    S.misses++;
    let msg=wrong.map(i=>'<p>'+tagOf(i)+res[i].msg+'</p>').join('')+sigNote;
    if(S.misses===2) msg+='<p>You can try again or open the worked solution below.</p>';
    setFb(wrong.every(i=>res[i].status==='close') ? 'warn' : 'bad', msg);
  } else {
    const todo=parts.map((p,i)=>i).filter(i=>!S.partDone[i]);
    setFb('info','<p>Right so far. Now answer part'+(todo.length>1?'s ':' ')+todo.map(i=>'('+LET[i]+')').join(' and ')+'.</p>'+sigNote);
  }
  labActions();
}

render();
}
